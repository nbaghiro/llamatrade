<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Monolith brand mark: ink box, signal-orange frame, LT monogram -->
  <rect width="300" height="300" fill="#0d0d0d"/>
  <rect x="10" y="10" width="280" height="280" fill="none" stroke="#ff4d1c" stroke-width="20"/>
  <g transform="translate(38,56) scale(1.8)">
    <!-- L — bone -->
    <g fill="#fbf8f1">
      <rect x="30" y="26" width="17" height="52"/>
      <rect x="30" y="61" width="39" height="17"/>
    </g>
    <!-- T — signal orange -->
    <rect x="54" y="26" width="40" height="17" fill="#ff4d1c"/>
    <rect x="68" y="26" width="17" height="52" fill="#ff4d1c"/>
  </g>
</svg>
