<style>
/* B Session, Slate */
:root {
--p-bg: #0b0e11; --p-card: #13171b; --p-ink: #e6eaee; --p-ink2: #aab3bd; --p-ink3: #7f8994; --p-line: #20272e; --p-line2: #323b44;
--p-acc: #4cc2ff; --p-acc-ink: #04121c; --p-acc-soft: rgba(76,194,255,0.14);
--a-bg: #0f1316; --a-panel: #151a1f; --a-sunk: #1c2228; --a-line: #252c34; --a-line2: #36404a; --a-text: #e6eaee; --a-text2: #aab3bd; --a-text3: #7f8994;
--a-acc: #4cc2ff; --a-acc-ink: #04121c; --a-acc-soft: rgba(76,194,255,0.14); --a-gain: #3fbf7a; --a-loss: #f2555a; --a-risk: #f0a63a; --a-risk-soft: rgba(240,166,58,0.1); --a-risk-line: rgba(240,166,58,0.45);

}
/* B Session, Black (default) */
html[data-theme="black"] {

--a-bg: #0a0a0a; --a-panel: #111111; --a-sunk: #181818; --a-line: #222222; --a-line2: #2e2e2e; --a-text: #ededed; --a-text2: #a3a3a3; --a-text3: #767676;
--a-grid: #242424; --a-h1: #ededed; --a-h2: #a3a3a3; --a-h3: #767676; --a-h4: #4d4d4d; --a-h5: #2e2e2e; --a-bar: #0e0e0e; --a-dot: #333333; --a-win-line: #262626; --a-key: 0 2px 0 #2e2e2e; --a-hatch: rgba(237,237,237,0.16);
--a-shadow: 0 40px 80px -40px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05); --a-scrim: rgba(0,0,0,0.66);
}
html[data-acc="cyan"] { --p-acc: #4cc2ff; --p-acc-ink: #04121c; --p-acc-soft: rgba(76,194,255,0.14); --a-acc: #4cc2ff; --a-acc-ink: #04121c; --a-acc-soft: rgba(76,194,255,0.14); }
html[data-acc="white"] { --p-acc: #dbe3f0; --p-acc-ink: #0b1220; --p-acc-soft: rgba(219,227,240,0.12); --a-acc: #dbe3f0; --a-acc-ink: #0b1220; --a-acc-soft: rgba(219,227,240,0.12); }
html[data-acc="amber"] { --p-acc: #ffc24b; --p-acc-ink: #1f1500; --p-acc-soft: rgba(255,194,75,0.14); --a-acc: #ffc24b; --a-acc-ink: #1f1500; --a-acc-soft: rgba(255,194,75,0.14); }
html[data-acc="violet"] { --p-acc: #a78bfa; --p-acc-ink: #14082e; --p-acc-soft: rgba(167,139,250,0.16); --a-acc: #a78bfa; --a-acc-ink: #14082e; --a-acc-soft: rgba(167,139,250,0.16); }
html[data-acc="silver"] { --p-acc: #a1a1aa; --p-acc-ink: #0a0a0a; --p-acc-soft: rgba(161,161,170,0.16); --a-acc: #a1a1aa; --a-acc-ink: #0a0a0a; --a-acc-soft: rgba(161,161,170,0.16); }
html[data-acc="orange"] { --p-acc: #ff9f43; --p-acc-ink: #1f1000; --p-acc-soft: rgba(255,159,67,0.16); --a-acc: #ff9f43; --a-acc-ink: #1f1000; --a-acc-soft: rgba(255,159,67,0.16); }
html[data-acc="lime"] { --p-acc: #d9f05c; --p-acc-ink: #141a00; --p-acc-soft: rgba(217,240,92,0.16); --a-acc: #d9f05c; --a-acc-ink: #141a00; --a-acc-soft: rgba(217,240,92,0.16); }
html[data-acc="teal"] { --p-acc: #2dd4bf; --p-acc-ink: #031a17; --p-acc-soft: rgba(45,212,191,0.16); --a-acc: #2dd4bf; --a-acc-ink: #031a17; --a-acc-soft: rgba(45,212,191,0.16); }
html[data-acc="indigo"] { --p-acc: #818cf8; --p-acc-ink: #0b0b2e; --p-acc-soft: rgba(129,140,248,0.16); --a-acc: #818cf8; --a-acc-ink: #0b0b2e; --a-acc-soft: rgba(129,140,248,0.16); }
html[data-acc="lilac"] { --p-acc: #d8b4fe; --p-acc-ink: #1e0b33; --p-acc-soft: rgba(216,180,254,0.16); --a-acc: #d8b4fe; --a-acc-ink: #1e0b33; --a-acc-soft: rgba(216,180,254,0.16); }
html[data-acc="pink"] { --p-acc: #f472b6; --p-acc-ink: #2b0618; --p-acc-soft: rgba(244,114,182,0.16); --a-acc: #f472b6; --a-acc-ink: #2b0618; --a-acc-soft: rgba(244,114,182,0.16); }
html[data-acc="blue"] { --p-acc: #5b8cff; --acc-fill: #2563eb; --p-acc-ink: #ffffff; --p-acc-soft: rgba(91,140,255,0.16); --a-acc: #5b8cff; --a-acc-ink: #ffffff; --a-acc-soft: rgba(91,140,255,0.16); }

/* Page */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--p-bg); }
body { margin: 0; color: var(--p-ink); background: var(--p-bg); font: 400 15px/1.6 "Chivo", system-ui, sans-serif; overflow-x: hidden; }
a { color: var(--p-acc); text-decoration: none; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 28px; }
.kick { font: 500 13px "Chivo Mono", monospace; color: var(--p-ink3); }
.intro { padding: 60px 0 10px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: end; }
.intro h1 { font: 600 42px/1.08 "Chivo", sans-serif; letter-spacing: -0.025em; margin: 12px 0 16px; }
.intro p { margin: 0 0 10px; color: var(--p-ink2); font-size: 16px; max-width: 700px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--p-line); border-radius: 4px; background: var(--p-card); }
.facts > div { padding: 14px 16px; border-right: 1px solid var(--p-line); }
.facts > div:last-child { border-right: 0; }
.facts b { display: block; font: 500 24px/1.2 "Chivo Mono", monospace; letter-spacing: -0.02em; }
.facts span { font-size: 12.5px; color: var(--p-ink3); }
.toc { margin: 44px 0 0; border-top: 1px solid var(--p-line2); padding-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 32px; }
.toc h2 { margin: 0 0 6px; font: 600 13px "Chivo", sans-serif; display: flex; gap: 8px; align-items: baseline; }
.toc h2 em { font: 400 12px "Chivo Mono", monospace; color: var(--p-ink3); font-style: normal; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { color: var(--p-ink2); font-size: 13.5px; display: flex; gap: 10px; }
.toc a:hover { color: var(--p-ink); }
.toc a em { font: 400 11.5px/1.9 "Chivo Mono", monospace; color: var(--p-ink3); font-style: normal; min-width: 26px; }
.toc a b { font-weight: 400; color: var(--p-ink3); margin-left: auto; font-size: 12px; }
.flow { padding-top: 96px; }
.flow-h { border-top: 1px solid var(--p-line2); padding-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: end; }
.flow-h h2 { margin: 6px 0 0; font: 600 32px/1.1 "Chivo", sans-serif; letter-spacing: -0.02em; }
.flow-h p { margin: 0; color: var(--p-ink2); font-size: 15px; max-width: 620px; }
.scr { padding-top: 64px; }
.scr-h { display: grid; grid-template-columns: 56px 1fr; gap: 4px 14px; align-items: baseline; }
.scr-h em { font: 500 13px "Chivo Mono", monospace; color: var(--p-ink3); font-style: normal; }
.scr-h h3 { margin: 0; font: 600 23px/1.2 "Chivo", sans-serif; letter-spacing: -0.015em; }
.scr-h p { grid-column: 2; margin: 2px 0 0; color: var(--p-ink2); font-size: 14.5px; max-width: 880px; }
.var { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--p-line); }
.var-h { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.var-h .ltr { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--p-line2); font: 500 12.5px "Chivo Mono", monospace; color: var(--p-ink2); flex: none; }
.var-h h4 { margin: 0; font: 600 16px/1.3 "Chivo", sans-serif; }
.var-h .rec { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--p-acc-soft); color: var(--p-acc); font: 600 11.5px/1 "Chivo", sans-serif; }
.var-h .rec::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.var.is-rec .ltr { background: var(--acc-fill, var(--p-acc)); color: var(--p-acc-ink); box-shadow: none; }
.pair { display: grid; grid-template-columns: minmax(0, 3.24fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.pair > * { min-width: 0; }
.cap { margin-top: 10px; font-size: 12.5px; color: var(--p-ink3); text-align: center; }
.note { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 22px; }
.note > div { min-width: 0; }
.note h5 { margin: 0 0 4px; font: 500 12px "Chivo Mono", monospace; color: var(--p-ink3); }
.note p { margin: 0; font-size: 14px; color: var(--p-ink2); }
.pick { margin-top: 30px; padding: 16px 18px; border-radius: 4px; background: var(--p-card); box-shadow: inset 0 0 0 1px var(--p-line), inset 3px 0 0 var(--p-acc); display: grid; grid-template-columns: 150px 1fr; gap: 6px 18px; }
.pick h5 { margin: 0; font: 500 12px/1.9 "Chivo Mono", monospace; color: var(--p-ink3); }
.pick p { margin: 0; font-size: 14.5px; color: var(--p-ink2); }
.pick p b { color: var(--p-ink); font-weight: 600; }
.plan { margin-top: 22px; border: 1px solid var(--p-line); border-radius: 4px; background: var(--p-card); overflow: hidden; }
.plan > div { display: grid; grid-template-columns: 210px 200px minmax(0, 1fr); gap: 20px; padding: 14px 18px; border-bottom: 1px solid var(--p-line); font-size: 14px; color: var(--p-ink2); }
.plan > div:last-child { border-bottom: 0; }
.plan > div.h { font: 500 12px "Chivo Mono", monospace; color: var(--p-ink3); padding-top: 10px; padding-bottom: 10px; }
.plan b { color: var(--p-ink); font-weight: 600; }
.plan .pk { color: var(--p-ink); }
.plan .pk em { font: 500 12px "Chivo Mono", monospace; color: var(--p-acc); font-style: normal; margin-right: 6px; }
.order { margin: 26px 0 0; padding: 0; list-style: none; counter-reset: o; display: grid; gap: 10px; max-width: 900px; }
.order li { counter-increment: o; display: grid; grid-template-columns: 36px 1fr; color: var(--p-ink2); font-size: 14.5px; }
.order li::before { content: counter(o, decimal-leading-zero); font: 500 12.5px/1.9 "Chivo Mono", monospace; color: var(--p-ink3); }
.order li b { color: var(--p-ink); font-weight: 600; }
.foot { padding: 80px 0 64px; color: var(--p-ink3); font-size: 13px; }
.foot .wrap > div { border-top: 1px solid var(--p-line); padding-top: 18px; }
@media (max-width: 1100px) {
    .intro, .flow-h { grid-template-columns: 1fr; gap: 22px; }
    .toc { grid-template-columns: 1fr 1fr; }
    .note { grid-template-columns: 1fr; gap: 14px; }
    .plan > div { grid-template-columns: 1fr 1fr; }
    .plan > div > :last-child { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
    .wrap { padding: 0 16px; }
    .intro { padding-top: 34px; }
    .intro h1 { font-size: 30px; }
    .facts b { font-size: 19px; }
    .facts > div { padding: 12px; }
    .toc { grid-template-columns: 1fr; }
    .flow { padding-top: 64px; }
    .flow-h h2 { font-size: 26px; }
    .scr-h { grid-template-columns: 40px 1fr; }
    .scr-h h3 { font-size: 20px; }
    .pair { grid-template-columns: 1fr; gap: 22px; }
    .pair > .ph { width: 74%; margin: 0 auto; }
    .pick { grid-template-columns: 1fr; }
    .plan > div { grid-template-columns: 1fr; gap: 4px; }
    .plan > div.h { display: none; }
}

/* Frames */
.frame { position: relative; overflow: hidden; }
.frame > .in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.win { background: var(--a-bg); color: var(--a-text); border-radius: var(--a-win-r); overflow: hidden; box-shadow: var(--a-shadow); border: 1px solid var(--a-win-line); }
.win-bar { height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--a-bar); border-bottom: 1px solid var(--a-line); font: 500 12px var(--a-font); color: var(--a-text3); }
.win-bar .dots { display: flex; gap: 6px; }
.win-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--a-dot); display: block; }
.win-bar .url { margin: 0 auto; transform: translateX(-23px); min-width: 320px; height: 22px; border-radius: 6px; background: var(--a-sunk); display: flex; align-items: center; justify-content: center; gap: 6px; font: 400 11.5px var(--a-font); color: var(--a-text3); padding: 0 12px; }
.phone { position: relative; width: 412px; border-radius: 54px; padding: 11px; background: #0f1013; box-shadow: inset 0 0 0 1.5px #3b3e45, 0 0 0 2px #a3a7ae, 0 0 0 3.5px #2b2d32, var(--a-phone-shadow); }
.phone::after { content: ""; position: absolute; top: 22px; left: 50%; width: 112px; height: 32px; transform: translateX(-50%); border-radius: 999px; background: #050506; z-index: 9; }
.phone .sc { border-radius: 44px; overflow: hidden; height: 844px; background: var(--a-bg); position: relative; }

/* App */
.app { font: 400 13px/1.45 var(--a-font); color: var(--a-text); background: var(--a-bg); overflow: hidden; position: relative; }
.app * { box-sizing: border-box; }
.app.dk { display: flex; flex-direction: column; }
.app.dk > .main { flex: 1; min-height: 0; }
.app-nav { height: 48px; flex: none; display: flex; align-items: center; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--a-line); background: var(--a-panel); }
.app-nav .lg { font: 600 15px var(--a-font); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.app-nav nav { display: flex; gap: 4px; }
.app-nav nav span { padding: 6px 10px; border-radius: var(--a-r); color: var(--a-text2); font-size: 12.5px; }
.app-nav nav span.on { color: var(--a-text); background: var(--a-sunk); font-weight: 500; }
.app-nav .end { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--a-text3); font-size: 12px; }
.app-nav .end .mkt { display: inline-flex; align-items: center; gap: 6px; }
.ltm { width: 20px; height: 20px; display: block; flex: none; --lacc: var(--acc-fill, var(--a-acc)); color: var(--a-text); }
.av { width: 26px; height: 26px; border-radius: 50%; background: var(--a-acc-soft); color: var(--a-acc); display: grid; place-items: center; font: 600 10.5px var(--a-font); }
.bell { position: relative; color: var(--a-text2); display: grid; place-items: center; width: 26px; height: 26px; }
.bell b { position: absolute; top: 0; right: -2px; min-width: 14px; height: 14px; border-radius: 999px; background: var(--acc-fill, var(--a-acc)); color: var(--a-acc-ink); font: 600 9px/14px var(--a-num); text-align: center; padding: 0 3px; }
.kbd { font: 500 10.5px/1 var(--a-num); padding: 3px 5px; box-shadow: inset 0 0 0 1px var(--a-line2); border-radius: 2px; color: var(--a-text3); }
.mode { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--a-r); font: 600 10px/1 var(--a-font); letter-spacing: 0.06em; text-transform: uppercase; color: var(--a-text); box-shadow: inset 0 0 0 1px var(--a-line2); background: repeating-linear-gradient(135deg, var(--a-hatch) 0 2px, transparent 2px 5px); white-space: nowrap; }
.main { padding: 18px 20px; display: grid; gap: 14px; align-content: start; grid-auto-rows: max-content; }
.hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hd h3 { margin: 0; font: 600 21px/1.15 var(--a-font); letter-spacing: -0.015em; }
.hd .meta { font-size: 12px; color: var(--a-text3); margin-top: 4px; }
.hd .acts { display: flex; gap: 8px; align-items: center; }
.b { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: var(--a-r); font: 500 12px var(--a-font); box-shadow: inset 0 0 0 1px var(--a-line2); background: var(--a-panel); color: var(--a-text); white-space: nowrap; }
.b.p { background: var(--acc-fill, var(--a-acc)); color: var(--a-acc-ink); box-shadow: none; }
.b.gh { background: transparent; box-shadow: none; color: var(--a-acc); padding: 0 6px; }
.b.dis { opacity: 0.42; }
.b.lg { height: 36px; padding: 0 16px; font-size: 13px; }
.b.full { width: 100%; justify-content: center; }
.b.warn { color: var(--a-risk); box-shadow: inset 0 0 0 1px var(--a-risk-line); }
.b .ico { width: 14px; height: 14px; }
.ico { width: 16px; height: 16px; display: block; flex: none; }
.pn { background: var(--a-panel); border: 1px solid var(--a-line); border-radius: var(--a-pn-r); min-width: 0; overflow: hidden; }
.pn-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--a-line); min-height: 38px; }
.pn-h b { font: 600 13px var(--a-font); }
.pn-h > span { font-size: 11.5px; color: var(--a-text3); }
.pn-b { padding: 12px 14px; }
.pn-f { padding: 10px 14px; border-top: 1px solid var(--a-line); font-size: 12px; color: var(--a-text2); }
.lbl { font: 500 11px var(--a-font); color: var(--a-text3); }
.num { font-family: var(--a-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.gain { color: var(--a-gain); }
.loss { color: var(--a-loss); }
.risk { color: var(--a-risk); }
.acc { color: var(--a-acc); }
.t2 { color: var(--a-text2); }
.t3 { color: var(--a-text3); }
.cells { display: grid; grid-template-columns: repeat(6, 1fr); }
.cells > div { padding: 11px 14px; border-right: 1px solid var(--a-line); min-width: 0; }
.cells > div:last-child { border-right: 0; }
.cells .v { font: 500 19px/1.2 var(--a-num); letter-spacing: -0.02em; margin-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cells .d { font: 400 11px var(--a-num); color: var(--a-text3); white-space: nowrap; margin-top: 2px; }
.cells.c4 { grid-template-columns: repeat(4, 1fr); }
.cells.c3 { grid-template-columns: repeat(3, 1fr); }
.log { font: 400 11.5px/1.8 var(--a-num); color: var(--a-text2); padding: 12px 14px; }
.log > div { display: grid; grid-template-columns: 50px 1fr; gap: 8px; }
.log .ts { color: var(--a-text3); }
.log .ok { color: var(--a-text); }
.log .ok::before { content: "✓ "; color: var(--a-acc); }
.log .now { color: var(--a-text); }
.log .now::before { content: "› "; color: var(--a-acc); }
.log .bad { color: var(--a-risk); }
.log .bad::before { content: "! "; }
.prog { height: 2px; background: var(--a-line); position: relative; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font: 500 11px var(--a-font); background: var(--a-sunk); color: var(--a-text2); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) { .st.run.ping i::after, .spin, .caret { animation: none; } .prog i { transition: none; } }

/* Variation components */
.rpt { max-width: 1080px; margin: 0 auto; width: 100%; padding: 30px 0 40px; display: grid; gap: 30px; }

<main class="wrap" id="app"></main>
<footer class="foot"><div class="wrap"><div>LlamaTrade design · backtests and sessions flows · drawn on the B Session tokens with the shared app data. Paper trading only during the closed beta.</div></div></footer>
<script>
const LT = (() => {
    function mulberry(a) {
        return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function gaussians(seed, n) {
        const r = mulberry(seed);
        const out = [];
        for (let i = 0; i < n; i++) {
            const u = 1 - r();
            const v = r();
            out.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
        }
        return out;
    }
    function tradingDays(start, end) {
        const out = [];
        const d = new Date(start + "T12:00:00Z");
        const e = new Date(end + "T12:00:00Z");
        while (d <= e) {
            const w = d.getUTCDay();
            if (w !== 0 && w !== 6) out.push(new Date(d));
            d.setUTCDate(d.getUTCDate() + 1);
        }
        return out;
    }
    function compound(z, start, end) {
        const n = z.length;
        let s = 0;
        for (let i = 1; i < n; i++) s += z[i];
        const adj = (Math.log(end / start) - s) / (n - 1);
        const out = [start];
        let lv = Math.log(start);
        for (let i = 1; i < n; i++) {
            lv += z[i] + adj;
            out.push(Math.exp(lv));
        }
        return out;
    }
    function shock(z, at, len, amount) {
        for (let i = at; i < at + len && i < z.length; i++) z[i] += amount / len;
    }
    function stats(s, days) {
        const r = [];
        for (let i = 1; i < s.length; i++) r.push(s[i] / s[i - 1] - 1);
        const mean = r.reduce((a, b) => a + b, 0) / r.length;
        const sd = Math.sqrt(r.reduce((a, b) => a + (b - mean) ** 2, 0) / (r.length - 1));
        const down = Math.sqrt(r.reduce((a, b) => a + Math.min(b, 0) ** 2, 0) / r.length);
        let peak = s[0];
        let mdd = 0;
        let mddAt = 0;
        let peakAt = 0;
        let ddPeakAt = 0;
        for (let i = 0; i < s.length; i++) {
            if (s[i] > peak) {
                peak = s[i];
                peakAt = i;
            }
            const dd = s[i] / peak - 1;
            if (dd < mdd) {
                mdd = dd;
                mddAt = i;
                ddPeakAt = peakAt;
            }
        }
        let recoveredAt = -1;
        for (let i = mddAt; i < s.length; i++) {
            if (s[i] >= s[ddPeakAt]) {
                recoveredAt = i;
                break;
            }
        }
        const years = (days[days.length - 1] - days[0]) / (365.25 * 864e5);
        const end = s[s.length - 1];
        return {
            start: s[0],
            end,
            total: end / s[0] - 1,
            cagr: Math.pow(end / s[0], 1 / years) - 1,
            vol: sd * Math.sqrt(252),
            sharpe: (mean / sd) * Math.sqrt(252),
            sortino: (mean / down) * Math.sqrt(252),
            mdd,
            mddAt,
            ddPeakAt,
            recoveredAt,
            recoveryDays: recoveredAt > 0 ? recoveredAt - mddAt : null,
        };
    }
    function drawdown(s) {
        let peak = s[0];
        return s.map((v) => {
            peak = Math.max(peak, v);
            return v / peak - 1;
        });
    }
    function monthly(s, days) {
        const out = [];
        let prev = s[0];
        for (let i = 0; i < s.length; i++) {
            const last = i === s.length - 1 || days[i + 1].getUTCMonth() !== days[i].getUTCMonth();
            if (last) {
                out.push({ y: days[i].getUTCFullYear(), m: days[i].getUTCMonth(), r: s[i] / prev - 1 });
                prev = s[i];
            }
        }
        return out;

    // Recession Radar v3, Nov 1 2024 to Oct 30 2026, $25,000, benchmark SPY.
    function backtest() {

        shock(stratZ, aprIdx + 3, 10, 0.065);
        const spy = compound(spyZ, 25000, 31228.4);
        const strat = compound(stratZ, 25000, 30352.18);
        return {
            days,
            strat,
            spy,
            s: stats(strat, days),
            b: stats(spy, days),
            dd: drawdown(strat),
            ddB: drawdown(spy),

    // Line chart with one y-axis, recessive grid and a crosshair tooltip.
    // opts: { days, series: [{ values, cls, label, area }], height, yFmt, xFmt, xTicks, yTicks,
    //         base (value for area baseline), tip(i) -> html, pad }
    let uid = 0;
    function lineChart(host, opts) {
        host.classList.add("ltc");
        if (opts.reveal !== undefined) host._rv = opts.reveal;
        const tip = document.createElement("div");
        tip.className = "ltc-tip";
        host.appendChild(tip);
        let svg;
        function render() {
            if (svg) svg.remove();
            const W = Math.max(260, host.clientWidth);
            const H = opts.height || 260;
            const pad = Object.assign({ t: 12, r: 12, b: 26, l: 56 }, opts.pad || {});
            if (W < 480) pad.l = Math.min(pad.l, 46);
            svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
            if (opts.label) svg.setAttribute("aria-label", opts.label);
            host.insertBefore(svg, tip);
            const all = opts.series.flatMap((s) => s.values);
            let lo = Math.min(...all, opts.base ?? Infinity);
            let hi = Math.max(...all, opts.ceil ?? -Infinity);
            const span = hi - lo || 1;
            if (opts.base === undefined) lo -= span * 0.06;
            if (opts.ceil === undefined) hi += span * 0.06;
            const n = opts.series[0].values.length;
            const x = (i) => pad.l + (i / (n - 1)) * (W - pad.l - pad.r);
            const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
            const yT = opts.yTicks || 4;
            const g = el("g", { class: "ltc-grid" }, svg);
            for (let k = 0; k <= yT; k++) {
                const v = lo + ((hi - lo) * k) / yT;
                const yy = Math.round(y(v)) + 0.5;
                el("line", { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy }, g);
                const t = el("text", { x: pad.l - 8, y: yy + 4, "text-anchor": "end", class: "ltc-ax" }, g);
                t.textContent = (opts.yFmt || ((v) => v.toFixed(0)))(v);
            }
            if (opts.zeroLine !== undefined) {
                const yy = Math.round(y(opts.zeroLine)) + 0.5;
                el("line", { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy, class: "ltc-zero" }, svg);
            }
            const xT = W < 480 ? Math.min(3, opts.xTicks || 5) : opts.xTicks || 5;
            for (let k = 0; k <= xT; k++) {
                const i = Math.round(((n - 1) * k) / xT);
                const t = el("text", {
                    x: x(i),
                    y: H - 6,
                    "text-anchor": k === 0 ? "start" : k === xT ? "end" : "middle",
                    class: "ltc-ax",
                }, svg);
                t.textContent = (opts.xFmt || fmt.mon)(opts.days[i]);
            }
            if (opts.bands) {
                const pid = "hb" + ++uid;
                const pt = el("pattern", { id: pid, width: 5, height: 5, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, el("defs", {}, svg));
                el("line", { x1: 0, y1: 0, x2: 0, y2: 5, class: "ltc-hatch" }, pt);
                opts.bands.forEach((b) => el("rect", { x: x(b.a), y: pad.t, width: Math.max(2, x(b.b) - x(b.a)), height: H - pad.t - pad.b, fill: "url(#" + pid + ")", class: "ltc-band" }, svg));
            }
            const sg = el("g", {}, svg);
            opts.series.forEach((s) => {
                const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
                if (s.area) {
                    const b = y(opts.base ?? lo);
                    el("path", {
                        d: `M${x(0)},${b} L${pts.join(" L")} L${x(n - 1)},${b} Z`,
                        class: s.cls + "-area",
                    }, svg);
                }
                el("path", { d: "M" + pts.join(" L"), class: s.cls, fill: "none" }, svg);
            });
            [...svg.querySelectorAll(":scope > path")].forEach((p) => sg.appendChild(p));
            if (opts.reveal !== undefined) {
                const cid = "rv" + ++uid;
                const cr = el("rect", { x: 0, y: 0, height: H, width: pad.l + (W - pad.l - pad.r) * host._rv }, el("clipPath", { id: cid }, el("defs", {}, svg)));
                sg.setAttribute("clip-path", "url(#" + cid + ")");
                host._reveal = (f) => { host._rv = f; cr.setAttribute("width", pad.l + (W - pad.l - pad.r) * f); };
            }
            let lastX = -99, drop = 0;
            (opts.marks || []).forEach((m) => {
                const v = opts.series[m.s ?? opts.series.length - 1].values[m.i];
                drop = x(m.i) - lastX < 22 && !drop ? 20 : 0;
                lastX = x(m.i);
                const g2 = el("g", { class: "ltc-mk" + (m.on ? " on" : "") }, svg);
                el("line", { x1: x(m.i), x2: x(m.i), y1: pad.t + 9 + drop, y2: y(v), class: "ltc-mk-l" }, g2);
                el("circle", { cx: x(m.i), cy: y(v), r: 2.5, class: "ltc-mk-p" }, g2);
                el("circle", { cx: x(m.i), cy: pad.t + 1 + drop, r: 8.5, class: "ltc-mk-c" }, g2);
                const tt = el("text", { x: x(m.i), y: pad.t + 4.5 + drop, "text-anchor": "middle", class: "ltc-mk-t" }, g2);
                tt.textContent = m.n;
            });
            const cross = el("line", { y1: pad.t, y2: H - pad.b, class: "ltc-cross", visibility: "hidden" }, svg);
            const dots = opts.series.map((s) =>
                el("circle", { r: 4, class: s.cls + "-dot", visibility: "hidden" }, svg),
            );
            const hit = el("rect", {
                x: pad.l, y: 0, width: W - pad.l - pad.r, height: H, fill: "transparent",
            }, svg);
            function move(ev) {
                const r = svg.getBoundingClientRect();
                const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
                const i = Math.max(0, Math.min(n - 1, Math.round(((px - pad.l) / (W - pad.l - pad.r)) * (n - 1))));
                const xx = x(i);
                cross.setAttribute("x1", xx);
                cross.setAttribute("x2", xx);
                cross.setAttribute("visibility", "visible");
                opts.series.forEach((s, k) => {
                    dots[k].setAttribute("cx", xx);
                    dots[k].setAttribute("cy", y(s.values[i]));
                    dots[k].setAttribute("visibility", "visible");
                });
                tip.innerHTML = opts.tip ? opts.tip(i) : "";
                tip.style.display = "block";
                const tw = tip.offsetWidth;
                const left = xx + 14 + tw > W ? xx - 14 - tw : xx + 14;
                tip.style.left = left + "px";
                tip.style.top = pad.t + 4 + "px";
            }
            function leave() {
                cross.setAttribute("visibility", "hidden");
                dots.forEach((d) => d.setAttribute("visibility", "hidden"));
                tip.style.display = "none";
            }
            hit.addEventListener("mousemove", move);
            hit.addEventListener("touchmove", move, { passive: true });
            hit.addEventListener("mouseleave", leave);
            hit.addEventListener("touchend", leave);
        }
        render();
        let last = host.clientWidth;
        new ResizeObserver(() => {
            if (host.clientWidth !== last) {
                last = host.clientWidth;
                render();
            }
        }).observe(host);
    }

    // Monthly returns grid: rows by year, Jan to Dec. cell(r) returns a CSS background.
    function monthlyGrid(host, months, cell) {
        const years = [...new Set(months.map((m) => m.y))];
        let h = '<table class="mg"><thead><tr><th></th>';
        MON.forEach((m) => (h += `<th>${m.slice(0, 1)}<span>${m.slice(1)}</span></th>`));
        h += "<th>Year</th></tr></thead><tbody>";
        years.forEach((y) => {
            h += `<tr><th>${y}</th>`;
            let comp = 1;
            for (let k = 0; k < 12; k++) {
                const f = months.find((m) => m.y === y && m.m === k);
                if (f) {
                    comp *= 1 + f.r;
                    h += `<td style="${cell(f.r)}" title="${MON[k]} ${y}: ${fmt.signedPct(f.r)}">${Math.abs(f.r) < 0.0005 ? "0.0" : (f.r < 0 ? "−" : "") + Math.abs(f.r * 100).toFixed(1)}</td>`;
                } else h += '<td class="mg-none"></td>';
            }
            h += `<td class="mg-year">${fmt.signedPct(comp - 1)}</td></tr>`;
        });
        host.innerHTML = h + "</tbody></table>";
    }

    return { backtest, accountMonth, lineChart, monthlyGrid, fmt, mulberry, tradingDays, MON };
})();

            const [x1, y1] = edge(A, ax + px, ay + py, ux, uy), [x2, y2] = edge(Z, zx + px, zy + py, -ux, -uy);
            const mx = (x1 + x2) / 2 + px * 1.6, my = (y1 + y2) / 2 + py * 1.6;
            const lx = Math.abs(uy) > 0.9 ? mx + (off ? Math.sign(px) * 8 : 8) : mx, ly = Math.abs(uy) > 0.9 ? my + 4 : my + (off ? Math.sign(py || -1) * 6 + (py > 0 ? 8 : 0) : -6);
            svg += `<path class="a" d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" marker-end="url(#fsm-ah)"/><text class="lb" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${Math.abs(uy) > 0.9 ? (px < 0 ? "end" : "start") : "middle"}">${lab}</text>`;
        });
        host.insertAdjacentHTML("afterbegin", svg + "</svg>");
    }

    // Risk and return map
    function scatter(host) {
        const small = host.dataset.small !== undefined;
        const W = Math.max(260, host.clientWidth), H = +host.dataset.h;
        const pad = { l: 42, r: 16, t: 14, b: 30 };
        const xs = (v) => pad.l + ((v + 28) / 28) * (W - pad.l - pad.r);
        const ys = (v) => pad.t + (1 - (v + 2) / 16) * (H - pad.t - pad.b);
        const r = LT.mulberry(7);
        const dim = Array.from({ length: 30 }, () => [-(5 + r() * 19), -1 + r() * 12]);
        const pts = [["Recession Radar v3", S.mdd * 100, S.cagr * 100, 1, -12, 4, "end"], ["Recession Radar v2", -9.6, 8.2, 0, 10, 4, "start"], ["Tech Momentum v2", -21.7, 9.1, 1, 12, 4, "start"], ["All-Weather v1", -12.4, 7.0, 1, 12, 14, "start"], ["Classic 60/40 v1", -13.9, 7.4, 0, -10, -6, "end"], ["Core Four v1", -11.2, 1.1, 0, -10, 4, "end"]];
        let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Runs by annualised return and largest drawdown">`;
        for (let v = -2; v <= 14; v += 4) s += `<line class="sc-refl" x1="${pad.l}" x2="${W - pad.r}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ltc-ax" x="${pad.l - 8}" y="${ys(v) + 3.5}" text-anchor="end">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}%</text>`;
        for (let v = -28; v <= 0; v += small ? 14 : 7) s += `<text class="ltc-ax" x="${xs(v)}" y="${H - 8}" text-anchor="${v === -28 ? "start" : v === 0 ? "end" : "middle"}">${v ? "−" + Math.abs(v) + "%" : "0%"}</text>`;
        dim.forEach(([x, y]) => (s += `<circle class="sc-pt dim" cx="${xs(x)}" cy="${ys(y)}" r="3.2"/>`));
        const bx = xs(B.mdd * 100), by = ys(B.cagr * 100);
        s += `<path class="sc-ref" d="M${bx - 6} ${by}H${bx + 6}M${bx} ${by - 6}V${by + 6}"/><text class="sc-lab" x="${bx + 9}" y="${by + 4}">SPY</text>`;
        pts.forEach(([n, x, y, on, dx, dy, an]) => {
            if (small && !on) return;
            s += `${on ? `<circle class="sc-ring" cx="${xs(x)}" cy="${ys(y)}" r="9"/>` : ""}<circle class="sc-pt ${on ? "on" : "done"}" cx="${xs(x)}" cy="${ys(y)}" r="${on ? 5 : 4}"/>`;
            if (!small || n === "Recession Radar v3") s += `<text class="sc-lab ${on ? "on" : ""}" x="${xs(x) + dx}" y="${ys(y) + dy}" text-anchor="${an}">${small ? "Radar v3" : n}</text>`;
        });
        s += `<text class="ltc-ax" x="${W - pad.r}" y="${pad.t + 4}" text-anchor="end">smaller drawdown →</text></svg>`;
        host.innerHTML = s;
    }

    // Running state: the log streams, the curve draws and the counters climb, then it completes and starts over.
    const runs = [];
    function setRun(r, f) {
        const fc = Math.min(1, f);
        const i = Math.max(1, Math.round(fc * (bt.days.length - 1)));
        const done = fc >= 1;
        r.querySelectorAll(".prog i").forEach((e) => (e.style.width = (fc * 100).toFixed(1) + "%"));
        r.querySelectorAll("[data-pct]").forEach((e) => (e.textContent = Math.round(fc * 100)));
        r.querySelectorAll("[data-thru]").forEach((e) => (e.textContent = iso(bt.days[i])));
        r.querySelectorAll("[data-el]").forEach((e) => { const t = (0.35 + 3.27 * fc).toFixed(2); e.textContent = e.classList.contains("ts") ? t + "s" : t; });
        const reb = REB.filter((x) => x.i <= i).length;
        r.querySelectorAll("[data-reb]").forEach((e) => (e.textContent = reb));
        r.querySelectorAll("[data-ord]").forEach((e) => (e.textContent = REB.filter((x) => x.i <= i).reduce((a, x) => a + x.c, 0)));
        const ret = bt.strat[i] / 25000 - 1, retb = bt.spy[i] / 25000 - 1, mdd = Math.min(...bt.dd.slice(0, i + 1));
        r.querySelectorAll("[data-ret]").forEach((e) => { e.textContent = sp(ret); e.className = e.className.replace(/ ?(gain|loss)/g, "") + (ret < 0 ? " loss" : " gain"); });
        r.querySelectorAll("[data-retb]").forEach((e) => (e.textContent = sp(retb)));
        r.querySelectorAll("[data-mdd]").forEach((e) => { e.textContent = sp(mdd); e.classList.toggle("loss", mdd < 0); });
        r.querySelectorAll("[data-eqv]").forEach((e) => (e.textContent = fmt.money(bt.strat[i], 0)));
        r.querySelectorAll("[data-fin]").forEach((e) => { e.textContent = done ? e.dataset.fin : "·"; e.classList.toggle("t3", !done); e.classList.toggle("gain", done && e.dataset.fin.startsWith("+")); });
        r.querySelectorAll("[data-at]").forEach((e) => (e.style.display = +e.dataset.at <= fc && (+e.dataset.at < 1 || done) ? "" : "none"));
        r.querySelectorAll("[data-live]").forEach((e) => (e.style.display = done ? "none" : ""));
        r.querySelectorAll("[data-term]").forEach((t) => { const vis = [...t.querySelectorAll("[data-tl]")].filter((e) => e.style.display !== "none"); vis.slice(0, Math.max(0, vis.length - 9)).forEach((e) => (e.style.display = "none")); });
        r.querySelectorAll(".ticks i[data-k]").forEach((e) => { const k = +e.dataset.k; e.classList.toggle("on", REB[k].i <= i); e.classList.toggle("cur", !done && k === reb - 1); });
        r.querySelectorAll("[data-reveal]").forEach((h) => h._reveal && h._reveal(fc));
        r.querySelectorAll("[data-state]").forEach((e) => (e.innerHTML = done ? '<span class="st done"><i></i>Completed in 3.8 s</span>' : '<span class="st run ping"><i></i>Running</span>'));
    }

    fitAll();
    mount(document);
    document.querySelectorAll("[data-run]").forEach((r) => { runs.push(r); setRun(r, 0.62); });
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!still) {
        let f = 0.62;
        setInterval(() => { f += 0.03; if (f > 1.3) f = 0.06; runs.forEach((r) => setRun(r, f)); }, 520);
    }
    let lw = window.innerWidth;
    window.addEventListener("resize", () => { if (window.innerWidth !== lw) { lw = window.innerWidth; fitAll(); } });
    if (document.fonts) document.fonts.ready.then(fitAll, fitAll);
})();
</script>
<script>window.RB_CONFIG = { theme: { key: "lts-theme-b2", def: "slate", opts: [["slate", "Slate"], ["black", "Black"]] }, accent: { key: "lts-acc-b5", def: "cyan", opts: [["cyan", "Cyan", "#4cc2ff"], ["white", "Frost", "#dbe3f0"], ["amber", "Amber", "#ffc24b"], ["violet", "Violet", "#a78bfa"], ["blue", "Blue", "#2563eb"]] } };</script>

</body>
