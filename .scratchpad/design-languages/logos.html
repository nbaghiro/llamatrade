<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LlamaTrade Logos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Cstyle%3E.c%7Bfill:%23111;stroke:%23111%7Dpath.c%7Bfill:none%7D%40media%20(prefers-color-scheme:dark)%7B.c%7Bfill:%23eee;stroke:%23eee%7Dpath.c%7Bfill:none%7D%7D%3C/style%3E%3Cpath%20d=%22M11.5%204v17M16%2013v14M25%2013v14%22%20class=%22c%22%20stroke=%22%23111%22%20stroke-width=%221.6%22%20stroke-linecap=%22round%22/%3E%3Crect%20x=%224.5%22%20y=%228.5%22%20width=%224.5%22%20height=%224.5%22%20rx=%220.8%22%20fill=%22%234cc2ff%22/%3E%3Crect%20x=%229.5%22%20y=%226.5%22%20width=%224%22%20height=%2212%22%20rx=%220.8%22%20class=%22c%22%20fill=%22%23111%22/%3E%3Crect%20x=%2214%22%20y=%2215%22%20width=%224%22%20height=%227%22%20rx=%220.8%22%20class=%22c%22%20fill=%22%23111%22/%3E%3Crect%20x=%2218.5%22%20y=%2215%22%20width=%224%22%20height=%225%22%20rx=%220.8%22%20class=%22c%22%20fill=%22%23111%22/%3E%3Crect%20x=%2223%22%20y=%2215%22%20width=%224%22%20height=%227%22%20rx=%220.8%22%20class=%22c%22%20fill=%22%23111%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Chivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("lts-theme-b2") || "slate"; document.documentElement.dataset.acc = localStorage.getItem("lts-acc-b5") || "slate"; } catch (e) { document.documentElement.dataset.theme = "black"; document.documentElement.dataset.acc = "slate"; }</script>
<style>
:root { --bg: #0b0e11; --card: #13171b; --ink: #e6eaee; --ink2: #aab3bd; --ink3: #7f8994; --line: #20272e; --line2: #323b44; }
html[data-theme="black"] { --bg: #000; --card: #0e0e0e; --ink: #ededed; --ink2: #a3a3a3; --ink3: #767676; --line: #1f1f1f; --line2: #2e2e2e; }
html[data-acc="cyan"] { --acc: #4cc2ff; --acc-fill: #4cc2ff; --acc-ink: #04121c; --acc-light: #0a7fc0; }
html[data-acc="white"] { --acc: #dbe3f0; --acc-fill: #dbe3f0; --acc-ink: #0b1220; --acc-light: #111111; }
html[data-acc="amber"] { --acc: #ffc24b; --acc-fill: #ffc24b; --acc-ink: #1f1500; --acc-light: #b57800; }
html[data-acc="violet"] { --acc: #a78bfa; --acc-fill: #a78bfa; --acc-ink: #14082e; --acc-light: #6d4fe0; }
html[data-acc="silver"] { --acc: #a1a1aa; --acc-fill: #a1a1aa; --acc-ink: #0a0a0a; --acc-light: #52525b; }
html[data-acc="orange"] { --acc: #ff9f43; --acc-fill: #ff9f43; --acc-ink: #1f1000; --acc-light: #b45309; }
html[data-acc="lime"] { --acc: #d9f05c; --acc-fill: #d9f05c; --acc-ink: #141a00; --acc-light: #65730a; }
html[data-acc="teal"] { --acc: #2dd4bf; --acc-fill: #2dd4bf; --acc-ink: #031a17; --acc-light: #0f766e; }
html[data-acc="indigo"] { --acc: #818cf8; --acc-fill: #818cf8; --acc-ink: #0b0b2e; --acc-light: #4f46e5; }
html[data-acc="lilac"] { --acc: #d8b4fe; --acc-fill: #d8b4fe; --acc-ink: #1e0b33; --acc-light: #9333ea; }
html[data-acc="pink"] { --acc: #f472b6; --acc-fill: #f472b6; --acc-ink: #2b0618; --acc-light: #be185d; }
html[data-acc="blue"] { --acc: #5b8cff; --acc-fill: #2563eb; --acc-ink: #ffffff; --acc-light: #2563eb; }
html[data-acc="slate"] { --acc: #8fa4cf; --acc-fill: #475f8a; --acc-ink: #ffffff; --acc-light: #475f8a; }
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 400 15px/1.55 "Chivo", system-ui, sans-serif; overflow-x: hidden; --lacc: var(--acc); }
a { color: var(--acc); text-decoration: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.lt-mark { width: 1.3em; height: 1.3em; flex: none; display: block; }
.lt-word { white-space: nowrap; }
.lt-run { display: inline-flex; align-items: flex-end; gap: 0.3em; white-space: nowrap; border-bottom: 0.0934em solid currentColor; padding-right: 0.15em; line-height: 1.15; }
.lt-run .lt-mark { margin-bottom: -0.0934em; }
.lt-barrun { padding-bottom: 0.32em; background: repeating-linear-gradient(90deg, currentColor 0 0.1em, transparent 0.1em 0.24em) left bottom / 100% 0.16em no-repeat; }
.lt-gridword { padding: 0.18em 0.3em; background-image: linear-gradient(to right, color-mix(in srgb, currentColor 16%, transparent) 1px, transparent 1px), linear-gradient(to bottom, color-mix(in srgb, currentColor 16%, transparent) 1px, transparent 1px); background-size: 0.46em 0.46em; border-radius: 0.12em; box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 30%, transparent); }
.review { border-bottom: 1px solid var(--line); font-size: 13px; background: var(--card); }
.review .wrap { display: flex; gap: 14px 18px; align-items: center; min-height: 38px; flex-wrap: wrap; padding-top: 4px; padding-bottom: 4px; }
.review b { font-weight: 600; }
.review nav { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.review nav a { color: var(--ink2); }
.review nav a[aria-current] { color: var(--ink); font-weight: 600; }
.ctl { display: inline-flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.ctl span { color: var(--ink3); margin-right: 4px; }
.ctl button { border: 0; background: transparent; color: var(--ink2); font: inherit; padding: 3px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.ctl button[aria-pressed="true"] { background: var(--acc-fill); color: var(--acc-ink); }
.ctl button i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 0 1px rgba(255,255,255,0.25); }

.bnav { border-bottom: 1px solid var(--line); background: var(--bg); }
.bnav .wrap { display: flex; align-items: center; gap: 30px; height: 62px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font: 600 18px/1 "Chivo", sans-serif; letter-spacing: -0.01em; color: var(--ink); }
.bnav .links { display: flex; gap: 26px; font-size: 14.5px; color: var(--ink2); }
.bnav .end { margin-left: auto; display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font: 500 14px "Chivo", sans-serif; cursor: pointer; white-space: nowrap; }
.btn.pri { background: var(--acc-fill); border-color: var(--acc-fill); color: var(--acc-ink); }
.btn[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }

.hero { padding: 72px 0 40px; text-align: center; }
.kicker { font: 500 13px "Chivo Mono", monospace; color: var(--ink3); }
.hero h1 { font: 600 42px/1.1 "Chivo", sans-serif; letter-spacing: -0.03em; margin: 12px 0 10px; }
.hero p { color: var(--ink2); margin: 0 auto; max-width: 620px; font-size: 16.5px; }
.big { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 48px auto 8px; font: 700 76px/1 "Chivo", sans-serif; letter-spacing: -0.035em; }
.big .lt-mark { width: 1.4em; height: 1.4em; }
.big-note { color: var(--ink3); font-size: 14px; margin-top: 18px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-bottom: 56px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 26px 26px 22px; display: grid; gap: 22px; min-width: 0; }
.card.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.card-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.card-h h2 { margin: 0; font: 600 19px "Chivo", sans-serif; letter-spacing: -0.01em; }
.card-h .no { font: 500 12px "Chivo Mono", monospace; color: var(--ink3); margin-right: 8px; }
.fav { font: 600 11px "Chivo", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: var(--acc-ink); background: var(--acc-fill); padding: 3px 8px; border-radius: 999px; }
.card p.note { margin: -12px 0 0; color: var(--ink2); font-size: 14.5px; }
.large { display: flex; align-items: center; gap: 18px; font: 700 40px/1 "Chivo", sans-serif; letter-spacing: -0.03em; padding: 26px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); justify-content: center; min-height: 128px; }
.large .lt-mark { width: 1.7em; height: 1.7em; }
.sizes { display: grid; grid-template-columns: auto auto 1fr; gap: 24px; align-items: end; }
.lbl { display: block; font: 500 11.5px "Chivo", sans-serif; color: var(--ink3); margin-top: 8px; }
.tiles { display: flex; gap: 10px; }
.tile { width: 64px; height: 64px; border-radius: 15px; display: grid; place-items: center; }
.tile .lt-mark { width: 40px; height: 40px; }
.tile.k { background: #000; color: #ededed; box-shadow: 0 0 0 1px #2a2a2a; --lacc: var(--acc); }
.tile.s { background: #151a1f; color: #e6eaee; box-shadow: 0 0 0 1px #2b343d; --lacc: var(--acc); }
.tile.l { background: #f4f4f2; color: #141414; --lacc: var(--acc-light); }
.favs { display: flex; gap: 8px; align-items: center; }
.tab { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 8px 8px 0 0; font-size: 12px; white-space: nowrap; }
.tab.d { background: #202124; color: #e8eaed; --lacc: var(--acc); }
.tab.w { background: #ffffff; color: #202124; --lacc: var(--acc-light); box-shadow: 0 0 0 1px #ddd; }
.tab .f16 { width: 16px; height: 16px; }
.f32 { width: 32px; height: 32px; }
.f32w { display: flex; gap: 8px; align-items: center; }
.f32w span { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; }
.navmini { display: flex; align-items: center; gap: 18px; height: 54px; padding: 0 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; color: var(--ink2); overflow: hidden; }
.navmini .logo { font-size: 17px; }
.navmini .x { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 4px; background: var(--acc-fill); color: var(--acc-ink); display: grid; place-items: center; font-weight: 500; white-space: nowrap; }
.card-f { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.picks { color: var(--ink2); font-size: 14.5px; max-width: 760px; margin: 0 auto 40px; text-align: center; }
.picks b { color: var(--ink); }

body { --lacc-ink: var(--acc-ink); }
.fam { padding-top: 40px; }
.fam-h { text-align: center; max-width: 720px; margin: 0 auto 28px; }
.fam-h h2 { font: 600 30px/1.15 "Chivo", sans-serif; letter-spacing: -0.02em; margin: 0 0 8px; }
.fam-h p { color: var(--ink2); margin: 0; }
.fam-h b { color: var(--ink); font-weight: 600; }
.tile.k, .tile.s, .fk { --lacc-ink: var(--acc-ink); }
.tile.l, .fl, .tab.w { --lacc-ink: #ffffff; }
.fk { background: #000; color: #ededed; --lacc: var(--acc); }
.fl { background: #f4f4f2; color: #141414; --lacc: var(--acc-light); }
html[data-acc="white"] .tile.l, html[data-acc="white"] .fl, html[data-acc="white"] .tab.w { --lacc-ink: #ffffff; }
@media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
    .bnav .links { display: none; }
}
@media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .hero h1 { font-size: 30px; }
    .big { font-size: 40px; gap: 14px; }
    .large { font-size: 30px; }
    .sizes { grid-template-columns: 1fr; }
    .card { padding: 20px 18px; }
    .navmini span.nl { display: none; }
    .review nav { margin-left: 0; }
}
</style>
</head>
<body>



<header class="bnav"><div class="wrap"><span class="logo" id="hdr"></span><nav class="links"><span>Build</span><span>Backtest</span><span>Copilot</span><span>Sessions</span><span>Your account</span></nav><div class="end"><span class="btn pri">Request an invite</span></div></div></header>

<main class="wrap">
    <section class="hero">
        <span class="kicker">the chosen mark, and the families it came from</span>
        <h1>LlamaTrade logo directions</h1>
        <p>Pick a mark and it shows in the header above and in the B site's header. Theme and accent apply here too.</p>
        <div class="big" id="big"></div>
        <div class="big-note" id="bignote"></div>
    </section>
    <div id="fams"></div>
</main>

<script>
// LlamaTrade logo marks. Ink is currentColor; the accent is var(--lacc), text on accent is var(--lacc-ink).
const LTL = (() => {
    const A = "var(--lacc)";
    const K = "var(--lacc-ink, #0a0a0a)";
    const svg = (body) => `<svg class="lt-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">${body}</svg>`;
    const P = "M11 29V15c0-4 1.2-7 3-10.5l1.6 4 1.9-4.5 1.3 5c3.6.8 6.4 2.6 6.4 5.4 0 1.9-1.5 3.1-3.6 3.1H17";
    const st = (d, w, cap = "round", c = "currentColor") => `<path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap}" stroke-linejoin="${cap === "round" ? "round" : "miter"}"/>`;
    const eye = (x = 19.6, y = 12.6, r = 1.5) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${A}"/>`;
    const tile = (o = 0.35, f = 0.07) => `<rect x="1.5" y="1.5" width="29" height="29" rx="5" fill="currentColor" fill-opacity="${f}"${o ? ` stroke="currentColor" stroke-opacity="${o}"` : ""}/>`;
    const L0 = (w = 3) => st("M7.5 7v17.5H15", w, "square");
    const T0 = (w = 3) => st("M17.5 7.5h8M21.5 7.5V25", w, "square", A);
    const marks = {
        current: { name: "Previous mark", note: "The mark used before: a chart line in a rounded square.", svg: () => svg(`<rect x="2.5" y="2.5" width="27" height="27" rx="5" stroke="currentColor" stroke-width="2.2"/>` + st("M8 21.5 13.5 15l4.5 3.5 6.5-8.5", 2.2)) },

        "ll-base": { name: "One-line head", note: "The original: one rounded stroke rises as the neck, makes the ears and head, and comes back down.", svg: () => svg(st(P + "V29", 2.3) + eye()) },
        "ll-hair": { name: "Hairline", note: "The same stroke at a hairline weight. Elegant large, too faint below 32 px.", svg: () => svg(st(P + "V29", 1.4) + eye(19.6, 12.6, 1.1)) },
        "ll-square": { name: "Square joins", note: "Straight segments with square caps and mitred corners, closer to a chart than a drawing.", svg: () => svg(st("M11 29V14L14 4.5l1.8 4.5 2-4.5 1.2 5 6.5 3.5v5.5H17V29", 2.4, "square") + eye(19.4, 12.4, 1.4)) },
        "ll-oneear": { name: "One ear", note: "A single peak for the ears, which simplifies the silhouette and survives small sizes.", svg: () => svg(st("M11 29V15c0-4 1.5-7.5 4-10.5l2.6 5.2c3.6.8 6.8 2.6 6.8 5.4 0 1.9-1.5 3.1-3.6 3.1H17V29", 2.3) + eye()) },
        "ll-left": { name: "Facing left", note: "The original, mirrored. It looks back rather than forward, so it's less suited to a trading product.", svg: () => svg(`<g transform="translate(32 0) scale(-1 1)">${st(P + "V29", 2.3) + eye()}</g>`) },
        "ll-negeye": { name: "Cut-out eye", note: "A heavier stroke with the eye cut out of the head, so the mark needs one colour only.", svg: () => svg(`<mask id="ltne"><rect width="32" height="32" fill="#fff"/><circle cx="22.3" cy="11" r="1.15" fill="#000"/></mask><g mask="url(#ltne)">${st(P + "V29", 3.6)}</g>`) },
        "ll-tick": { name: "Uptrend leg", note: "The back leg turns into a rising price line with an arrow, in the accent colour.", svg: () => svg(st(P + "V24", 2.3) + st("M17 24l3.5-3.5 2.2 2 5-5.4", 2.3, "round", A) + st("M24.4 16.6h3.4V20", 2.3, "round", A) + eye()) },
        "ll-l": { name: "Llama L", note: "The neck drops into a foot that runs right, so the line also reads as an L for LlamaTrade.", svg: () => svg(st("M25.5 29H10V15c0-4 1.2-7 3-10.5l1.6 4 1.9-4.5 1.3 5c3.6.8 6.4 2.6 6.4 5.4 0 1.9-1.5 3.1-3.6 3.1H16", 2.5) + eye(18.6, 12.6, 1.5)) },
        "ll-tile": { name: "On a tile", note: "The original on a solid accent tile, which makes the app icon and favicon read as one shape.", svg: () => svg(`<rect x="1" y="1" width="30" height="30" rx="7" fill="${A}"/>` + st("M11.5 27V15.5c0-3.6 1.1-6.3 2.7-9.4l1.5 3.6 1.7-4 1.2 4.5c3.2.7 5.8 2.3 5.8 4.8 0 1.7-1.3 2.8-3.2 2.8H17V27", 2.4, "round", K) + `<circle cx="19.4" cy="12.8" r="1.35" fill="${K}"/>`) },
        "ll-run": { name: "Line into the name", note: "The back leg runs on under the wordmark, so the whole lockup is one line.", svg: () => svg(st(P + "V30.85H32", 2.3) + eye()), word: () => `<span class="lt-word lt-run">LlamaTrade</span>`, inline: true },
        "ll-16": { name: "16 px build", note: "Fewer curves, a heavier stroke and no eye, drawn so it stays a llama at 16 px.", svg: () => svg(st("M10.5 30V13.5l3.4-8.5 3 5.6 3-5.6 1 6.6c3.3.8 5.6 2.5 5.6 5.1H17.5V30", 3.6)) },

        "lt-base": { name: "LT on a grid", note: "The original: an LT monogram on a faint ticker grid in a rounded square.", svg: () => svg(tile() + st("M1.5 11h29M1.5 21h29M11 1.5v29M21 1.5v29", 1, "butt").replace('stroke="currentColor"', 'stroke="currentColor" stroke-opacity="0.16"') + L0() + T0()) },
        "lt-touch": { name: "Construction lines", note: "Only the hairlines that touch the letters, like guides on a drafting sheet.", svg: () => svg(tile() + `<path d="M1.5 7.5h29M1.5 24.5h29M7.5 1.5v29M21.5 1.5v29" stroke="currentColor" stroke-opacity="0.22" stroke-width="0.8"/>` + L0() + T0()) },
        "lt-shared": { name: "Shared stem", note: "The T's stem is also the L's upright, so the two letters become one compact glyph.", svg: () => svg(tile() + `<path d="M1.5 11h29M1.5 21h29M11 1.5v29M21 1.5v29" stroke="currentColor" stroke-opacity="0.14"/>` + st("M13 8v16.5H24", 3.2, "square") + st("M6.5 8H20", 3.2, "square", A)) },
        "lt-price": { name: "Price-line crossbar", note: "The T's crossbar is a short rising price line in the accent.", svg: () => svg(tile() + `<path d="M1.5 11h29M1.5 21h29M11 1.5v29M21 1.5v29" stroke="currentColor" stroke-opacity="0.14"/>` + L0() + st("M16.5 10.5l2.6-2.4 2.4 1.6 3.9-3.7", 2.4, "round", A) + st("M21.5 10v15", 3, "square")) },
        "lt-candle": { name: "Candle crossbar", note: "A candlestick sits on the crossbar, so the T is also a chart.", svg: () => svg(tile() + `<path d="M1.5 11h29M1.5 21h29M11 1.5v29M21 1.5v29" stroke="currentColor" stroke-opacity="0.14"/>` + L0() + st("M16.5 10.5h10M21.5 10.5V25", 3, "square") + st("M21.5 3.5v2", 1.2, "round", A) + `<rect x="19.7" y="5" width="3.6" height="4.3" rx="0.6" fill="${A}"/>`) },
        "lt-outline": { name: "Outlined", note: "Inline letters drawn as outlines, which reads technical and light.", svg: () => svg(tile() + `<path d="M1.5 11h29M1.5 21h29M11 1.5v29M21 1.5v29" stroke="currentColor" stroke-opacity="0.12"/><path d="M6 6h3v16h7v3H6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter"/><path d="M16.5 6h10v3H23v16h-3V9h-3.5z" stroke="${A}" stroke-width="1.4" stroke-linejoin="miter"/>`) },
        "lt-dots": { name: "Dot grid", note: "The grid as dots, like a chart's gridpoints, with solid letters and no border.", svg: () => svg(tile(0, 0.07) + Array.from({ length: 25 }, (_, i) => `<circle cx="${4 + (i % 5) * 6}" cy="${4 + Math.floor(i / 5) * 6}" r="0.65" fill="currentColor" fill-opacity="0.35"/>`).join("") + L0(3.2) + T0(3.2)) },
        "lt-solid": { name: "Solid tile", note: "A solid accent tile with dark letters and no grid: the boldest app icon of the set.", svg: () => svg(`<rect x="1" y="1" width="30" height="30" rx="7" fill="${A}"/>` + st("M7.5 7v17.5H15", 3.2, "square", K) + st("M17.5 7.5h8M21.5 7.5V25", 3.2, "square", K)) },
        "lt-16": { name: "16 px build", note: "Letters on even coordinates with a 4-unit stroke, so each edge lands on a whole pixel at 16 px.", svg: () => svg(tile(0, 0.1) + st("M8 6v18h8", 4, "square") + st("M18 8h10M23 8v16", 4, "square", A)) },
        "lt-word": { name: "Wordmark on the grid", note: "The tile beside a wordmark set on the same grid, with matching hairlines behind the name.", svg: () => svg(tile() + `<path d="M1.5 11h29M1.5 21h29M11 1.5v29M21 1.5v29" stroke="currentColor" stroke-opacity="0.16"/>` + L0() + T0()), word: () => `<span class="lt-word lt-gridword">LlamaTrade</span>` },
    };

    const bar = (x, y, w, h, f = "currentColor", r = 0.8) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"/>`;
    const BASE = [[2, 7, 3.2, 4, "a"], [6.4, 2.5, 3.2, 18.5], [10.8, 14, 3.2, 15], [15.2, 14, 3.2, 7], [19.6, 14, 3.2, 7], [24, 14, 3.2, 15], [28.4, 13, 2, 4.5]];
    const bars = (list, r = 0.8, c = "currentColor") => list.map(([x, y, w, h, a]) => bar(x, y, w, h, a ? A : c, r)).join("");
    const shape = (x) => (x < 5.2 ? [7, 11] : x < 9.8 ? [2.5, 21] : x < 13.6 ? [14, 29] : x < 22.8 ? [14, 21] : x < 27.4 ? [14, 29] : [13, 17.5]);
    const dense = () => { let o = ""; for (let x = 2; x <= 29.2; x += 2.45) { const [t, b] = shape(x + 0.8); o += bar(x, t, 1.6, b - t, x < 5 ? A : "currentColor", 0.5); } return o; };
    const BARS = {
        "bc-base": { name: "Bar-chart llama", note: "The original: snout, neck, back and two legs as price bars, with the snout in the accent.", svg: () => svg(bars(BASE)) },
        "bc-candle": { name: "Candlesticks", note: "Each bar becomes a candle with thin wicks, so the llama is drawn from a real price chart.", svg: () => svg(st("M8 2v20M12.4 13v16.5M25.6 13v16.5M16.8 12.5v10M21.2 13v9", 1.1, "round") + bar(2, 7, 3.2, 4, A, 0.5) + bar(6.4, 4.5, 3.2, 14, "currentColor", 0.5) + bar(10.8, 14.5, 3.2, 10, "currentColor", 0.5) + bar(15.2, 14.5, 3.2, 6, "currentColor", 0.5) + bar(19.6, 15, 3.2, 5.5, "currentColor", 0.5) + bar(24, 14.5, 3.2, 10, "currentColor", 0.5) + bar(28.4, 13, 2, 4.5, "currentColor", 0.5)) },
        "bc-ear": { name: "Ear bar and square ends", note: "A short ear bar sits behind the neck and every bar has square ends, for a sharper profile.", svg: () => svg(bars([[2, 7.5, 3.2, 4, "a"], [6.4, 4.5, 3.2, 16.5], [10.2, 1.5, 1.8, 4.5], [10.8, 14, 3.2, 15], [15.2, 14, 3.2, 7], [19.6, 14, 3.2, 7], [24, 14, 3.2, 15], [28.4, 13, 2, 4.5]], 0)) },
        "bc-volume": { name: "Volume bars", note: "Bars rise from a baseline like a volume chart, and their tops trace the llama's profile.", svg: () => svg(bars([[2, 9, 3.2, 20, "a"], [6.4, 2.5, 3.2, 26.5], [10.8, 13.5, 3.2, 15.5], [15.2, 14.5, 3.2, 14.5], [19.6, 14, 3.2, 15], [24, 13.5, 3.2, 15.5], [28.4, 12.5, 2, 16.5]], 0.6) + st("M1 30.5h30", 1, "butt").replace('stroke="currentColor"', 'stroke="currentColor" stroke-opacity="0.5"')) },
        "bc-dense": { name: "Dense bars", note: "Twelve thin bars instead of seven, which reads as a chart first and a llama second.", svg: () => svg(dense()) },
        "bc-latest": { name: "Latest bar", note: "All bars in ink except the last one, the tail, which is the latest bar in the accent.", svg: () => svg(bars(BASE.map((b, i) => (i === 0 ? b.slice(0, 4) : i === 6 ? [...b.slice(0, 4), "a"] : b)))) },
        "bc-baseline": { name: "On a baseline", note: "The original standing on a thin baseline rule, like the last bars of a chart.", svg: () => svg(bars(BASE) + `<path d="M1 30.6h30" stroke="currentColor" stroke-opacity="0.45" stroke-width="0.9"/>`) },
        "bc-16": { name: "16 px build", note: "Four wide bars: neck with an accent head, front leg, back and back leg. Every edge sits on a whole pixel at 16 px.", svg: () => svg(bar(2, 2, 6, 6, A, 0.6) + bar(2, 8, 6, 12, "currentColor", 0.6) + bar(10, 14, 6, 16, "currentColor", 0.6) + bar(18, 14, 4, 6, "currentColor", 0.6) + bar(24, 14, 6, 16, "currentColor", 0.6)) },
        "bc-tile": { name: "On a tile", note: "The original in dark bars on a solid accent tile, which makes a strong app icon.", svg: () => svg(`<rect x="1" y="1" width="30" height="30" rx="7" fill="${A}"/>` + bars([[4, 8.5, 2.6, 3.2], [7.6, 5, 2.6, 15], [11.2, 14.4, 2.6, 12], [14.8, 14.4, 2.6, 5.6], [18.4, 14.4, 2.6, 5.6], [22, 14.4, 2.6, 12], [25.6, 13.6, 1.8, 3.6]], 0.6, K)) },
        "bc-run": { name: "Bars into the name", note: "A row of small bars continues under the wordmark, like the rest of the chart.", svg: () => svg(bars(BASE)), word: () => `<span class="lt-word lt-barrun">LlamaTrade</span>` },
    };
    Object.assign(marks, BARS);
    const families = [
        { id: "llama", title: "One-line llama, variations", lead: "One rounded stroke rises as the neck, makes the ears and head and comes back down.", ids: ["ll-base", "ll-hair", "ll-square", "ll-oneear", "ll-negeye", "ll-tick", "ll-l", "ll-tile", "ll-run", "ll-16"], fav: ["ll-tick", "ll-l"] },
        { id: "bars", title: "Bar-chart llama, variations", lead: "A llama in profile built from price bars: snout, neck, back and two legs.", ids: ["bc-base", "bc-candle", "bc-ear", "bc-volume", "bc-dense", "bc-latest", "bc-baseline", "bc-16", "bc-tile", "bc-run"], fav: ["bc-16", "bc-candle"] },
        { id: "lt", title: "LT on a grid, variations", lead: "A geometric LT monogram in a rounded square, with a faint ticker grid or a nod to one.", ids: ["lt-base", "lt-touch", "lt-shared", "lt-price", "lt-candle", "lt-outline", "lt-dots", "lt-solid", "lt-16", "lt-word"], fav: ["lt-shared", "lt-candle"] },
    ];
    const lockup = (id) => {
        const m = marks[id] || marks.current;
        if (m.inline) return `<span class="lt-run">${m.svg()}LlamaTrade</span>`;
        return m.svg() + (m.word ? m.word() : `<span class="lt-word">LlamaTrade</span>`);
    };
    const css = `.lt-mark { width: 1.3em; height: 1.3em; flex: none; display: block; }
.lt-word { white-space: nowrap; }
.lt-run { display: inline-flex; align-items: flex-end; gap: 0.3em; white-space: nowrap; border-bottom: 0.0934em solid currentColor; padding-right: 0.15em; line-height: 1.15; }
.lt-run .lt-mark { margin-bottom: -0.0934em; }
.lt-barrun { padding-bottom: 0.32em; background: repeating-linear-gradient(90deg, currentColor 0 0.1em, transparent 0.1em 0.24em) left bottom / 100% 0.16em no-repeat; }
.lt-gridword { padding: 0.18em 0.3em; background-image: linear-gradient(to right, color-mix(in srgb, currentColor 16%, transparent) 1px, transparent 1px), linear-gradient(to bottom, color-mix(in srgb, currentColor 16%, transparent) 1px, transparent 1px); background-size: 0.46em 0.46em; border-radius: 0.12em; box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 30%, transparent); }`;
    return { marks, families, lockup, css };
})();

(function () {
    const FAV = ["stepl", "ring"];
    const ACC = [["cyan", "Cyan", "#4cc2ff"], ["white", "Frost", "#dbe3f0"], ["amber", "Amber", "#ffc24b"], ["violet", "Violet", "#a78bfa"], ["blue", "Blue", "#2563eb"]];
    const accEl = document.getElementById("acc");
    if (accEl) accEl.insertAdjacentHTML("beforeend", ACC.map(([k, n, c]) => `<button type="button" data-acc="${k}"><i style="background:${c}"></i>${n}</button>`).join(""));
    const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };
    const read = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    function setTh(t) { document.documentElement.dataset.theme = t; document.querySelectorAll("[data-th]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.th === t)); store("lts-theme-b2", t); }
    function setAc(t) { document.documentElement.dataset.acc = t; document.querySelectorAll("[data-acc]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.acc === t)); store("lts-acc-b5", t); }
    document.querySelectorAll("[data-th]").forEach((b) => b.addEventListener("click", () => setTh(b.dataset.th)));
    document.querySelectorAll("[data-acc]").forEach((b) => b.addEventListener("click", () => setAc(b.dataset.acc)));
    setTh(document.documentElement.dataset.theme);
    setAc(document.documentElement.dataset.acc);

    const card = (id, i, fav) => {
        const m = LTL.marks[id];
        return `<article class="card" data-id="${id}">
            <div class="card-h"><h2><span class="no">${String(i + 1).padStart(2, "0")}</span>${m.name}</h2>${id === "bc-candle" ? '<span class="fav">Chosen</span>' : fav.includes(id) ? '<span class="fav">Favourite</span>' : ""}</div>
            <p class="note">${m.note}</p>
            <div class="large">${LTL.lockup(id)}</div>
            <div class="sizes">
                <div><div class="tiles"><span class="tile k">${m.svg()}</span><span class="tile s">${m.svg()}</span><span class="tile l">${m.svg()}</span></div><span class="lbl">App icon · Black, Slate, light</span></div>
                <div><div class="favs"><span class="tab d"><span class="f16">${m.svg()}</span>LlamaTrade</span><span class="tab w"><span class="f16">${m.svg()}</span>LlamaTrade</span></div>
                    <div class="f32w" style="margin-top:8px"><span class="fk"><span class="f32">${m.svg()}</span></span><span class="fl"><span class="f32">${m.svg()}</span></span></div>
                    <span class="lbl">Favicon · 16 and 32 px</span></div>
                <div></div>
            </div>
            <div><div class="navmini"><span class="logo">${LTL.lockup(id)}</span><span class="nl">Build</span><span class="nl">Backtest</span><span class="x">Request an invite</span></div><span class="lbl">Nav size, in the B site header</span></div>
            <div class="card-f"><span class="lbl" style="margin:0">Shown at hero size above when selected</span><button type="button" class="btn" data-use="${id}">Use in the B site header</button></div>
        </article>`;
    };
    document.getElementById("fams").innerHTML = LTL.families.map((f) => `<section class="fam" id="${f.id}"><div class="fam-h"><h2>${f.title}</h2><p>${f.lead} Favourites: <b>${f.fav.map((x) => LTL.marks[x].name).join("</b> and <b>")}</b>.</p></div><div class="grid">${f.ids.map((id, i) => card(id, i, f.fav)).join("")}</div></section>`).join("");
    function pick(id) {
        const m = LTL.marks[id] || LTL.marks.current;
        document.getElementById("hdr").innerHTML = LTL.lockup(id);
        document.getElementById("big").innerHTML = LTL.lockup(id);
        document.getElementById("bignote").textContent = (id === "bc-candle" ? "Chosen: " : "") + m.name + ". " + m.note;
        document.querySelectorAll(".card").forEach((c) => c.classList.toggle("sel", c.dataset.id === id));
        document.querySelectorAll("[data-use]").forEach((b) => { b.setAttribute("aria-pressed", b.dataset.use === id); b.textContent = b.dataset.use === id ? "In the B site header" : "Use in the B site header"; });
    }
    document.querySelectorAll("[data-use]").forEach((b) => b.addEventListener("click", () => {
        const id = b.getAttribute("aria-pressed") === "true" ? "bc-candle" : b.dataset.use;
        store("lts-logo-v2", id);
        pick(id);
    }));
    const saved = read("lts-logo-v2");
    pick(saved && LTL.marks[saved] ? saved : "bc-candle");
})();
</script>
<script src="review-bar.js"></script>
</body>
