/* Page */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--p-bg); }
body { margin: 0; color: var(--p-ink); background: var(--p-bg); font: 400 15px/1.6 var(--a-font); overflow-x: hidden; }
a { color: var(--p-acc); text-decoration: none; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 28px; }
.ptop { border-bottom: 1px solid var(--p-line); }
.ptop .wrap { height: 52px; display: flex; align-items: center; gap: 14px; }
.ptop .logo { display: flex; align-items: center; gap: 8px; font: 600 16px var(--a-font); letter-spacing: -0.01em; color: var(--p-ink); --lacc: var(--acc-fill, var(--p-acc)); }
.ptop .logo svg { width: 22px; height: 22px; }
.ptop span { color: var(--p-ink3); font-size: 13.5px; }
.kick { font: 500 13px var(--a-num); color: var(--p-ink3); }
.intro { padding: 52px 0 8px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 56px; align-items: start; }
.intro h1 { font: 600 40px/1.1 var(--a-font); letter-spacing: -0.025em; margin: 12px 0 16px; }
.intro p { margin: 0 0 12px; color: var(--p-ink2); font-size: 16px; max-width: 680px; }
.keys { display: grid; gap: 8px; margin: 18px 0 0; padding: 14px 16px; border: 1px solid var(--p-line); border-radius: 6px; background: var(--p-card); font-size: 14px; color: var(--p-ink2); max-width: 680px; }
.keys kbd { font: 500 12px var(--a-num); padding: 2px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--p-line2); color: var(--p-ink); margin-right: 2px; }
.conv { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--p-ink2); }
.conv i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
.toc { border: 1px solid var(--p-line); border-radius: 6px; background: var(--p-card); padding: 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
.toc h2 { margin: 0 0 8px; font: 600 13px var(--a-font); display: flex; gap: 8px; align-items: baseline; }
.toc h2 em { font: 400 12px var(--a-num); color: var(--p-ink3); font-style: normal; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.toc a { color: var(--p-ink2); font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
.toc a:hover { color: var(--p-ink); }
.toc a em { font: 400 11.5px var(--a-num); color: var(--p-ink3); font-style: normal; min-width: 22px; }
.toc a b { font: 400 12px var(--a-num); color: var(--p-ink3); margin-left: auto; }
.toc a.done b { color: var(--p-acc); }
.area-h { padding: 72px 0 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.area-h h2 { margin: 6px 0 0; font: 600 30px/1.1 var(--a-font); letter-spacing: -0.02em; }
.area-h p { margin: 0; color: var(--p-ink2); font-size: 15px; max-width: 640px; }
.dc-surface { margin-top: 28px; }
.pair { display: grid; grid-template-columns: minmax(0, 3.1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.pair > * { min-width: 0; }
.cap { margin-top: 10px; font-size: 12.5px; color: var(--p-ink3); text-align: center; }
.skips { padding: 80px 0 40px; }
.skips h2 { margin: 0 0 6px; font: 600 26px/1.15 var(--a-font); letter-spacing: -0.02em; }
.skips > p { margin: 0 0 18px; color: var(--p-ink2); max-width: 720px; }
.skips ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; border-top: 1px solid var(--p-line); max-width: 980px; }
.skips li { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 12px 0; border-bottom: 1px solid var(--p-line); font-size: 14.5px; color: var(--p-ink2); }
.skips li b { color: var(--p-ink); font-weight: 600; }
.foot { padding: 30px 0 110px; color: var(--p-ink3); font-size: 13px; }
@media (max-width: 1100px) {
    .intro, .area-h { grid-template-columns: 1fr; gap: 24px; }
}
@media (max-width: 760px) {
    .wrap { padding: 0 16px; }
    .intro { padding-top: 32px; }
    .intro h1 { font-size: 29px; }
    .toc { grid-template-columns: 1fr; padding: 14px; }
    .area-h { padding-top: 56px; }
    .area-h h2 { font-size: 25px; }
    .pair { grid-template-columns: 1fr; gap: 20px; }
    .pair > .ph { width: 72%; margin: 0 auto; }
    .skips li { grid-template-columns: 1fr; gap: 4px; }
}
/* Frames */
.frame { position: relative; overflow: hidden; }
.frame > .in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.win { background: var(--a-bg); color: var(--a-text); border-radius: var(--a-win-r); overflow: hidden; box-shadow: var(--a-shadow); border: 1px solid var(--a-win-line); }
.win-bar { height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--a-bar); border-bottom: 1px solid var(--a-line); font: 500 12px var(--a-font); color: var(--a-text3); }
.win-bar .dots { display: flex; gap: 6px; }
.win-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--a-dot); display: block; }
.win-bar .url { margin: 0 auto; transform: translateX(-23px); min-width: 320px; height: 22px; border-radius: 6px; background: var(--a-sunk); display: flex; align-items: center; justify-content: center; gap: 6px; font: 400 11.5px var(--a-font); color: var(--a-text3); padding: 0 12px; }
.phone { position: relative; width: 412px; border-radius: 54px; padding: 11px; background: #0f1013; box-shadow: inset 0 0 0 1.5px #3b3e45, 0 0 0 2px #a3a7ae, 0 0 0 3.5px #2b2d32, var(--a-phone-shadow); }
.phone::after { content: ""; position: absolute; top: 22px; left: 50%; width: 112px; height: 32px; transform: translateX(-50%); border-radius: 999px; background: #050506; z-index: 9; }
.phone .sc { border-radius: 44px; overflow: hidden; height: 844px; background: var(--a-bg); position: relative; }

/* App */
.app { font: 400 13px/1.45 var(--a-font); color: var(--a-text); background: var(--a-bg); overflow: hidden; position: relative; }
.app * { box-sizing: border-box; }
.app.dk { display: flex; flex-direction: column; }
.app.dk > .main { flex: 1; min-height: 0; }
.app-nav { height: 48px; flex: none; display: flex; align-items: center; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--a-line); background: var(--a-panel); }
.app-nav .lg { font: 600 15px var(--a-font); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.app-nav nav { display: flex; gap: 4px; }
.app-nav nav span { padding: 6px 10px; border-radius: var(--a-r); color: var(--a-text2); font-size: 12.5px; }
.app-nav nav span.on { color: var(--a-text); background: var(--a-sunk); font-weight: 500; }
.app-nav .end { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--a-text3); font-size: 12px; }
.app-nav .end .mkt { display: inline-flex; align-items: center; gap: 6px; }
.ltm { width: 20px; height: 20px; display: block; flex: none; --lacc: var(--acc-fill, var(--a-acc)); color: var(--a-text); }
.av { width: 26px; height: 26px; border-radius: 50%; background: var(--a-acc-soft); color: var(--a-acc); display: grid; place-items: center; font: 600 10.5px var(--a-font); }
.bell { position: relative; color: var(--a-text2); display: grid; place-items: center; width: 26px; height: 26px; }
.bell b { position: absolute; top: 0; right: -2px; min-width: 14px; height: 14px; border-radius: 999px; background: var(--acc-fill, var(--a-acc)); color: var(--a-acc-ink); font: 600 9px/14px var(--a-num); text-align: center; padding: 0 3px; }
.kbd { font: 500 10.5px/1 var(--a-num); padding: 3px 5px; box-shadow: inset 0 0 0 1px var(--a-line2); border-radius: 2px; color: var(--a-text3); }
.mode { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--a-r); font: 600 10px/1 var(--a-font); letter-spacing: 0.06em; text-transform: uppercase; color: var(--a-text); box-shadow: inset 0 0 0 1px var(--a-line2); background: repeating-linear-gradient(135deg, var(--a-hatch) 0 2px, transparent 2px 5px); white-space: nowrap; }
.main { padding: 18px 20px; display: grid; gap: 14px; align-content: start; grid-auto-rows: max-content; }
.hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hd h3 { margin: 0; font: 600 21px/1.15 var(--a-font); letter-spacing: -0.015em; }
.hd .meta { font-size: 12px; color: var(--a-text3); margin-top: 4px; }
.hd .acts { display: flex; gap: 8px; align-items: center; }
.b { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: var(--a-r); font: 500 12px var(--a-font); box-shadow: inset 0 0 0 1px var(--a-line2); background: var(--a-panel); color: var(--a-text); white-space: nowrap; }
.b.p { background: var(--acc-fill, var(--a-acc)); color: var(--a-acc-ink); box-shadow: none; }
.b.gh { background: transparent; box-shadow: none; color: var(--a-acc); padding: 0 6px; }
.b.dis { opacity: 0.42; }
.b.lg { height: 36px; padding: 0 16px; font-size: 13px; }
.b.full { width: 100%; justify-content: center; }
.b.warn { color: var(--a-risk); box-shadow: inset 0 0 0 1px var(--a-risk-line); }
.b .ico { width: 14px; height: 14px; }
.ico { width: 16px; height: 16px; display: block; flex: none; }
.pn { background: var(--a-panel); border: 1px solid var(--a-line); border-radius: var(--a-pn-r); min-width: 0; overflow: hidden; }
.pn-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--a-line); min-height: 38px; }
.pn-h b { font: 600 13px var(--a-font); }
.pn-h > span { font-size: 11.5px; color: var(--a-text3); }
.pn-b { padding: 12px 14px; }
.pn-f { padding: 10px 14px; border-top: 1px solid var(--a-line); font-size: 12px; color: var(--a-text2); }
.lbl { font: 500 11px var(--a-font); color: var(--a-text3); }
.num { font-family: var(--a-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.gain { color: var(--a-gain); }
.loss { color: var(--a-loss); }
.risk { color: var(--a-risk); }
.acc { color: var(--a-acc); }
.t2 { color: var(--a-text2); }
.t3 { color: var(--a-text3); }
.cells { display: grid; grid-template-columns: repeat(6, 1fr); }
.cells > div { padding: 11px 14px; border-right: 1px solid var(--a-line); min-width: 0; }
.cells > div:last-child { border-right: 0; }
.cells .v { font: 500 19px/1.2 var(--a-num); letter-spacing: -0.02em; margin-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cells .d { font: 400 11px var(--a-num); color: var(--a-text3); white-space: nowrap; margin-top: 2px; }
.cells.c4 { grid-template-columns: repeat(4, 1fr); }
.cells.c3 { grid-template-columns: repeat(3, 1fr); }
.log { font: 400 11.5px/1.8 var(--a-num); color: var(--a-text2); padding: 12px 14px; }
.log > div { display: grid; grid-template-columns: 50px 1fr; gap: 8px; }
.log .ts { color: var(--a-text3); }
.log .ok { color: var(--a-text); }
.log .ok::before { content: "✓ "; color: var(--a-acc); }
.log .now { color: var(--a-text); }
.log .now::before { content: "› "; color: var(--a-acc); }
.log .bad { color: var(--a-risk); }
.log .bad::before { content: "! "; }
.prog { height: 2px; background: var(--a-line); position: relative; }
.prog i { display: block; height: 100%; width: 100%; background: var(--acc-fill, var(--a-acc)); transition: width 0.5s ease; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font: 500 11px var(--a-font); color: var(--a-text3); padding: 8px 12px; border-bottom: 1px solid var(--a-line); white-space: nowrap; }
.tbl td { padding: 0 12px; height: 30px; border-bottom: 1px solid var(--a-line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .n { text-align: right; font-family: var(--a-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tbl th.n { font-family: var(--a-font); }
.tbl td:first-child, .tbl th:first-child { padding-left: 14px; }
.tbl td:last-child, .tbl th:last-child { padding-right: 14px; }
.tbl tr.sel td { background: var(--a-acc-soft); }
.tbl tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--a-acc); }
.tbl tr.rk td { background: var(--a-risk-soft); }
.tbl tr.rk td:first-child { box-shadow: inset 2px 0 0 var(--a-risk); }
.tbl tr.dim td { color: var(--a-text3); }
.tbl.tall td { height: 44px; }
.tbl .sm { font: 400 11px var(--a-font); color: var(--a-text3); display: block; margin-top: 1px; }
.sym { font: 600 12.5px var(--a-num); letter-spacing: 0; }
.side { font: 600 10px/1 var(--a-num); padding: 3px 5px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--a-line2); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--a-text2); white-space: nowrap; }
.st i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--a-text3); display: block; flex: none; position: relative; }
.st.run i { background: var(--a-text); box-shadow: none; }
.st.run.ping i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--a-text); animation: ping 2.4s ease-out infinite; }
.st.done i { background: var(--a-text2); box-shadow: none; }
.st.wait i { box-shadow: none; border: 1.5px dashed var(--a-text3); }
.st.pause i { border-radius: 0; box-shadow: none; background: linear-gradient(90deg, var(--a-text2) 0 35%, transparent 35% 65%, var(--a-text2) 65%); }
.st.frz { color: var(--a-risk); }
.st.frz i { background: var(--a-risk); box-shadow: none; border-radius: 1px; }
.st.stop i { border-radius: 1px; }
.st.err { color: var(--a-risk); }
.st.err i { box-shadow: inset 0 0 0 1.5px var(--a-risk); border-radius: 1px; transform: rotate(45deg) scale(0.86); }
.st.lg2 { font-size: 13.5px; gap: 8px; }
.st.lg2 i { width: 9px; height: 9px; }
@keyframes ping { 0% { transform: scale(0.4); opacity: 0.9; } 80%, 100% { transform: scale(1.3); opacity: 0; } }
.spin { width: 12px; height: 12px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.leg { display: flex; gap: 14px; font-size: 11.5px; color: var(--a-text2); flex-wrap: wrap; }
.leg i { display: inline-block; width: 14px; border-top: 1.5px solid var(--a-acc); vertical-align: middle; margin-right: 5px; }
.leg i.bm { border-top: 1px dashed var(--a-text3); }
.leg i.c2 { border-top-color: var(--a-h2); }
.leg i.c3 { border-top-color: var(--a-h4); }
.leg i.hb { width: 12px; height: 10px; border: 0; background: repeating-linear-gradient(135deg, var(--a-text3) 0 1px, transparent 1px 4px); opacity: 0.7; vertical-align: -1px; }
.mg { width: 100%; border-collapse: separate; border-spacing: 2px; font: 400 10.5px var(--a-num); font-variant-numeric: tabular-nums; }
.mg th { font: 500 10px var(--a-font); color: var(--a-text3); padding: 3px 1px; text-align: center; }
.mg th span { display: none; }
.mg.wide th span { display: inline; }
.mg tbody th { text-align: left; font-family: var(--a-num); }
.mg td { text-align: center; padding: 5px 0; border-radius: 1px; color: var(--a-text); }
.mg.tall td { padding: 9px 0; font-size: 11.5px; }
.mg td.mg-year { text-align: right; padding-left: 6px; color: var(--a-text2); }
.mg td.mg-none { background: transparent; }
.ind { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.ind span { font: 500 11px var(--a-num); padding: 6px 4px; border-radius: var(--a-r); background: var(--a-sunk); text-align: center; box-shadow: var(--a-key); color: var(--a-text3); }
.ind span.on { color: var(--a-acc-ink); background: var(--acc-fill, var(--a-acc)); box-shadow: none; }
.ind span.m { background: transparent; box-shadow: inset 0 0 0 1px var(--a-line2); }
.ltc { position: relative; width: 100%; }
.ltc svg { display: block; overflow: visible; }
.ltc-grid line { stroke: var(--a-grid); stroke-dasharray: 1 3; }
.ltc-ax { font: 400 10px var(--a-num); fill: var(--a-text3); }
.ltc-zero { stroke: var(--a-line2); }
.ltc-cross { stroke: var(--a-text3); stroke-dasharray: 2 3; }
.ltc-hatch { stroke: var(--a-text3); stroke-width: 1; }
.ltc-band { opacity: 0.32; }
.ltc-mk-l { stroke: var(--a-text3); stroke-dasharray: 2 3; }
.ltc-mk-p { fill: var(--a-text); }
.ltc-mk-c { fill: var(--a-panel); stroke: var(--a-line2); }
.ltc-mk-t { font: 500 9.5px var(--a-num); fill: var(--a-text2); }
.ltc-mk.on .ltc-mk-c { fill: var(--acc-fill, var(--a-acc)); stroke: none; }
.ltc-mk.on .ltc-mk-t { fill: var(--a-acc-ink); }
.ltc-mk.on .ltc-mk-l { stroke: var(--a-acc); }
.ltc-mk.on .ltc-mk-p { fill: var(--a-acc); }
.s-main { stroke: var(--a-acc); stroke-width: 1.5; stroke-linejoin: round; }
.s-main-area { fill: var(--a-acc); opacity: 0.09; }
.s-main-dot { fill: var(--a-acc); stroke: var(--a-panel); stroke-width: 2; }
.s-bench { stroke: var(--a-text3); stroke-width: 1; stroke-dasharray: 3 3; }
.s-bench-dot { fill: var(--a-text3); stroke: var(--a-panel); stroke-width: 2; }
.s-dd { stroke: var(--a-loss); stroke-width: 1; }
.s-dd-area { fill: var(--a-loss); opacity: 0.16; }
.s-dd-dot { fill: var(--a-loss); stroke: var(--a-panel); stroke-width: 2; }
.s-ddb { stroke: var(--a-text3); stroke-width: 1; stroke-dasharray: 2 2; }
.s-ddb-dot { fill: var(--a-text3); }
.s-c2 { stroke: var(--a-h2); stroke-width: 1.2; }
.s-c2-dot { fill: var(--a-h2); stroke: var(--a-panel); stroke-width: 2; }
.s-c3 { stroke: var(--a-h4); stroke-width: 1.2; }
.s-c3-dot { fill: var(--a-h4); stroke: var(--a-panel); stroke-width: 2; }
.ltc-tip { position: absolute; display: none; pointer-events: none; background: var(--a-panel); border: 1px solid var(--a-line2); border-radius: var(--a-r); padding: 6px 8px; font: 400 11px/1.5 var(--a-num); white-space: nowrap; z-index: 2; color: var(--a-text); }
.ltc-tip b { display: block; color: var(--a-text3); font-weight: 500; }
.spark { display: block; }
.spark path { fill: none; stroke: var(--a-text2); stroke-width: 1.3; }
.spark.acc path { stroke: var(--a-acc); }
.row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.g2 > *, .g3 > *, .g4 > * { min-width: 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--a-line); font-size: 12.5px; }
.kv:last-child { border-bottom: 0; }
.kv > span:first-child { color: var(--a-text2); }
.kv > span:last-child { text-align: right; }
.fld { display: grid; gap: 5px; font-size: 12px; align-content: start; }
.fld > label { color: var(--a-text2); font-weight: 500; }
.fld .help { color: var(--a-text3); font-size: 11.5px; }
.fld .err { color: var(--a-risk); font-size: 11.5px; }
.inp { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; background: var(--a-bg); box-shadow: inset 0 0 0 1px var(--a-line2); border-radius: var(--a-r); font: 400 13px var(--a-font); color: var(--a-text); white-space: nowrap; overflow: hidden; }
.inp.n { font-family: var(--a-num); }
.inp .af { color: var(--a-text3); font: 400 12px var(--a-num); }
.inp.focus { box-shadow: inset 0 0 0 1px var(--a-acc), 0 0 0 3px var(--a-acc-soft); }
.inp.bad { box-shadow: inset 0 0 0 1px var(--a-risk); }
.inp.dis { opacity: 0.55; }
.inp.sel::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.5px solid var(--a-text3); border-bottom: 1.5px solid var(--a-text3); transform: rotate(45deg) translate(-2px, -2px); flex: none; }
.seg { display: inline-flex; padding: 2px; border-radius: 5px; background: var(--a-sunk); gap: 2px; }
.seg span { padding: 4px 10px; border-radius: var(--a-r); font: 500 12px var(--a-font); color: var(--a-text2); white-space: nowrap; }
.seg span.on { background: var(--a-panel); color: var(--a-text); box-shadow: 0 0 0 1px var(--a-line2); }
.cb { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--a-line2); display: inline-grid; place-items: center; flex: none; vertical-align: -2px; }
.cb.on { background: var(--acc-fill, var(--a-acc)); box-shadow: none; }
.cb.on::after { content: ""; width: 6px; height: 3px; border-left: 1.5px solid var(--a-acc-ink); border-bottom: 1.5px solid var(--a-acc-ink); transform: rotate(-45deg) translate(1px, -1px); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font: 500 11px var(--a-font); background: var(--a-sunk); color: var(--a-text2); white-space: nowrap; }
.chip.on { background: var(--a-acc-soft); color: var(--a-acc); }
.chip.line { background: transparent; box-shadow: inset 0 0 0 1px var(--a-line2); }
.chip.rk { background: var(--a-risk-soft); color: var(--a-risk); }
.alert { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; padding: 10px 14px; border-radius: var(--a-pn-r); background: var(--a-risk-soft); border: 1px solid var(--a-risk-line); font-size: 12.5px; align-items: start; }
.alert b { color: var(--a-risk); display: block; font-weight: 600; }
.alert .ico { width: 15px; height: 15px; color: var(--a-risk); margin-top: 2px; }
.alert .acts2 { display: flex; gap: 6px; align-self: center; }
.alert.info { background: var(--a-panel); border-color: var(--a-line); }
.alert.info b { color: var(--a-text); }
.alert.info .ico { color: var(--a-acc); }
.empty { display: grid; justify-items: center; text-align: center; padding: 56px 24px; }
.empty .eg { width: 52px; height: 52px; border: 1px dashed var(--a-line2); border-radius: 50%; display: grid; place-items: center; color: var(--a-text3); margin-bottom: 16px; }
.empty .eg.rk { color: var(--a-risk); border-color: var(--a-risk-line); }
.empty .eg .ico { width: 20px; height: 20px; }
.empty h5 { margin: 0 0 6px; font: 600 16px/1.3 var(--a-font); }
.empty p { margin: 0 0 16px; color: var(--a-text2); max-width: 460px; font-size: 13px; }
.empty .acts2 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.code { font: 400 12px/1.75 var(--a-num); padding: 10px 0; white-space: pre; color: var(--a-text); }
.code > div { display: grid; grid-template-columns: 34px 1fr; padding-right: 14px; }
.code .ln { color: var(--a-text3); text-align: right; padding-right: 12px; }
.code .k { color: var(--a-acc); }
.code .s { color: var(--a-text2); }
.code .err { background: var(--a-risk-soft); box-shadow: inset 2px 0 0 var(--a-risk); }
.code .bad { text-decoration: underline wavy var(--a-risk); text-underline-offset: 3px; }
.code .add { background: var(--a-acc-soft); box-shadow: inset 2px 0 0 var(--a-acc); }
.code .del { color: var(--a-text3); }
.code .del > span:last-child { text-decoration: line-through; text-decoration-color: var(--a-text3); }
.slog { font-size: 12px; }
.slog > div { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--a-line); }
.slog > div:last-child { border-bottom: 0; }
.slog .ts { font: 400 11.5px var(--a-num); color: var(--a-text3); }
.slog .m { color: var(--a-text2); }
.slog b { color: var(--a-text); font-weight: 500; }
.slog .rk b { color: var(--a-risk); }
.wbar { display: grid; grid-template-columns: 46px 1fr 52px 44px; gap: 10px; align-items: center; font-size: 12px; padding: 6px 0; }
.wbar .track { height: 6px; background: var(--a-sunk); position: relative; border-radius: 1px; }
.wbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--a-h2); border-radius: 1px; }
.wbar .tgt { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--a-acc); }
.meter { height: 4px; background: var(--a-sunk); border-radius: 1px; position: relative; overflow: visible; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--a-h2); border-radius: 1px; }
.meter i.rk { background: var(--a-risk); }
.meter .cap { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--a-text); margin: 0; }
.lim { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 9px 0; border-bottom: 1px solid var(--a-line); font-size: 12.5px; }
.lim:last-child { border-bottom: 0; }
.lim .meter { grid-column: 1 / -1; }
.rail { display: flex; border-bottom: 1px solid var(--a-line); background: var(--a-sunk); font-size: 11px; flex: none; }
.rail > div { padding: 6px 14px; border-right: 1px solid var(--a-line); white-space: nowrap; display: flex; flex-direction: column; gap: 2px; }
.rail > div:last-child { margin-left: auto; border-right: 0; justify-content: center; }
.rail .k { color: var(--a-text3); font-size: 10px; }
.rail .v { font: 500 11.5px var(--a-num); display: flex; align-items: center; gap: 6px; }
.checks > div { display: grid; grid-template-columns: 22px 1fr auto 70px; gap: 10px; align-items: center; padding: 0 14px; height: 40px; border-bottom: 1px solid var(--a-line); font-size: 12.5px; }
.checks > div:last-child { border-bottom: 0; }
.checks .no { font: 500 11px var(--a-num); color: var(--a-text3); }
.checks .lm { font: 400 11.5px var(--a-num); color: var(--a-text3); }
.checks .ok { text-align: right; font-size: 11.5px; }
.checks .ok::before { content: "✓ "; color: var(--a-acc); }
.checks .stop { text-align: right; font-size: 11.5px; color: var(--a-risk); font-weight: 600; }
.checks .nr { text-align: right; font-size: 11.5px; color: var(--a-text3); }
.checks .stopr { background: var(--a-risk-soft); box-shadow: inset 2px 0 0 var(--a-risk); }
.checks .skip { color: var(--a-text3); }
.modal { width: 560px; max-width: calc(100% - 32px); background: var(--a-panel); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--a-line2), 0 30px 80px -30px rgba(0,0,0,0.7); overflow: hidden; }
.modal-h { padding: 14px 18px; border-bottom: 1px solid var(--a-line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-h b { font: 600 15px var(--a-font); }
.modal-b { padding: 16px 18px; display: grid; gap: 14px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--a-line); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.modal-f .lft { margin-right: auto; font-size: 11.5px; color: var(--a-text3); }
.ovl { position: absolute; inset: 0; background: var(--a-scrim); z-index: 5; display: grid; place-items: center; }
.ovl.right { place-items: stretch end; }
.drawer { width: 520px; height: 100%; background: var(--a-panel); box-shadow: inset 1px 0 0 var(--a-line2), -30px 0 60px -30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
.drawer .modal-b { flex: 1; overflow: hidden; align-content: start; }
.x { width: 20px; height: 20px; position: relative; color: var(--a-text3); flex: none; display: inline-block; }
.x::before, .x::after { content: ""; position: absolute; left: 4px; right: 4px; top: 9.5px; height: 1.3px; background: currentColor; transform: rotate(45deg); }
.x::after { transform: rotate(-45deg); }
@media (prefers-reduced-motion: reduce) { .st.run.ping i::after, .spin, .caret { animation: none; } .prog i { transition: none; } }

/* Variation components */
.rpt { max-width: 1080px; margin: 0 auto; width: 100%; padding: 30px 0 40px; display: grid; gap: 30px; }
.rpt-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
.rpt-h h3 { margin: 6px 0 0; font: 600 28px/1.15 var(--a-font); letter-spacing: -0.02em; }
.rpt-h .meta { color: var(--a-text3); font-size: 12.5px; margin-top: 6px; }
.lede { margin: 0; font-size: 18px; line-height: 1.6; color: var(--a-text2); max-width: 860px; }
.lede .num { color: var(--a-text); }
.rs { display: grid; gap: 14px; }
.rs-h { display: flex; align-items: baseline; gap: 12px; border-top: 1px solid var(--a-line2); padding-top: 12px; }
.rs-h em { font: 500 11.5px var(--a-num); color: var(--a-text3); font-style: normal; }
.rs-h b { font: 600 15px var(--a-font); }
.rs-h span { margin-left: auto; font-size: 12px; color: var(--a-text3); }
.cells.open > div { padding: 2px 18px 2px 0; border-right: 0; }
.cells.open > div + div { padding-left: 18px; border-left: 1px solid var(--a-line); }

<body>
<header class="ptop"><div class="wrap"><a class="logo" href="#top" id="top"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 2v20M12.4 13v16.5M25.6 13v16.5M16.8 12.5v10M21.2 13v9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><rect x="2" y="7" width="3.2" height="4" rx="0.5" fill="var(--lacc)"/><rect x="6.4" y="4.5" width="3.2" height="14" rx="0.5" fill="currentColor"/><rect x="10.8" y="14.5" width="3.2" height="10" rx="0.5" fill="currentColor"/><rect x="15.2" y="14.5" width="3.2" height="6" rx="0.5" fill="currentColor"/><rect x="19.6" y="15" width="3.2" height="5.5" rx="0.5" fill="currentColor"/><rect x="24" y="14.5" width="3.2" height="10" rx="0.5" fill="currentColor"/><rect x="28.4" y="13" width="2" height="4.5" rx="0.5" fill="currentColor"/></svg>LlamaTrade</a><span>Design decisions · backtests and paper sessions</span></div></header>
<main class="wrap" id="page"></main>
<footer class="foot"><div class="wrap">LlamaTrade design · choose page for backtests and paper sessions, drawn on the B Session tokens with the shared app data. Figures are illustrative. Paper trading only during the closed beta.</div></footer>
<script>
const LT = (() => {
    function mulberry(a) {
        return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function gaussians(seed, n) {
        const r = mulberry(seed);
        const out = [];
        for (let i = 0; i < n; i++) {
            const u = 1 - r();
            const v = r();
            out.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
        }
        return out;
    }
    function tradingDays(start, end) {
        const out = [];
        const d = new Date(start + "T12:00:00Z");
        const e = new Date(end + "T12:00:00Z");
        while (d <= e) {
            const w = d.getUTCDay();
            if (w !== 0 && w !== 6) out.push(new Date(d));
            d.setUTCDate(d.getUTCDate() + 1);
        }
        return out;
    }
    function compound(z, start, end) {
        const n = z.length;
        let s = 0;
        for (let i = 1; i < n; i++) s += z[i];
        const adj = (Math.log(end / start) - s) / (n - 1);
        const out = [start];
        let lv = Math.log(start);
        for (let i = 1; i < n; i++) {
            lv += z[i] + adj;
            out.push(Math.exp(lv));
        }
        return out;
    }
    function shock(z, at, len, amount) {
        for (let i = at; i < at + len && i < z.length; i++) z[i] += amount / len;
    }
    function stats(s, days) {
        const r = [];
        for (let i = 1; i < s.length; i++) r.push(s[i] / s[i - 1] - 1);
        const mean = r.reduce((a, b) => a + b, 0) / r.length;
        const sd = Math.sqrt(r.reduce((a, b) => a + (b - mean) ** 2, 0) / (r.length - 1));
        const down = Math.sqrt(r.reduce((a, b) => a + Math.min(b, 0) ** 2, 0) / r.length);
        let peak = s[0];
        let mdd = 0;
        let mddAt = 0;
        let peakAt = 0;
        let ddPeakAt = 0;
        for (let i = 0; i < s.length; i++) {
            if (s[i] > peak) {
                peak = s[i];
                peakAt = i;
            }
            const dd = s[i] / peak - 1;
            if (dd < mdd) {
                mdd = dd;
                mddAt = i;
                ddPeakAt = peakAt;
            }
        }
        let recoveredAt = -1;
        for (let i = mddAt; i < s.length; i++) {
            if (s[i] >= s[ddPeakAt]) {
                recoveredAt = i;
                break;
            }
        }
        const years = (days[days.length - 1] - days[0]) / (365.25 * 864e5);
        const end = s[s.length - 1];
        return {
            start: s[0],
            end,
            total: end / s[0] - 1,
            cagr: Math.pow(end / s[0], 1 / years) - 1,
            vol: sd * Math.sqrt(252),
            sharpe: (mean / sd) * Math.sqrt(252),
            sortino: (mean / down) * Math.sqrt(252),
            mdd,
            mddAt,
            ddPeakAt,
            recoveredAt,
            recoveryDays: recoveredAt > 0 ? recoveredAt - mddAt : null,
        };
    }
    function drawdown(s) {
        let peak = s[0];
        return s.map((v) => {
            peak = Math.max(peak, v);
            return v / peak - 1;
        });
    }
    function monthly(s, days) {
        const out = [];
        let prev = s[0];
        for (let i = 0; i < s.length; i++) {
            const last = i === s.length - 1 || days[i + 1].getUTCMonth() !== days[i].getUTCMonth();
            if (last) {
                out.push({ y: days[i].getUTCFullYear(), m: days[i].getUTCMonth(), r: s[i] / prev - 1 });
                prev = s[i];
            }
        }
        return out;
    }

    // Recession Radar v3, Nov 1 2024 to Oct 30 2026, $25,000, benchmark SPY.
    function backtest() {
        const days = tradingDays("2024-11-01", "2026-10-30");
        const n = days.length;
        const m = gaussians(11, n).map((x) => x * 0.0098);
        const idio = gaussians(29, n).map((x) => x * 0.0052);
        const aprIdx = days.findIndex((d) => d.toISOString().startsWith("2025-03-24"));
        shock(m, aprIdx, 12, -0.19);
        shock(m, aprIdx + 12, 30, 0.13);
        const spyZ = m.slice();
        const stratZ = m.map((x, i) => x * 0.62 + idio[i]);
        shock(stratZ, aprIdx + 3, 10, 0.065);
        const spy = compound(spyZ, 25000, 31228.4);
        const strat = compound(stratZ, 25000, 30352.18);
        return {
            days,
            strat,
            spy,
            s: stats(strat, days),
            b: stats(spy, days),
            dd: drawdown(strat),
            ddB: drawdown(spy),
            months: monthly(strat, days),
        };
    }

    // One month of account equity for the portfolio screen.
    function accountMonth() {
        const days = tradingDays("2026-10-14", "2026-11-13");
        const z = gaussians(5, days.length).map((x) => x * 0.0046);
        const acct = compound(z, 101_284.6, 103_410.27);
        const zb = gaussians(8, days.length).map((x, i) => x * 0.007 + z[i] * 0.5);
        const spy = compound(zb, 101_284.6, 102_633.9);
        return { days, acct, spy };
    }

    const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const fmt = {
        num(v, dp = 2) {
            return Math.abs(v).toLocaleString("en-US", {
                minimumFractionDigits: dp,
                maximumFractionDigits: dp,
            });
        },
        money(v, dp = 2) {
            return (v < 0 ? "−$" : "$") + fmt.num(v, dp);
        },
        signedMoney(v, dp = 2) {
            return (v < 0 ? "−$" : "+$") + fmt.num(v, dp);
        },
        paren(v, dp = 2) {
            return v < 0 ? "(" + fmt.num(v, dp) + ")" : fmt.num(v, dp);
        },
        pct(v, dp = 1) {
            return (v < 0 ? "−" : "") + fmt.num(v * 100, dp) + "%";
        },
        signedPct(v, dp = 1) {
            return (v < 0 ? "−" : "+") + fmt.num(v * 100, dp) + "%";
        },
        date(d) {
            return MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear();
        },
        short(d) {
            return MON[d.getUTCMonth()] + " " + d.getUTCDate();
        },
        mon(d) {
            return MON[d.getUTCMonth()] + " " + d.getUTCFullYear();
        },
    };

    const NS = "http://www.w3.org/2000/svg";
    function el(tag, attrs, parent) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
    }

    // Line chart with one y-axis, recessive grid and a crosshair tooltip.
    // opts: { days, series: [{ values, cls, label, area }], height, yFmt, xFmt, xTicks, yTicks,
    //         base (value for area baseline), tip(i) -> html, pad }
    let uid = 0;
    function lineChart(host, opts) {
        host.classList.add("ltc");
        if (opts.reveal !== undefined) host._rv = opts.reveal;
        const tip = document.createElement("div");
        tip.className = "ltc-tip";
        host.appendChild(tip);
        let svg;
        function render() {
            if (svg) svg.remove();
            const W = Math.max(260, host.clientWidth);
            const H = opts.height || 260;
            const pad = Object.assign({ t: 12, r: 12, b: 26, l: 56 }, opts.pad || {});
            if (W < 480) pad.l = Math.min(pad.l, 46);
            svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
            if (opts.label) svg.setAttribute("aria-label", opts.label);
            host.insertBefore(svg, tip);
            const all = opts.series.flatMap((s) => s.values);
            let lo = Math.min(...all, opts.base ?? Infinity);
            let hi = Math.max(...all, opts.ceil ?? -Infinity);
            const span = hi - lo || 1;
            if (opts.base === undefined) lo -= span * 0.06;
            if (opts.ceil === undefined) hi += span * 0.06;
            const n = opts.series[0].values.length;
            const x = (i) => pad.l + (i / (n - 1)) * (W - pad.l - pad.r);
            const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
            const yT = opts.yTicks || 4;
            const g = el("g", { class: "ltc-grid" }, svg);
            for (let k = 0; k <= yT; k++) {
                const v = lo + ((hi - lo) * k) / yT;
                const yy = Math.round(y(v)) + 0.5;
                el("line", { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy }, g);
                const t = el("text", { x: pad.l - 8, y: yy + 4, "text-anchor": "end", class: "ltc-ax" }, g);
                t.textContent = (opts.yFmt || ((v) => v.toFixed(0)))(v);
            }
            if (opts.zeroLine !== undefined) {
                const yy = Math.round(y(opts.zeroLine)) + 0.5;
                el("line", { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy, class: "ltc-zero" }, svg);
            }
            const xT = W < 480 ? Math.min(3, opts.xTicks || 5) : opts.xTicks || 5;
            for (let k = 0; k <= xT; k++) {
                const i = Math.round(((n - 1) * k) / xT);
                const t = el("text", {
                    x: x(i),
                    y: H - 6,
                    "text-anchor": k === 0 ? "start" : k === xT ? "end" : "middle",
                    class: "ltc-ax",
                }, svg);
                t.textContent = (opts.xFmt || fmt.mon)(opts.days[i]);
            }
            if (opts.bands) {
                const pid = "hb" + ++uid;
                const pt = el("pattern", { id: pid, width: 5, height: 5, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, el("defs", {}, svg));
                el("line", { x1: 0, y1: 0, x2: 0, y2: 5, class: "ltc-hatch" }, pt);
                opts.bands.forEach((b) => el("rect", { x: x(b.a), y: pad.t, width: Math.max(2, x(b.b) - x(b.a)), height: H - pad.t - pad.b, fill: "url(#" + pid + ")", class: "ltc-band" }, svg));
            }
            const sg = el("g", {}, svg);
            opts.series.forEach((s) => {
                const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
                if (s.area) {
                    const b = y(opts.base ?? lo);
                    el("path", {
                        d: `M${x(0)},${b} L${pts.join(" L")} L${x(n - 1)},${b} Z`,
                        class: s.cls + "-area",
                    }, svg);
                }
                el("path", { d: "M" + pts.join(" L"), class: s.cls, fill: "none" }, svg);
            });
            [...svg.querySelectorAll(":scope > path")].forEach((p) => sg.appendChild(p));
            if (opts.reveal !== undefined) {
                const cid = "rv" + ++uid;
                const cr = el("rect", { x: 0, y: 0, height: H, width: pad.l + (W - pad.l - pad.r) * host._rv }, el("clipPath", { id: cid }, el("defs", {}, svg)));
                sg.setAttribute("clip-path", "url(#" + cid + ")");
                host._reveal = (f) => { host._rv = f; cr.setAttribute("width", pad.l + (W - pad.l - pad.r) * f); };
            }
            let lastX = -99, drop = 0;
            (opts.marks || []).forEach((m) => {
                const v = opts.series[m.s ?? opts.series.length - 1].values[m.i];
                drop = x(m.i) - lastX < 22 && !drop ? 20 : 0;
                lastX = x(m.i);
                const g2 = el("g", { class: "ltc-mk" + (m.on ? " on" : "") }, svg);
                el("line", { x1: x(m.i), x2: x(m.i), y1: pad.t + 9 + drop, y2: y(v), class: "ltc-mk-l" }, g2);
                el("circle", { cx: x(m.i), cy: y(v), r: 2.5, class: "ltc-mk-p" }, g2);
                el("circle", { cx: x(m.i), cy: pad.t + 1 + drop, r: 8.5, class: "ltc-mk-c" }, g2);
                const tt = el("text", { x: x(m.i), y: pad.t + 4.5 + drop, "text-anchor": "middle", class: "ltc-mk-t" }, g2);
                tt.textContent = m.n;
            });
            const cross = el("line", { y1: pad.t, y2: H - pad.b, class: "ltc-cross", visibility: "hidden" }, svg);
            const dots = opts.series.map((s) =>
                el("circle", { r: 4, class: s.cls + "-dot", visibility: "hidden" }, svg),
            );
            const hit = el("rect", {
                x: pad.l, y: 0, width: W - pad.l - pad.r, height: H, fill: "transparent",
            }, svg);
            function move(ev) {
                const r = svg.getBoundingClientRect();
                const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
                const i = Math.max(0, Math.min(n - 1, Math.round(((px - pad.l) / (W - pad.l - pad.r)) * (n - 1))));
                const xx = x(i);
                cross.setAttribute("x1", xx);
                cross.setAttribute("x2", xx);
                cross.setAttribute("visibility", "visible");
                opts.series.forEach((s, k) => {
                    dots[k].setAttribute("cx", xx);
                    dots[k].setAttribute("cy", y(s.values[i]));
                    dots[k].setAttribute("visibility", "visible");
                });
                tip.innerHTML = opts.tip ? opts.tip(i) : "";
                tip.style.display = "block";
                const tw = tip.offsetWidth;
                const left = xx + 14 + tw > W ? xx - 14 - tw : xx + 14;
                tip.style.left = left + "px";
                tip.style.top = pad.t + 4 + "px";
            }
            function leave() {
                cross.setAttribute("visibility", "hidden");
                dots.forEach((d) => d.setAttribute("visibility", "hidden"));
                tip.style.display = "none";
            }
            hit.addEventListener("mousemove", move);
            hit.addEventListener("touchmove", move, { passive: true });
            hit.addEventListener("mouseleave", leave);
            hit.addEventListener("touchend", leave);
        }
        render();
        let last = host.clientWidth;
        new ResizeObserver(() => {
            if (host.clientWidth !== last) {
                last = host.clientWidth;
                render();
            }
        }).observe(host);
    }

    // Monthly returns grid: rows by year, Jan to Dec. cell(r) returns a CSS background.
    function monthlyGrid(host, months, cell) {
        const years = [...new Set(months.map((m) => m.y))];
        let h = '<table class="mg"><thead><tr><th></th>';
        MON.forEach((m) => (h += `<th>${m.slice(0, 1)}<span>${m.slice(1)}</span></th>`));
        h += "<th>Year</th></tr></thead><tbody>";
        years.forEach((y) => {
            h += `<tr><th>${y}</th>`;
            let comp = 1;
            for (let k = 0; k < 12; k++) {
                const f = months.find((m) => m.y === y && m.m === k);
                if (f) {
                    comp *= 1 + f.r;
                    h += `<td style="${cell(f.r)}" title="${MON[k]} ${y}: ${fmt.signedPct(f.r)}">${Math.abs(f.r) < 0.0005 ? "0.0" : (f.r < 0 ? "−" : "") + Math.abs(f.r * 100).toFixed(1)}</td>`;
                } else h += '<td class="mg-none"></td>';
            }
            h += `<td class="mg-year">${fmt.signedPct(comp - 1)}</td></tr>`;
        });
        host.innerHTML = h + "</tbody></table>";
    }

    return { backtest, accountMonth, lineChart, monthlyGrid, fmt, mulberry, tradingDays, MON };
})();

// Shared data and drawing helpers. The run, sessions and orders match app-screens.html.
const K = (() => {
    const { fmt } = LT;
    const bt = LT.backtest();
    const iso = (d) => d.toISOString().slice(0, 10);
    const sp = (v, dp = 1) => fmt.signedPct(v, dp);
    const S = bt.s, B = bt.b;
    function gauss(seed, n) {
        const r = LT.mulberry(seed);
        const out = [];
        for (let i = 0; i < n; i++) { const u = 1 - r(), v = r(); out.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)); }
        return out;
    }
    function compound(z, start, end) {
        const n = z.length;
        let s = 0;
        for (let i = 1; i < n; i++) s += z[i];
        const adj = (Math.log(end / start) - s) / (n - 1);
        const out = [start];
        let lv = Math.log(start);
        for (let i = 1; i < n; i++) { lv += z[i] + adj; out.push(Math.exp(lv)); }
        return out;
    }
    const mk = (seed, vol, beta, end) => {
        const m = gauss(11, bt.days.length).map((x) => x * 0.0098);
        const id = gauss(seed, bt.days.length).map((x) => x * vol);
        return compound(m.map((x, i) => x * beta + id[i]), 25000, end);
    };
    const tech = mk(41, 0.0065, 1.25, 29725);
    const allw = mk(53, 0.0031, 0.42, 28650);
    const v2 = mk(77, 0.0034, 0.5, 29300);
    const intraday = (() => {
        const n = 73, z = gauss(91, n).map((x) => x * 0.0011);
        z[0] = 0;
        return { s: compound(z, 24047.3, 24914.42), n };
    })();
    const idx = (s) => bt.days.findIndex((d) => iso(d) >= s);
    const DEF = ["2025-03", "2025-04", "2025-10", "2026-02", "2026-03", "2026-08", "2025-07"].sort();
    const bands = DEF.map((m) => {
        let a = -1, b = -1;
        bt.days.forEach((d, i) => { if (iso(d).startsWith(m)) { if (a < 0) a = i; b = i; } });
        return { a, b: b + 1 };
    });
    const shA = idx("2025-03-24"), shB = idx("2025-04-11");
    const story = {
        peak: bt.strat[S.ddPeakAt], peakD: bt.days[S.ddPeakAt], lowD: bt.days[S.mddAt], recD: bt.days[S.recoveredAt], spyLowD: bt.days[B.mddAt],
        shS: bt.strat[shB] / bt.strat[shA] - 1, shB: bt.spy[shB] / bt.spy[shA] - 1, shA, shBi: shB,
    };
    // 24 monthly rebalances; the branch each one took and its order count (58 in all).
    const OC = [2, 1, 2, 2, 4, 2, 2, 4, 3, 1, 2, 4, 2, 2, 3, 4, 4, 2, 1, 2, 1, 4, 2, 2];
    const REB = OC.map((c, k) => {

    const allV = [bt.spy, bt.strat, tech, allw].flat();
    const LO = Math.min(...allV) * 0.98, HI = Math.max(...allV) * 1.02;
    const DDLO = Math.min(...[bt.strat, tech, allw].map((s) => Math.min(...ddOf(s))));
    function mount(root) {
        root.querySelectorAll("[data-chart]").forEach((h) => {
            if (h.dataset.done) return;
            h.dataset.done = 1;
            const kd = h.dataset.chart, hh = +h.dataset.h || 180;
            const xt = h.dataset.xt !== undefined ? +h.dataset.xt : undefined;
            const rv = h.dataset.reveal !== undefined ? 0.62 : undefined;
            const base = { days: bt.days, height: hh, xFmt: xm, pad: { l: 36 }, xTicks: xt, reveal: rv };
            if (xt === 0) { base.pad.b = 4; base.xFmt = () => ""; base.xTicks = 1; }
            if (kd === "eq") {
                const o = Object.assign({}, base, { series: [{ values: bt.spy, cls: "s-bench" }, { values: bt.strat, cls: "s-main", area: true }], yFmt: (v) => (v / 1000).toFixed(0) + "k", base: 20000, tip: (i) => `<b>${iso(bt.days[i])}</b>Strategy ${fmt.money(bt.strat[i])}<br>SPY ${fmt.money(bt.spy[i])}` });
                if (h.dataset.bands !== undefined) o.bands = bands;
                if (h.dataset.story) { o.bands = bands; o.marks = DEF_MARKS.map((m) => Object.assign({ on: String(m.n) === h.dataset.story }, m)); o.pad = Object.assign({}, o.pad, { t: 22 }); }
                LT.lineChart(h, o);
            }
            if (kd === "dd") LT.lineChart(h, Object.assign({}, base, { yTicks: 2, series: [{ values: bt.dd, cls: "s-dd", area: true }], yFmt: (v) => (v === 0 ? "0%" : fmt.pct(v, 0)), base: 0, ceil: 0, zeroLine: 0, tip: (i) => `<b>${iso(bt.days[i])}</b>Drawdown ${sp(bt.dd[i])}` }));
            if (kd === "ddb") LT.lineChart(h, Object.assign({}, base, { yTicks: 2, series: [{ values: bt.ddB, cls: "s-ddb" }, { values: bt.dd, cls: "s-dd", area: true }], yFmt: (v) => (v === 0 ? "0%" : fmt.pct(v, 0)), base: 0, ceil: 0, zeroLine: 0, tip: (i) => `<b>${iso(bt.days[i])}</b>Strategy ${sp(bt.dd[i])}<br>SPY ${sp(bt.ddB[i])}` }));
            if (kd === "ver") LT.lineChart(h, Object.assign({}, base, { series: [{ values: bt.spy, cls: "s-bench" }, { values: v2, cls: "s-c2" }, { values: bt.strat, cls: "s-main" }], yFmt: (v) => (v / 1000).toFixed(0) + "k", tip: (i) => `<b>${iso(bt.days[i])}</b>Version 3 ${fmt.money(bt.strat[i])}<br>Version 2 ${fmt.money(v2[i])}<br>SPY ${fmt.money(bt.spy[i])}` }));
            if (kd === "cmp") LT.lineChart(h, Object.assign({}, base, { series: [{ values: bt.spy, cls: "s-bench" }, { values: allw, cls: "s-c3" }, { values: tech, cls: "s-c2" }, { values: bt.strat, cls: "s-main" }], yFmt: (v) => (v / 1000).toFixed(0) + "k", tip: (i) => `<b>${iso(bt.days[i])}</b>Recession Radar ${fmt.money(bt.strat[i])}<br>Tech Momentum ${fmt.money(tech[i])}<br>All-Weather ${fmt.money(allw[i])}` }));
            if (kd === "solo") { const s = SER[h.dataset.s]; LT.lineChart(h, Object.assign({}, base, { base: LO, ceil: HI, series: [{ values: bt.spy, cls: "s-bench" }, { values: s, cls: "s-main", area: true }], yFmt: (v) => (v / 1000).toFixed(0) + "k", tip: (i) => `<b>${iso(bt.days[i])}</b>${fmt.money(s[i])}<br>SPY ${fmt.money(bt.spy[i])}` })); }
            if (kd === "ddsolo") { const d = ddOf(SER[h.dataset.s]); LT.lineChart(h, Object.assign({}, base, { yTicks: 1, series: [{ values: d, cls: "s-dd", area: true }], yFmt: (v) => (v === 0 ? "0%" : fmt.pct(v, 0)), base: DDLO, ceil: 0, zeroLine: 0, tip: (i) => `<b>${iso(bt.days[i])}</b>Drawdown ${sp(d[i])}` })); }
            if (kd === "intra") {
                const days = Array.from({ length: intraday.n }, (_, i) => new Date(Date.UTC(2026, 10, 13, 14, 30 + i)));
                LT.lineChart(h, { days, height: hh, yTicks: 3, xTicks: xt || 4, series: [{ values: intraday.s, cls: "s-main", area: true }], yFmt: (v) => (v / 1000).toFixed(1) + "k", xFmt: (d) => { const m = d.getUTCMinutes() + d.getUTCHours() * 60 - 300; return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); }, base: 23900, pad: { l: 40 }, tip: (i) => `<b>${Math.floor((570 + i) / 60)}:${String((570 + i) % 60).padStart(2, "0")} ET</b>${fmt.money(intraday.s[i])}` });
            }
        });
        root.querySelectorAll("[data-heat]").forEach((h) => {
            if (h.dataset.done) return;
            h.dataset.done = 1;
            const months = h.dataset.s ? monthsOf(SER[h.dataset.s]) : bt.months;
            LT.monthlyGrid(h, months, (r) => {
                const q = Math.round((0.1 + Math.min(1, Math.abs(r) / 0.08) * 0.38) * 100);
                return Math.abs(r) < 0.0005 ? "background:var(--a-sunk)" : `background:color-mix(in srgb, var(${r >= 0 ? "--a-gain" : "--a-loss"}) ${q}%, transparent)`;
            });
            h.querySelectorAll(".mg").forEach((t) => { if (h.classList.contains("tall")) t.classList.add("tall"); if (h.classList.contains("wide")) t.classList.add("wide"); });
            if (h.dataset.sel) { const [y, m] = h.dataset.sel.split("-").map(Number); h.querySelectorAll("td[title]").forEach((td) => { if (td.title.startsWith(LT.MON[m] + " " + y + ":")) td.classList.add("mg-sel"); }); }
        });
        const lazy = new ResizeObserver((ents) => ents.forEach((e) => {
            const h = e.target;
            if (!h.clientWidth) return;
            if (h.hasAttribute("data-fsm") && !h.dataset.done) { h.dataset.done = 1; fsm(h); }
            if (h.hasAttribute("data-scatter") && h._w !== h.clientWidth) { h._w = h.clientWidth; scatter(h); }
        }));
        root.querySelectorAll("[data-fsm], [data-scatter]").forEach((h) => lazy.observe(h));
    }

    // State diagram: arrows between node boxes, measured after layout.
    function fsm(host) {
        const NS = "http://www.w3.org/2000/svg";
        const W = host.clientWidth, H = host.clientHeight;
        const box = (k) => { const e = host.querySelector(`[data-n="${k}"]`); return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight }; };
        const E = [["pend", "run", "first market open", 0], ["run", "wait", "a bar is late", -9], ["wait", "run", "all bars arrive", -9], ["run", "pause", "you pause", -11], ["pause", "run", "you resume", -11], ["run", "frz", "reconciliation mismatch", -10], ["frz", "run", "you resolve it", -10], ["run", "err", "unrecoverable error", 0], ["frz", "stop", "you stop", 0]];
        const edge = (b, cx, cy, dx, dy) => { const tx = dx ? (b.w / 2 + 6) / Math.abs(dx) : Infinity, ty = dy ? (b.h / 2 + 6) / Math.abs(dy) : Infinity, t = Math.min(tx, ty); return [cx + dx * t, cy + dy * t]; };
        let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><marker id="fsm-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="hd2"/></marker></defs>`;
        E.forEach(([a, z, lab, off]) => {
            const A = box(a), Z = box(z);
            const ax = A.x + A.w / 2, ay = A.y + A.h / 2, zx = Z.x + Z.w / 2, zy = Z.y + Z.h / 2;
            const len = Math.hypot(zx - ax, zy - ay), ux = (zx - ax) / len, uy = (zy - ay) / len;
            const px = -uy * off, py = ux * off;
            const [x1, y1] = edge(A, ax + px, ay + py, ux, uy), [x2, y2] = edge(Z, zx + px, zy + py, -ux, -uy);
            const mx = (x1 + x2) / 2 + px * 1.6, my = (y1 + y2) / 2 + py * 1.6;
            const lx = Math.abs(uy) > 0.9 ? mx + (off ? Math.sign(px) * 8 : 8) : mx, ly = Math.abs(uy) > 0.9 ? my + 4 : my + (off ? Math.sign(py || -1) * 6 + (py > 0 ? 8 : 0) : -6);
            svg += `<path class="a" d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" marker-end="url(#fsm-ah)"/><text class="lb" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${Math.abs(uy) > 0.9 ? (px < 0 ? "end" : "start") : "middle"}">${lab}</text>`;
        });
        host.insertAdjacentHTML("afterbegin", svg + "</svg>");
    }

    // Risk and return map
    function scatter(host) {
        const small = host.dataset.small !== undefined;
        const W = Math.max(260, host.clientWidth), H = +host.dataset.h;
        const pad = { l: 42, r: 16, t: 14, b: 30 };
        const xs = (v) => pad.l + ((v + 28) / 28) * (W - pad.l - pad.r);
        const ys = (v) => pad.t + (1 - (v + 2) / 16) * (H - pad.t - pad.b);
        const r = LT.mulberry(7);
        const dim = Array.from({ length: 30 }, () => [-(5 + r() * 19), -1 + r() * 12]);
        const pts = [["Recession Radar v3", S.mdd * 100, S.cagr * 100, 1, -12, 4, "end"], ["Recession Radar v2", -9.6, 8.2, 0, 10, 4, "start"], ["Tech Momentum v2", -21.7, 9.1, 1, 12, 4, "start"], ["All-Weather v1", -12.4, 7.0, 1, 12, 14, "start"], ["Classic 60/40 v1", -13.9, 7.4, 0, -10, -6, "end"], ["Core Four v1", -11.2, 1.1, 0, -10, 4, "end"]];
        let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Runs by annualised return and largest drawdown">`;
        for (let v = -2; v <= 14; v += 4) s += `<line class="sc-refl" x1="${pad.l}" x2="${W - pad.r}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ltc-ax" x="${pad.l - 8}" y="${ys(v) + 3.5}" text-anchor="end">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}%</text>`;
        for (let v = -28; v <= 0; v += small ? 14 : 7) s += `<text class="ltc-ax" x="${xs(v)}" y="${H - 8}" text-anchor="${v === -28 ? "start" : v === 0 ? "end" : "middle"}">${v ? "−" + Math.abs(v) + "%" : "0%"}</text>`;
        dim.forEach(([x, y]) => (s += `<circle class="sc-pt dim" cx="${xs(x)}" cy="${ys(y)}" r="3.2"/>`));
        const bx = xs(B.mdd * 100), by = ys(B.cagr * 100);
        s += `<path class="sc-ref" d="M${bx - 6} ${by}H${bx + 6}M${bx} ${by - 6}V${by + 6}"/><text class="sc-lab" x="${bx + 9}" y="${by + 4}">SPY</text>`;
        pts.forEach(([n, x, y, on, dx, dy, an]) => {
            if (small && !on) return;
            s += `${on ? `<circle class="sc-ring" cx="${xs(x)}" cy="${ys(y)}" r="9"/>` : ""}<circle class="sc-pt ${on ? "on" : "done"}" cx="${xs(x)}" cy="${ys(y)}" r="${on ? 5 : 4}"/>`;
            if (!small || n === "Recession Radar v3") s += `<text class="sc-lab ${on ? "on" : ""}" x="${xs(x) + dx}" y="${ys(y) + dy}" text-anchor="${an}">${small ? "Radar v3" : n}</text>`;
        });
        s += `<text class="ltc-ax" x="${W - pad.r}" y="${pad.t + 4}" text-anchor="end">smaller drawdown →</text></svg>`;
        host.innerHTML = s;
    }

    // Running state: the log streams, the curve draws and the counters climb, then it completes and starts over.
    const runs = [];
    function setRun(r, f) {
        const fc = Math.min(1, f);
        const i = Math.max(1, Math.round(fc * (bt.days.length - 1)));
        const done = fc >= 1;
        r.querySelectorAll(".prog i").forEach((e) => (e.style.width = (fc * 100).toFixed(1) + "%"));
        r.querySelectorAll("[data-pct]").forEach((e) => (e.textContent = Math.round(fc * 100)));
        r.querySelectorAll("[data-thru]").forEach((e) => (e.textContent = iso(bt.days[i])));
        r.querySelectorAll("[data-el]").forEach((e) => { const t = (0.35 + 3.27 * fc).toFixed(2); e.textContent = e.classList.contains("ts") ? t + "s" : t; });
        const reb = REB.filter((x) => x.i <= i).length;
        r.querySelectorAll("[data-reb]").forEach((e) => (e.textContent = reb));
        r.querySelectorAll("[data-ord]").forEach((e) => (e.textContent = REB.filter((x) => x.i <= i).reduce((a, x) => a + x.c, 0)));
        const ret = bt.strat[i] / 25000 - 1, retb = bt.spy[i] / 25000 - 1, mdd = Math.min(...bt.dd.slice(0, i + 1));
        r.querySelectorAll("[data-ret]").forEach((e) => { e.textContent = sp(ret); e.className = e.className.replace(/ ?(gain|loss)/g, "") + (ret < 0 ? " loss" : " gain"); });
        r.querySelectorAll("[data-retb]").forEach((e) => (e.textContent = sp(retb)));
        r.querySelectorAll("[data-mdd]").forEach((e) => { e.textContent = sp(mdd); e.classList.toggle("loss", mdd < 0); });
        r.querySelectorAll("[data-eqv]").forEach((e) => (e.textContent = fmt.money(bt.strat[i], 0)));
        r.querySelectorAll("[data-fin]").forEach((e) => { e.textContent = done ? e.dataset.fin : "·"; e.classList.toggle("t3", !done); e.classList.toggle("gain", done && e.dataset.fin.startsWith("+")); });
        r.querySelectorAll("[data-at]").forEach((e) => (e.style.display = +e.dataset.at <= fc && (+e.dataset.at < 1 || done) ? "" : "none"));
        r.querySelectorAll("[data-live]").forEach((e) => (e.style.display = done ? "none" : ""));
        r.querySelectorAll("[data-term]").forEach((t) => { const vis = [...t.querySelectorAll("[data-tl]")].filter((e) => e.style.display !== "none"); vis.slice(0, Math.max(0, vis.length - 9)).forEach((e) => (e.style.display = "none")); });
        r.querySelectorAll(".ticks i[data-k]").forEach((e) => { const k = +e.dataset.k; e.classList.toggle("on", REB[k].i <= i); e.classList.toggle("cur", !done && k === reb - 1); });
        r.querySelectorAll("[data-reveal]").forEach((h) => h._reveal && h._reveal(fc));
        r.querySelectorAll("[data-state]").forEach((e) => (e.innerHTML = done ? '<span class="st done"><i></i>Completed in 3.8 s</span>' : '<span class="st run ping"><i></i>Running</span>'));
    }



    mount(document);
    document.querySelectorAll("[data-run]").forEach((r) => { runs.push(r); setRun(r, 0.62); });
    const still = window.matchMedia("(prefers-reduced-motion: reduce)");
    let f = 0.62, timer = 0;
    const tick = () => { f += 0.03; if (f > 1.3) f = 0.06; runs.forEach((r) => setRun(r, f)); };
    const motion = () => {
        clearInterval(timer);
        timer = 0;
        if (still.matches) { f = 0.62; runs.forEach((r) => setRun(r, f)); } else timer = setInterval(tick, 520);
    };
    motion();
    still.addEventListener("change", motion);

})();

</script>
<script src="review-bar.js"></script><script src="decide.js"></script>
