<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav lockups</title>
<script>
    try { const m = localStorage.getItem("lts-lockup-mode"); if (m === "light" || m === "dark") document.documentElement.dataset.mode = m; } catch (e) { /* storage unavailable */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;550;600;650;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --sans: "Geist", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    --bg: #0b0e11; --card: #0f1316; --nav: rgba(11,14,17,0.92); --line: rgb(37,44,52); --line-2: rgb(54,64,74);
    --ink: rgb(230,234,238); --ink-2: rgb(170,179,189); --ink-3: rgb(127,137,148);
    --acc: #475f8a; --acc-ink: #ffffff; --acc-mark: #8fa4cf; --acc-soft: rgba(143,164,207,0.14); --tile: rgba(255,255,255,0.04);
    color-scheme: dark;
}
html[data-mode="light"] {
    --bg: #fdfdfd; --card: #f6f7f8; --nav: rgba(253,253,253,0.94); --line: rgb(236,238,241); --line-2: rgb(220,223,227);
    --ink: rgb(17,20,24); --ink-2: rgb(71,77,86); --ink-3: rgb(107,113,122);
    --acc: #1d4e89; --acc-ink: #ffffff; --acc-mark: #1d4e89; --acc-soft: rgba(29,78,137,0.08); --tile: rgba(17,20,24,0.035);
    color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.page { max-width: 1280px; margin: 0 auto; padding: 40px 24px 96px; }
.head { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 36px; }
.head h1 { margin: 0; font: 600 28px/1.15 var(--sans); letter-spacing: -0.03em; }
.head p { margin: 8px 0 0; max-width: 680px; color: var(--ink-2); }
.seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; }
.seg button { font: 500 13px var(--sans); color: var(--ink-2); background: none; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }
h2.sec { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 48px 0 16px; }

.v { margin-bottom: 26px; }
.v-lbl { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 2px 8px; }
.v-lbl .n { font: 500 12px var(--mono); color: var(--ink-3); min-width: 22px; }
.v-lbl b { font-weight: 600; font-size: 15px; }
.v-lbl span.note { color: var(--ink-2); font-size: 14px; }
.v-lbl code { margin-left: auto; font: 400 12px var(--mono); color: var(--ink-3); }
.frame { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.frame .below { height: 26px; background: linear-gradient(var(--bg), var(--card)); }

/* Nav mock, mirrors apps/web marketing .nav */
.nav { background: var(--nav); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 30px; height: 62px; padding: 0 28px; }
.nav .links { display: flex; gap: 26px; font-size: 14.5px; }
.nav .links a { color: var(--ink-2); }
.nav .links a:hover { color: var(--ink); }
.nav .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 8px; font: 500 14px/1 var(--sans); white-space: nowrap; border: 1px solid transparent; }
.btn.ghost { color: var(--ink-2); }
.btn.pri { background: var(--acc); color: var(--acc-ink); }
.phone .nav .wrap { gap: 12px; padding: 0 16px; height: 58px; }
.phone .nav .links, .phone .btn.ghost { display: none; }
.phone .btn { height: 34px; padding: 0 12px; font-size: 13px; }
.phones { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 390px)); gap: 22px; }
.phones .frame { width: 390px; max-width: 100%; }

/* Lockups: every option uses the tracked caps wordmark; the mark gets bigger or more present. */
.logo { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); flex: none; white-space: nowrap; line-height: 1; }
.logo svg { display: block; flex: none; overflow: visible; }
.logo .acc { fill: var(--acc-mark); }
.wm { font: 600 12px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; }
.l-allacc { color: var(--acc-mark); }
.l-allacc .wm { color: var(--ink); }
.l-tile .t, .l-acctile .t, .l-ring .t { display: grid; place-items: center; flex: none; }
.l-tile .t { width: 44px; height: 44px; border-radius: 11px; background: var(--ink); color: var(--bg); }
.l-tile .t .acc { fill: var(--acc-mark); }
.l-acctile .t { width: 44px; height: 44px; border-radius: 11px; background: var(--acc); color: #fff; box-shadow: 0 6px 18px -8px var(--acc); }
.l-acctile .t .acc { fill: #fff; opacity: 0.75; }
.l-ring .t { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.l-glow svg { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--acc-mark) 55%, transparent)); }
.l-glow .acc { filter: drop-shadow(0 0 4px var(--acc-mark)); }
.l-bleed { position: relative; margin: -14px 0; }
.l-div i { width: 1px; height: 26px; background: var(--line-2); }
.l-div .wm { color: var(--ink-2); }
.l-live .last { transform-box: fill-box; transform-origin: bottom; animation: tick 1.8s ease-in-out infinite alternate; }
.l-live .acc { animation: blink 2.4s ease-in-out infinite; }
@keyframes tick { from { transform: scaleY(0.7); } to { transform: scaleY(1.15); } }
@keyframes blink { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .l-live .last, .l-live .acc { animation: none; } }
.l-stackcaps { flex-direction: column; gap: 5px; }
.l-stackcaps .wm { font-size: 9px; letter-spacing: 0.22em; color: var(--ink-2); }
</style>
</head>
<body>
<div class="page">
    <div class="head">
        <div>
            <h1>Nav lockups</h1>
            <p>The Candlesticks mark and the LlamaTrade wordmark in the marketing nav, shown at real size. Every option keeps the tracked caps wordmark you picked and makes the mark bigger or more present. Number 1, Overhang, is the default now on the site.</p>
        </div>
        <div class="seg" role="group" aria-label="Mode">
            <button type="button" data-mode-btn="light">Light</button>
            <button type="button" data-mode-btn="dark">Dark</button>
        </div>
    </div>
    <h2 class="sec">Desktop nav, 62px tall</h2>
    <div id="list"></div>
    <h2 class="sec">Phone, 390px wide</h2>
    <div class="phones" id="phones"></div>
</div>
<script>
(function () {
    const BODY = [[6.4, 4.5, 3.2, 14], [10.8, 14.5, 3.2, 10], [15.2, 14.5, 3.2, 6], [19.6, 15, 3.2, 5.5], [24, 14.5, 3.2, 10], [28.4, 13, 2, 4.5]];
    // o: { sw: wick width, bw: body width scale, hero: big accent candle, wide: extra candles, last: tag last body }
    function mark(size, o) {
        o = o || {};
        const sw = o.sw || 1.1, k = o.bw || 1;
        const body = BODY.map(([x, y, w, h], i) => { const nw = w * k; return `<rect${o.last && i === BODY.length - 1 ? ' class="last"' : ""} x="${(x + (w - nw) / 2).toFixed(2)}" y="${y}" width="${nw.toFixed(2)}" height="${h}" rx="0.5" fill="currentColor"/>`; }).join("");
        const head = o.hero
            ? `<path d="M3.6 2.5v12" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/><rect class="acc" x="1.4" y="4.5" width="${4.4 * k}" height="8" rx="0.7"/>`
            : `<rect class="acc" x="${(2 - (3.2 * k - 3.2) / 2).toFixed(2)}" y="7" width="${(3.2 * k).toFixed(2)}" height="4" rx="0.5"/>`;
        const wicks = `<path d="M8 2v20M12.4 13v16.5M25.6 13v16.5M16.8 12.5v10M21.2 13v9" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/>`;
        const extra = o.wide ? `<path d="M34 9v14M38.4 5v13" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/><rect x="32.4" y="11" width="${3.2 * k}" height="8" rx="0.5" fill="currentColor"/><rect x="36.8" y="7" width="${3.2 * k}" height="6" rx="0.5" fill="currentColor"/>` : "";
        const vw = o.wide ? 42 : 32;
        return `<svg viewBox="0 0 ${vw} 32" width="${(size * vw) / 32}" height="${size}" fill="none" aria-hidden="true">${wicks}${head}${body}${extra}</svg>`;
    }
    const W = (t) => `<span class="wm">${t}</span>`;
    const N = "LlamaTrade";
    const V = [
        { id: "bleed", name: "Overhang (default)", note: "Your pick, now the default: a 60px bold mark that overhangs the nav, with tracked caps.", spec: "mark 60 · −14px margin", html: () => mark(60, { sw: 1.4, bw: 1.1 }) + W(N) },
        { id: "caps", name: "Tracked caps", note: "The earlier caps lockup: 40px mark, small tracked caps.", spec: "mark 40 · Geist 12/600 caps +0.16em", html: () => mark(40) + W(N) },
        { id: "caps46", name: "Bigger mark", note: "Same lockup with the mark up to 46px.", spec: "mark 46", html: () => mark(46) + W(N) },
        { id: "caps52", name: "Biggest mark", note: "52px, close to the full nav height; the mark becomes the logo.", spec: "mark 52", html: () => mark(52) + W(N) },
        { id: "bold", name: "Bold strokes", note: "Thicker wicks and wider bodies, so it reads heavier at the same size.", spec: "mark 44 · wick 1.9 · body ×1.3", html: () => mark(44, { sw: 1.9, bw: 1.3 }) + W(N) },
        { id: "boldbig", name: "Bold and big", note: "Bold strokes at 50px; the strongest presence without colour.", spec: "mark 50 · wick 1.9 · body ×1.3", html: () => mark(50, { sw: 1.9, bw: 1.3 }) + W(N) },
        { id: "hero", name: "Hero candle", note: "The accent candle is taller and wider, so the colour leads.", spec: "mark 46 · accent head", html: () => mark(46, { hero: true, sw: 1.5, bw: 1.15 }) + W(N) },
        { id: "allacc", name: "Accent mark", note: "The whole mark in the accent colour; the word stays in ink.", spec: "mark 44 · accent", html: () => mark(44, { sw: 1.5, bw: 1.15 }) + W(N) },
        { id: "wide", name: "Longer chart", note: "Two extra candles make the mark wider, more of a chart.", spec: "mark 44 · 8 candles", html: () => mark(44, { wide: true, sw: 1.5, bw: 1.15 }) + W(N) },
        { id: "tile", name: "Ink tile", note: "The mark reversed out of a solid tile, like an app icon.", spec: "tile 44 · mark 32", html: () => `<span class="t">${mark(32, { sw: 1.5, bw: 1.15 })}</span>` + W(N) },
        { id: "acctile", name: "Accent tile", note: "White mark on an accent tile with a soft shadow.", spec: "tile 44 · mark 32", html: () => `<span class="t">${mark(32, { sw: 1.5, bw: 1.15 })}</span>` + W(N) },
        { id: "ring", name: "Ring", note: "The mark inside a thin circle; quieter than a tile, still a badge.", spec: "ring 46 · mark 30", html: () => `<span class="t">${mark(30, { sw: 1.4, bw: 1.1 })}</span>` + W(N) },
        { id: "glow", name: "Glow", note: "A soft accent glow behind the mark; suits the dark page most.", spec: "mark 46 · glow", html: () => mark(46, { sw: 1.4, bw: 1.15 }) + W(N) },
        { id: "live", name: "Live candle", note: "The last candle ticks up and down and the accent breathes. Respects reduced motion.", spec: "mark 46 · animated", html: () => mark(46, { sw: 1.4, bw: 1.15, last: true }) + W(N) },
        { id: "div", name: "Divider", note: "Big mark, a hairline, then muted caps.", spec: "mark 46 · rule 26 · caps ink-2", html: () => mark(46, { sw: 1.4, bw: 1.15 }) + "<i></i>" + W(N) },
        { id: "stackcaps", name: "Stacked caps", note: "Big mark with tiny tracked caps underneath.", spec: "mark 40 · caps 9", html: () => mark(40, { sw: 1.4, bw: 1.15 }) + W(N) },
    ];
    const PHONE = ["bleed", "caps", "boldbig", "acctile"];
    const LINKS = ["Build", "Backtest", "Copilot", "Sessions", "Your account"];
    const nav = (v) => `<header class="nav"><div class="wrap"><a class="logo l-${v.id}" href="#" aria-label="LlamaTrade">${v.html()}</a><nav class="links">${LINKS.map((l) => `<a href="#">${l}</a>`).join("")}</nav><div class="end"><a class="btn ghost" href="#">Read the source</a><a class="btn pri" href="#">Request an invite</a></div></div></header><div class="below"></div>`;
    const lbl = (v, i) => `<div class="v-lbl"><span class="n">${String(i + 1).padStart(2, "0")}</span><b>${v.name}</b><span class="note">${v.note}</span><code>${v.spec}</code></div>`;
    document.getElementById("list").innerHTML = V.map((v, i) => `<section class="v">${lbl(v, i)}<div class="frame${v.peek ? " peek" : ""}">${nav(v)}</div></section>`).join("");
    document.getElementById("phones").innerHTML = PHONE.map((id) => {
        const i = V.findIndex((v) => v.id === id), v = V[i];
        return `<section class="v phone"><div class="v-lbl"><span class="n">${String(i + 1).padStart(2, "0")}</span><b>${v.name}</b></div><div class="frame">${nav(v)}</div></section>`;
    }).join("");
    document.querySelectorAll(".frame a").forEach((a) => a.addEventListener("click", (e) => e.preventDefault()));

    const html = document.documentElement;
    function setMode(m) {
        html.dataset.mode = m;
        try { localStorage.setItem("lts-lockup-mode", m); } catch (e) { /* storage unavailable */ }
        document.querySelectorAll("[data-mode-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.modeBtn === m)));
    }
    document.querySelectorAll("[data-mode-btn]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.modeBtn)));
    setMode(html.dataset.mode === "light" ? "light" : "dark");
})();
</script>
<script src="review-bar.js"></script>
</body>
</html>
