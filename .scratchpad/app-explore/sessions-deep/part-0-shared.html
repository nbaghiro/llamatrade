<style>
  /* ================= Sessions round two: shared bits (prefix n2-) ================= */
  .n2-crumb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-3); margin-bottom: 8px; }
  .n2-crumb .ic { width: 13px; height: 13px; }
  .n2-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n2-meta { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n2-kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .n2-kv > div:last-child { border-bottom: 0; }
  .n2-kv > div > span:first-child { color: var(--fg-2); }
  .n2-kv > div > span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .n2-tag { display: inline-grid; place-items: center; min-width: 38px; height: 20px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line-2); font: 500 10px var(--mono); color: var(--fg-2); letter-spacing: 0.04em; flex: none; }
  .n2-tag.risk { color: var(--risk); border-color: var(--risk-line); background: var(--risk-soft); }
  .n2-n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--acc); color: var(--bg); font: 600 10px var(--mono); flex: none; }
  .n2-n.risk { background: var(--risk); }
  .n2-n.off { background: var(--sunk); color: var(--fg-3); box-shadow: inset 0 0 0 1px var(--line-2); }
  .n2-prow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .n2-prow:last-child { border-bottom: 0; }
  .n2-prow .grow { flex: 1; min-width: 0; }
  .n2-prow .end { text-align: right; flex: none; }
  .n2-prow .d { font-size: 12.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n2-leg { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--fg-2); }
  .n2-leg > span { display: inline-flex; align-items: center; gap: 7px; }
  .n2-leg .l { width: 14px; border-top: 2px solid var(--acc); }
  .n2-leg .d { width: 14px; border-top: 1.5px dashed var(--fg-3); }
  .n2-mini-pill { height: 17px !important; font-size: 9.5px !important; padding: 0 6px !important; }
  .n2-paper { border-style: dashed !important; border-color: var(--line-2) !important; }
  .n2-chev { color: var(--fg-4); width: 15px; height: 15px; }

  /* Target bars: upper bar is now, lower bar is the target */
  .n2-tw { display: grid; grid-template-columns: 44px minmax(0, 1fr) 92px; align-items: center; gap: 10px; font-size: 12px; }
  .n2-tw .bars { position: relative; height: 14px; }
  .n2-tw .bars i { position: absolute; left: 0; height: 5px; border-radius: 3px; }
  .n2-tw .bars .now { top: 0; background: var(--acc); }
  .n2-tw .bars .tgt { top: 8px; background: var(--fg-4); }

  /* The annotated timeline: label column, past, and a shaded future after the Now line */
  .n2-tl { display: grid; grid-template-columns: var(--lab, 200px) minmax(0, 1fr) var(--fut, 200px); }
  .n2-tl > .lab { padding-right: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; }
  .n2-tl > .past, .n2-tl > .fut { position: relative; min-width: 0; }
  .n2-tl > .fut { background: color-mix(in srgb, var(--sunk) 70%, transparent); border-left: 1.5px solid var(--fg); }
  .n2-tl.nofut { grid-template-columns: var(--lab, 200px) minmax(0, 1fr); }
  .n2-pins { height: 34px; }
  .n2-pin { position: absolute; top: 6px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 7px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line-2); font: 500 10.5px var(--mono); color: var(--fg-2); white-space: nowrap; z-index: 2; }
  .n2-pin.end { transform: translateX(-100%); }
  .n2-pin.start { transform: none; }
  .n2-pin.acc { border-color: var(--acc-line); color: var(--fg); background: var(--acc-soft); }
  .n2-pin.risk { border-color: var(--risk-line); color: var(--risk); background: var(--risk-soft); }
  .n2-vl { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line-2); pointer-events: none; z-index: 1; }
  .n2-vl.risk { border-left-color: var(--risk-line); }
  .n2-now { position: absolute; top: 8px; left: -1px; transform: translateX(-50%); padding: 1px 6px; border-radius: 4px; background: var(--fg); color: var(--bg); font: 600 10px var(--mono); white-space: nowrap; z-index: 3; }
  .n2-fut .ttl, .n2-tl > .fut .ttl { position: absolute; top: 34px; left: 12px; right: 10px; font-size: 11.5px; color: var(--fg-3); }
  .n2-fut .nx, .n2-tl > .fut .nx { position: absolute; left: 12px; right: 12px; font-size: 11.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n2-lane { height: 28px; border-top: 1px solid var(--line); }
  .n2-lane .bar { position: absolute; top: 13px; height: 1.5px; background: var(--line-2); }
  .n2-lane .bar.on { background: color-mix(in srgb, var(--acc) 55%, var(--line-2)); }
  .n2-lane .bar.plan { background: none; border-top: 1.5px dashed var(--line-2); height: 0; }
  .n2-lane .bar.frz { background: var(--risk); height: 3px; top: 12px; border-radius: 2px; }
  .n2-lane .bar.frz.plan { background: none; border-top: 1.5px dashed var(--risk-line); height: 0; top: 13px; }
  .n2-lane .lt { position: absolute; top: 6px; font-size: 11px; color: var(--fg-3); white-space: nowrap; }
  .n2-m { position: absolute; top: 9px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--acc); z-index: 2; }
  .n2-m.plan { border-style: dashed; border-color: var(--fg-3); }
  .n2-m.start { border-radius: 2px; background: var(--acc); border-color: var(--acc); width: 3px; height: 14px; margin-left: -1.5px; top: 7px; }
  .n2-m.stop { border-radius: 2px; background: var(--fg-3); border-color: var(--fg-3); }
  .n2-m.fill { width: 16px; height: 16px; margin-left: -8px; top: 6px; background: var(--acc); border-color: var(--acc); color: var(--bg); font: 600 9.5px/13px var(--mono); text-align: center; }
  .n2-m.risk { background: var(--risk); border-color: var(--risk); box-shadow: 0 0 0 3px var(--risk-soft); }
  .n2-m.risk.fill { color: var(--bg); }
  .n2-m.live { border-radius: 2px; background: var(--ink); border-color: var(--ink); width: 3px; height: 14px; margin-left: -1.5px; top: 7px; }
  .n2-xl { height: 22px; border-top: 1px solid var(--line); }
  .n2-xl span { position: absolute; top: 5px; font: 400 10.5px var(--mono); color: var(--fg-3); transform: translateX(-50%); white-space: nowrap; }
  .n2-keys { display: flex; gap: 14px; font-size: 11.5px; color: var(--fg-3); align-items: center; flex-wrap: wrap; }
  .n2-keys > span { display: inline-flex; align-items: center; gap: 6px; }
  .n2-keys .n2-m { position: static; margin: 0; }
  /* Phone lanes */
  .n2-plane { position: relative; height: 24px; border-top: 1px solid var(--line); }
  .n2-plane .bar { position: absolute; top: 11px; height: 1.5px; background: var(--line-2); }
  .n2-plane .bar.on { background: color-mix(in srgb, var(--acc) 55%, var(--line-2)); }
  .n2-plane .bar.frz { background: var(--risk); height: 3px; top: 10px; border-radius: 2px; }
  .n2-plane .bar.plan { background: none; border-top: 1.5px dashed var(--line-2); height: 0; }
  .n2-plane .n2-m { top: 7px; }
  .n2-plane .n2-m.fill { top: 4px; }
  .n2-plane .n2-m.start, .n2-plane .n2-m.live { top: 5px; }
  .n2-plane .lab { position: absolute; left: 0; top: 5px; font: 500 10px var(--mono); color: var(--fg-3); }
  .n2-plane .nowl { position: absolute; top: -1px; bottom: 0; border-left: 1.5px solid var(--fg); }

  /* Real money, said calmly: a neutral panel with an ink edge and a lock */
  .n2-real { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line-2); box-shadow: inset 3px 0 0 var(--ink); font-size: 13px; color: var(--fg-2); line-height: 1.5; }
  .n2-real .ic { width: 18px; height: 18px; color: var(--fg); margin-top: 1px; }
  .n2-real b { color: var(--fg); font-weight: 600; }
  .n2-radio { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .n2-radio.on { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
  .n2-radio .rd { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-2); margin-top: 2px; }
  .n2-radio.on .rd { border: 5px solid var(--ink); }
  .n2-radio .t { font-weight: 600; }
  .n2-radio .d { color: var(--fg-2); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
  .n2-gap { font-size: 11.5px; color: var(--fg-3); display: inline-flex; align-items: center; gap: 6px; }
  .n2-gap .ic { width: 12px; height: 12px; }
</style>
