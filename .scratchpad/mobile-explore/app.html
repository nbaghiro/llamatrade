<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--x-bg); }

  #stage { position: fixed; inset: 0; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity 0.14s ease; background: var(--x-bg); }
  #stage iframe.on { opacity: 1; }

  .vb {
    position: fixed; left: 50%; bottom: 14px; z-index: 80; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 5px; max-width: calc(100vw - 24px);
    border-radius: 999px; border: 1px solid var(--x-line-2);
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 10px 34px -12px rgba(0, 0, 0, 0.45);
    font: 500 12.5px/1 var(--sans); color: var(--fg-2); white-space: nowrap;
    transition: opacity 0.35s ease;
  }
  .vb.dim { opacity: 0.3; }
  .vb:hover, .vb:focus-within { opacity: 1; }
  .vb.gone, .vw-pop.gone { display: none !important; }
  .vb button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; min-width: 30px; padding: 0 8px; border-radius: 999px; color: var(--fg-2); }
  .vb button:hover { background: var(--sunk); color: var(--fg); }
  .vb button:focus-visible { outline: 1.5px solid var(--acc); outline-offset: 1px; }
  .vb button[disabled] { opacity: 0.35; cursor: default; background: none; }
  .vb svg { width: 16px; height: 16px; }
  .vb .sep { width: 1px; height: 18px; margin: 0 4px; background: var(--x-line-2); flex: none; }
  .vb .where { max-width: 320px; padding: 0 10px 0 12px; gap: 8px; }
  .vb .where .ar { color: var(--fg); font-weight: 600; }
  .vb .where .sc { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .vb .where .ct { font: 400 11px var(--mono); color: var(--fg-3); }
  .vb .oname { font-size: 12.5px; color: var(--fg); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 6px; }

  .vw-pop {
    position: fixed; left: 50%; bottom: 66px; z-index: 81; transform: translateX(-50%);
    width: min(560px, calc(100vw - 24px)); padding: 16px 18px 14px; border-radius: 14px;

    padding: 22px 24px 18px; border-radius: 16px; border: 1px solid var(--x-line-2);

  }

  .vw-ov .hd span { font: 400 12px var(--mono); color: var(--fg-3); }
  .vw-ov .hd a { margin-left: auto; font-size: 12.5px; color: var(--fg-2); text-decoration: none; }
  .vw-ov .hd a:hover { color: var(--fg); }
  .vw-ov .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px 16px; }
  .vw-ov .ar h4 { margin: 0 0 6px; display: flex; align-items: baseline; gap: 8px; font: 600 13px var(--sans); color: var(--fg); }
  .vw-ov .ar h4 i { font: 400 11px var(--mono); font-style: normal; color: var(--fg-3); }
  .vw-ov .ar button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; padding: 3px 8px; margin-left: -8px; border-radius: 7px; }

  .vw-ov .ar button.cur { background: var(--acc-soft); color: var(--fg); }
  .vw-ov .ar button .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vw-ov .ar button b { font: 500 11px var(--mono); color: var(--fg-4); }

  .vw-ov .keys { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--x-line); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--fg-3); }
  .vw-ov .keys kbd { font: 500 11px var(--mono); color: var(--fg-2); border: 1px solid var(--x-line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; margin-right: 4px; }

ea-alerts.html","anchor":"al-push","title":"Push notifications","areaName":"Alerts"}]},"alerts/grouping":{"sid":"alerts/grouping","area":"alerts","title":"Grouping and lock-screen actions","why":"How a morning's notices stack on the lock screen and what you can do from them without opening the app. Pausing a session moves real orders, so the options differ most in where Face ID comes in.","opts":[{"id":"A","name":"One LlamaTrade stack","note":"Everything from LlamaTrade sits in one stack, which is what iOS does when the app sets no thread. The top card is the newest notice, so a fill can sit on top of the freeze. Long-press offers only Open and Mute for an hour, the default actions. It needs nothing beyond push. It's tidy, but the stack hides the one notice that needs you behind routine ones until you tap to expand it.","rec":false,"frames":[{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-clock\"><div class=\"dt\">Tuesday, November 17<\/div><div class=\"tm\">10:42<\/div><\/div>\n        <div class=\"io-stack\">\n          <div class=\"io-nt stack\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Sold 9 GLD<\/b><span>10:31<\/span><\/div><div class=\"tx c2\">Recession Radar sold 9 GLD at $247.86 in paper.<\/div><div class=\"more\">5 more notifications<\/div><\/div><\/div>\n        <\/div>\n        <div class=\"io-lockfoot\"><span data-icon=\"bolt\"><\/span><span data-icon=\"eye\"><\/span><\/div>\n      <\/div>\n    ","cap":"Collapsed","ds":{"statusbar":"lock"}},{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-clock dim\" style=\"padding-top:8px\"><div class=\"tm\" style=\"font-size:44px\">10:42<\/div><\/div>\n        <div class=\"io-stack\" style=\"top:84px;bottom:auto\">\n          <div class=\"al-hd\">LlamaTrade<span>Show less<\/span><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Sold 9 GLD<\/b><span>10:31<\/span><\/div><div class=\"tx c2\">Recession Radar sold 9 GLD at $247.86 in paper.<\/div><\/div><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Bought 42 TLT<\/b><span>10:31<\/span><\/div><div class=\"tx c2\">Recession Radar bought 42 TLT at $90.41 in paper.<\/div><\/div><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Order rejected<\/b><span>10:12<\/span><\/div><div class=\"tx c2\">Recession Radar's buy of 124 TLT is over your $10,000 order limit.<\/div><\/div><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Bought 31 VGLT<\/b><span>9:45<\/span><\/div><div class=\"tx c2\">All-Weather Portfolio bought 31 VGLT at $58.12 in live.<\/div><\/div><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Momentum Sectors is frozen<\/b><span>9:31<\/span><\/div><div class=\"tx c2\">Alpaca shows 43 SMH shares and the ledger 31.<\/div><\/div><\/div>\n        <\/div>\n      <\/div>\n    ","cap":"Tapped open","ds":{"statusbar":"lock"}},{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-blur\"><\/div>\n        <div class=\"io-front\" style=\"top:200px\">\n          <div class=\"io-nt focus\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Momentum Sectors is frozen<\/b><span>9:31<\/span><\/div><div class=\"tx\">Alpaca shows 43 SMH shares and the ledger 31.<\/div><\/div><\/div>\n          <div class=\"io-acts w\" style=\"margin-left:auto\"><span>Mute for 1 hour<span data-icon=\"bell-off\"><\/span><\/span><span>Mute for today<span data-icon=\"bell-off\"><\/span><\/span><span>Turn off<span data-icon=\"x\"><\/span><\/span><\/div>\n        <\/div>\n      <\/div>\n    ","cap":"Long-press: the default actions","ds":{"statusbar":"lock"}}],"key":"A","sid":"alerts/grouping","page":"area-alerts.html","anchor":"al-grouping","title":"Grouping and lock-screen actions","areaName":"Alerts"},{"id":"B","name":"One stack per session, actions that open the app","note":"Recommended. Each session gets its own stack (one thread per session), so the morning reads as three lines: Momentum Sectors needs you, Recession Radar has a rejection and a rebalance, All-Weather bought once. Long-press offers Review, Pause this session, Mute this session today and Open on the web. Review and Pause open the app, and Pause shows the same confirmation as in the app with Face ID, so nothing that moves orders happens from the lock screen. It's one more tap than a background action, which is the point for real money. Needs push, a notification category with these actions registered in the app, thread ids per session from the server, and local authentication (expo-local-authentication isn't installed).","rec":true,"frames":[{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-clock\"><div class=\"dt\">Tuesday, November 17<\/div><div class=\"tm\">10:42<\/div><\/div>\n        <div class=\"io-stack\">\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"al-ts\"><span data-icon=\"clock\"><\/span>Time Sensitive<\/div><div class=\"hd\"><b>Momentum Sectors is frozen<\/b><span>9:31<\/span><\/div><div class=\"tx c2\">Alpaca shows 12 more SMH shares than the ledger. New orders wait until you review it.<\/div><\/div><\/div>\n          <div class=\"io-nt stack\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Recession Radar<\/b><span>10:31<\/span><\/div><div class=\"tx c2\">Rebalanced: bought 42 TLT, sold 9 GLD.<\/div><div class=\"more\">1 more: an order was rejected<\/div><\/div><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>All-Weather Portfolio<\/b><span>9:45<\/span><\/div><div class=\"tx c2\">Bought 31 VGLT at $58.12 in live.<\/div><\/div><\/div>\n        <\/div>\n        <div class=\"io-lockfoot\"><span data-icon=\"bolt\"><\/span><span data-icon=\"eye\"><\/span><\/div>\n      <\/div>\n    ","cap":"Grouped by session","ds":{"statusbar":"lock"}},{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-blur\"><\/div>\n        <div class=\"io-front\" style=\"top:150px\">\n          <div class=\"io-nt focus\"><span data-appicon><\/span><div class=\"bd\"><div class=\"al-ts\"><span data-icon=\"clock\"><\/span>Time Sensitive<\/div><div class=\"hd\"><b>Momentum Sectors is frozen<\/b><span>9:31<\/span><\/div><div class=\"tx\">Alpaca shows 12 more SMH shares than the ledger. New orders wait until you review it.<\/div><\/div><\/div>\n          <div class=\"io-acts\"><span>Review the difference<span data-icon=\"arrow-right\"><\/span><\/span><span>Pause this session<span data-icon=\"pause\"><\/span><\/span><span>Mute this session today<span data-icon=\"bell-off\"><\/span><\/span><span>Open on the web<span data-icon=\"laptop\"><\/span><\/span><\/div>\n          <div style=\"margin-top:12px;padding:0 8px;font:400 13px var(--ios);color:rgba(255,255,255,0.8);text-align:center\">Review and Pause open LlamaTrade. Mute only affects notifications.<\/div>\n        <\/div>\n      <\/div>\n    ","cap":"Long-press the freeze","ds":{"statusbar":"lock"}},{"kind":"phone","html":"\n      <div class=\"m-nav\"><span class=\"back\"><span data-icon=\"chevron-left\"><\/span>Sessions<\/span><span style=\"font-size:15px\">Momentum Sectors<\/span><span class=\"m-ic\"><span data-icon=\"more\"><\/span><\/span><\/div>\n      <div class=\"m-body\">\n        <div class=\"row\"><span class=\"pill paper\">Paper<\/span><span class=\"st frozen\">Frozen since 09:31<\/span><\/div>\n        <div class=\"big\">$22,118.07<\/div>\n      <\/div>\n      <nav data-tabs=\"sessions\" data-dot=\"activity\"><\/nav>\n      <div class=\"scrim\"><\/div>\n      <div class=\"io-sheet fit\"><div class=\"grab\"><\/div>\n        <div class=\"sb2\" style=\"padding-top:8px\">\n          <div class=\"h2\">Pause Momentum Sectors?<\/div>\n          <div class=\"muted\" style=\"font-size:14.5px;line-height:1.5\">It stops placing orders. It keeps its holdings and its schedule, and the freeze stays until you review the difference. You can resume at any time.<\/div>\n          <div class=\"m-btn\"><span data-icon=\"faceid\"><\/span>Pause with Face ID<\/div>\n          <div class=\"m-btn ghost\">Cancel<\/div>\n        <\/div>\n      <\/div>\n    ","cap":"Pause opens the app, then Face ID","ds":{}}],"key":"B","sid":"alerts/grouping","page":"area-alerts.html","anchor":"al-grouping","title":"Grouping and lock-screen actions","areaName":"Alerts"},{"id":"C","name":"Stacks by kind","note":"Three stacks: Needs you, Orders and Summaries. The top stack is always the one to act on, and on a quiet day it simply isn't there. Grouping by kind is easy to explain and works the same with one session or twenty. It splits one session's story across stacks, so the rejection and the rebalance it belonged to sit apart, and the session names move into the body text. Needs push and thread ids per kind, which map directly onto the existing notification types.","rec":false,"frames":[{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-clock\"><div class=\"dt\">Tuesday, November 17<\/div><div class=\"tm\">10:42<\/div><\/div>\n        <div class=\"io-stack\">\n          <div class=\"io-nt stack\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Needs you: 2<\/b><span>10:12<\/span><\/div><div class=\"tx c2\">Recession Radar's buy of 124 TLT was rejected. Momentum Sectors is frozen.<\/div><\/div><\/div>\n          <div class=\"io-nt stack\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Orders: 3 filled<\/b><span>10:31<\/span><\/div><div class=\"tx c2\">42 TLT, 9 GLD in Recession Radar; 31 VGLT in All-Weather (live).<\/div><\/div><\/div>\n        <\/div>\n        <div class=\"io-lockfoot\"><span data-icon=\"bolt\"><\/span><span data-icon=\"eye\"><\/span><\/div>\n      <\/div>\n    ","cap":"Grouped by kind","ds":{"statusbar":"lock"}},{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-clock dim\" style=\"padding-top:8px\"><div class=\"tm\" style=\"font-size:44px\">10:42<\/div><\/div>\n        <div class=\"io-stack\" style=\"top:84px;bottom:auto\">\n          <div class=\"al-hd\">Needs you<span>Show less<\/span><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>An order was rejected<\/b><span>10:12<\/span><\/div><div class=\"tx c2\">Recession Radar's buy of 124 TLT ($11,210.84) is over your $10,000 order limit.<\/div><\/div><\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Momentum Sectors is frozen<\/b><span>9:31<\/span><\/div><div class=\"tx c2\">Alpaca shows 43 SMH shares and the ledger 31.<\/div><\/div><\/div>\n          <div class=\"al-hd\" style=\"margin-top:10px\">Orders<span>3<\/span><\/div>\n          <div class=\"io-nt stack al-dim\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Sold 9 GLD<\/b><span>10:31<\/span><\/div><div class=\"tx c2\">Recession Radar, paper.<\/div><\/div><\/div>\n        <\/div>\n      <\/div>\n    ","cap":"Needs you, tapped open","ds":{"statusbar":"lock"}}],"key":"C","sid":"alerts/grouping","page":"area-alerts.html","anchor":"al-grouping","title":"Grouping and lock-screen actions","areaName":"Alerts"},{"id":"D","name":"Act from the lock screen","note":"Grouped by session as in B, but Pause and Mute run in the background from the notice itself: iOS asks you to unlock (Face ID) and the app confirms with a second notice. It's the fastest path, about two seconds from seeing the freeze to a paused session. It also means a session can be paused with no screen explaining what pausing keeps, and a mistaken press on a live session takes effect at once. Needs push, a category with an authentication-required background action, a background handler that can call the trading API with a stored token, and a pause endpoint the phone can reach while the app isn't running.","rec":false,"frames":[{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-blur\"><\/div>\n        <div class=\"io-front\" style=\"top:170px\">\n          <div class=\"io-nt focus\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Momentum Sectors is frozen<\/b><span>9:31<\/span><\/div><div class=\"tx\">Alpaca shows 12 more SMH shares than the ledger.<\/div><\/div><\/div>\n          <div class=\"io-acts\"><span>Pause this session<span data-icon=\"pause\"><\/span><\/span><span>Mute this session today<span data-icon=\"bell-off\"><\/span><\/span><span>Review in the app<span data-icon=\"arrow-right\"><\/span><\/span><\/div>\n        <\/div>\n      <\/div>\n    ","cap":"Long-press the freeze","ds":{"statusbar":"lock"}},{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-blur\"><\/div>\n        <div class=\"io-faceid\" style=\"color:#fff;background:rgba(40,40,44,0.7)\"><span data-icon=\"faceid\"><\/span>Face ID<\/div>\n      <\/div>\n    ","cap":"Pause asks to unlock","ds":{"statusbar":"lock"}},{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-clock\"><div class=\"inl\"><span data-icon=\"lock\"><\/span>Unlocked<\/div><div class=\"tm\">10:43<\/div><\/div>\n        <div class=\"io-stack\">\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Momentum Sectors is paused<\/b><span>now<\/span><\/div><div class=\"tx c2\">It keeps its holdings and places no orders. The SMH difference still needs a review before it can resume.<\/div><\/div><\/div>\n          <div class=\"io-nt stack\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Recession Radar<\/b><span>10:31<\/span><\/div><div class=\"tx c2\">Rebalanced: bought 42 TLT, sold 9 GLD.<\/div><\/div><\/div>\n        <\/div>\n        <div class=\"io-lockfoot\"><span data-icon=\"bolt\"><\/span><span data-icon=\"eye\"><\/span><\/div>\n      <\/div>\n    ","cap":"Confirmed by a second notice","ds":{"statusbar":"lock"}}],"key":"D","sid":"alerts/grouping","page":"area-alerts.html","anchor":"al-grouping","title":"Grouping and lock-screen actions","areaName":"Alerts"}]},"alerts/settings":{"sid":"alerts/settings","area":"alerts","title":"Notification settings and quiet hours","why":"When the app asks for permission, how you choose what reaches the phone and when it stays quiet. A freeze or a rejected order at night is still worth knowing about, so each option says what breaks through.","opts":[{"id":"A","name":"Ask at first launch","note":"The iOS permission prompt appears the first time the app opens, before sign-in, and settings are a short list of switches under Account. It's the least work and the common pattern. Asking before anyone has a session gives no reason to say yes, and iOS only shows its prompt once, so a no means a trip to the Settings app later. The switches are push only, so email lives on the web. Needs push and nothing new on the server beyond a device token.","rec":false,"frames":[{"kind":"phone","html":"<div data-page-art=\"alerts\" class=\"full\" data-seed=\"0\" data-top=\"0.1\" data-band=\"0.6\" style=\"--pa-hole:24%;--pa-hole-h:20%\"><\/div>\n      <div class=\"m-body\" style=\"padding-top:40px;align-items:center;text-align:center\">\n        <span data-logo=\"mark\" data-size=\"56\"><\/span>\n        <div class=\"h1\" style=\"margin-top:10px\">LlamaTrade<\/div>\n        <div class=\"muted\" style=\"font-size:15px\">Strategies, backtests and sessions on your own Alpaca account.<\/div>\n      <\/div>\n      <div class=\"scrim\"><\/div>\n      <div class=\"io-alert\"><div class=\"ab\"><div class=\"at\">“LlamaTrade” Would Like to Send You Notifications<\/div>Notifications may include alerts, sounds and icon badges. These can be configured in Settings.<\/div><div class=\"bts\"><span>Don't Allow<\/span><span class=\"b\">Allow<\/span><\/div><\/div>\n    ","cap":"First launch","ds":{}},{"kind":"phone","html":"\n      <div class=\"m-nav\"><span class=\"back\"><span data-icon=\"chevron-left\"><\/span>Account<\/span><span>Notifications<\/span><span style=\"width:28px\"><\/span><\/div>\n      <div class=\"m-body\">\n        <div class=\"io-sec\">Push<\/div>\n        <div class=\"io-list\">\n          <div><span class=\"grow\">Fills<\/span><span class=\"io-tg on\"><\/span><\/div>\n          <div><span class=\"grow\">Frozen sessions<\/span><span class=\"io-tg on\"><\/span><\/div>\n          <div><span class=\"grow\">Rejected orders<\/span><span class=\"io-tg on\"><\/span><\/div>\n          <div><span class=\"grow\">Daily summary<\/span><span class=\"io-tg\"><\/span><\/div>\n          <div><span class=\"grow\">Price alerts<\/span><span class=\"io-tg on\"><\/span><\/div>\n        <\/div>\n        <div class=\"io-foot\">Email and webhooks are set on the web, in Settings › Notifications.<\/div>\n      <\/div>\n      <nav data-tabs=\"account\" data-dot=\"activity\"><\/nav>\n    ","cap":"Account › Notifications","ds":{}}],"key":"A","sid":"alerts/settings","page":"area-alerts.html","anchor":"al-settings","title":"Notification settings and quiet hours","areaName":"Alerts"},{"id":"B","name":"Ask when it matters, then the grid","note":"Recommended. The app asks only after you start your first session, with a short screen that shows the exact notice you'd get, then the iOS prompt. Settings use the same grid as the web (kinds down the side, Push and Email across, in-app always on) and a Quiet hours row with the one rule people need: during quiet hours only a freeze or a rejected order comes through. The ask lands when the answer is obvious, and the grid matches desktop, so a change on one shows on the other. Needs push, a Push column in the preference model (ChannelType already has PUSH; GetPreferences and UpdatePreferences need to carry it), quiet hours stored on the server so they hold across devices, and the Time Sensitive entitlement for what breaks through.","rec":true,"frames":[{"kind":"phone","html":"<div data-page-art=\"alerts\" data-top=\"0.06\" style=\"--pa-h:300px\"><\/div>\n      <div class=\"m-body\" style=\"padding-top:28px\">\n        <div class=\"al-pre\">\n          <span class=\"io-ai lg\" data-appicon><\/span>\n          <div class=\"h2\" style=\"font-size:22px\">Know when a session needs you<\/div>\n          <div class=\"muted\" style=\"font-size:15px;line-height:1.5\">Recession Radar is running. If an order is rejected or a session freezes, a notice like this tells you what happened and what to do.<\/div>\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"hd\"><b>Recession Radar rebalanced<\/b><span>15:50<\/span><\/div><div class=\"tx c2\">Bought 6 TLT and sold 2 GLD in paper.<\/div><\/div><\/div>\n          <div class=\"sm dim\">You choose which kinds in Account › Notifications.<\/div>\n        <\/div>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:8px\">\n          <div class=\"m-btn\">Turn on notifications<\/div>\n          <div class=\"m-btn ghost\">Not now<\/div>\n        <\/div>\n      <\/div>\n    ","cap":"After starting the first session","ds":{}},{"kind":"phone","html":"\n      <div class=\"m-body\" style=\"padding-top:28px\">\n        <div class=\"al-pre\">\n          <span class=\"io-ai lg\" data-appicon><\/span>\n          <div class=\"h2\" style=\"font-size:22px\">Know when a session needs you<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"scrim\"><\/div>\n      <div class=\"io-alert\"><div class=\"ab\"><div class=\"at\">“LlamaTrade” Would Like to Send You Notifications<\/div>Notifications may include alerts, sounds and icon badges. These can be configured in Settings.<\/div><div class=\"bts\"><span>Don't Allow<\/span><span class=\"b\">Allow<\/span><\/div><\/div>\n    ","cap":"The iOS prompt follows","ds":{}},{"kind":"phone","html":"\n      <div class=\"m-nav\"><span class=\"back\"><span data-icon=\"chevron-left\"><\/span>Account<\/span><span>Notifications<\/span><span style=\"width:28px\"><\/span><\/div>\n      <div class=\"m-body\">\n        <div class=\"al-grid\">\n          <div class=\"r\"><span>In the app, always<\/span><span>Push<\/span><span>Email<\/span><\/div>\n          <div class=\"r\"><div><div>Session frozen<\/div><div class=\"d\">Breaks through quiet hours<\/div><\/div><span class=\"al-ck on\"><span data-icon=\"check\"><\/span><\/span><span class=\"al-ck on\"><span data-icon=\"check\"><\/span><\/span><\/div>\n          <div class=\"r\"><div><div>Order rejected<\/div><div class=\"d\">Breaks through quiet hours<\/div><\/div><span class=\"al-ck on\"><span data-icon=\"check\"><\/span><\/span><span class=\"al-ck on\"><span data-icon=\"check\"><\/span><\/span><\/div>\n          <div class=\"r\"><div><div>Orders filled<\/div><div class=\"d\">One notice per rebalance<\/div><\/div><span class=\"al-ck on\"><span data-icon=\"check\"><\/span><\/span><span class=\"al-ck\"><span data-icon=\"check\"><\/span><\/span><\/div>\n          <div class=\"r\"><div><div>Daily summary<\/div><div class=\"d\">After the close, about 16:05<\/div><\/div><span class=\"al-ck on\"><span data-icon=\"check\"><\/span><\/span><span class=\"al-ck\"><span data-icon=\"check\"><\/span><\/span><\/div>\n          <div class=\"r\"><div><div>Price alerts<\/div><div class=\"d\">2 set up<\/div><\/div><span class=\"al-ck on\"><span data-icon=\"check\"><\/span><\/span><span class=\"al-ck\"><span data-icon=\"check\"><\/span><\/span><\/div>\n        <\/div>\n        <div class=\"io-list\">\n          <div><span data-icon=\"moon\"><\/span><div class=\"grow\"><div>Quiet hours<\/div><div class=\"d\">20:00 to 8:00 and weekends<\/div><\/div><span class=\"v\">On<\/span><span data-icon=\"chevron-right\" class=\"chev\"><\/span><\/div>\n          <div><span data-icon=\"send\"><\/span><span class=\"grow\">Send a test notice<\/span><span data-icon=\"chevron-right\" class=\"chev\"><\/span><\/div>\n        <\/div>\n        <div class=\"io-foot\">Changes here also apply on the web.<\/div>\n      <\/div>\n      <nav data-tabs=\"account\" data-dot=\"activity\"><\/nav>\n    ","cap":"Account › Notifications","ds":{}}],"key":"B","sid":"alerts/settings","page":"area-alerts.html","anchor":"al-settings","title":"Notification settings and quiet hours","areaName":"Alerts"},{"id":"C","name":"Three levels instead of switches","note":"Instead of a switch per kind, you pick one of three levels: only problems, problems and the daily summary, or everything. Each level says in a sentence what you'd get on a day like today. It's the quickest to choose and easy to change in a hurry. Anyone who wants fills for live but not for paper has nowhere to say so, which matters once someone runs several sessions; a Customise link to the grid would be needed for them. It can be built on the existing preferences as named presets.","rec":false,"frames":[{"kind":"phone","html":"\n      <div class=\"m-nav\"><span class=\"back\"><span data-icon=\"chevron-left\"><\/span>Account<\/span><span>Notifications<\/span><span style=\"width:28px\"><\/span><\/div>\n      <div class=\"m-body\">\n        <div class=\"sm dim\">What should reach your phone?<\/div>\n        <div class=\"al-pick\"><span class=\"rd\"><\/span><div><div class=\"t\">Only problems<\/div><div class=\"d\">A freeze or a rejected order. Today that's 2 notices.<\/div><\/div><\/div>\n        <div class=\"al-pick on\"><span class=\"rd\"><\/span><div><div class=\"t\">P s drawn on a week","note":"Quiet hours get their own screen with the week drawn as a strip: market hours marked, quiet hours shaded, and three presets (overnight, weekends, outside market hours). What breaks through is listed under it in plain words. Held notices arrive together when quiet hours end. It's the clearest way to see that nothing is silenced during the session. It's a whole screen for one setting, and holding notices until morning needs a server-side queue, since iOS can't delay a push once it's sent.","rec":false,"frames":[{"kind":"phone","html":"\n      <div class=\"m-nav\"><span class=\"back\"><span data-icon=\"chevron-left\"><\/span>Notifications<\/span><span>Quiet hours<\/span><span style=\"width:28px\"><\/span><\/div>\n      <div class=\"m-body\">\n        <div class=\"io-list\"><div><span class=\"grow\">Quiet hours<\/span><span class=\"io-tg on\"><\/span><\/div><\/div>\n        <div class=\"seg round\" style=\"align-self:flex-start\"><span class=\"on\">Overnight<\/span><span>Weekends<\/span><span>Off-market<\/span><\/div>\n        <div class=\"m-card col\" style=\"gap:8px\">\n          <div class=\"al-week\">\n            <span><\/span><span style=\"grid-column:span 6\">0:00<\/span><span style=\"grid-column:span 6\">6:00<\/span><span style=\"grid-column:span 6\">12:00<\/span><span style=\"grid-column:span 6\">18:00<\/span>\n            <span>Mon<\/span><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i><\/i><i class=\"m\"><\/i><i class=\"m\"><\/i><i class=\"m\"><\/i><i class=\"m\"><\/i><i class=\"m\"><\/i><i class=\"m\"><\/i><i class=\"m\"><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i>\n            <span>Tue<\/span><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"><\/i><i class=\"q\"> nsparent)\"><\/i>Quiet, 20:00 to 8:00<\/span><\/div>\n        <\/div>\n        <div class=\"m-sec\">Still comes through<\/div>\n        <div class=\"io-list\">\n          <div><span data-icon=\"frozen\"><\/span><span class=\"grow\">A session freezes<\/span><span class=\"io-tg on\"><\/span><\/div>\n          <div><span data-icon=\"alert\"><\/span><span class=\"grow\">An order is rejected<\/span><span class=\"io-tg on\"><\/span><\/div>\n        <\/div>\n        <div class=\"io-foot\">Everything else waits and arrives together at 8:00.<\/div>\n      <\/div>\n    ","cap":"Notifications › Quiet hours","ds":{}},{"kind":"phone","html":"\n      <div class=\"io-lock\">\n        <div class=\"io-wall\"><\/div>\n        <div class=\"io-clock\"><div class=\"inl\"><span data-icon=\"moon\"><\/span>Quiet hours until 8:00<\/div><div class=\"tm\">22:10<\/div><\/div>\n        <div class=\"io-stack\">\n          <div class=\"io-nt\"><span data-appicon><\/span><div class=\"bd\"><div class=\"al-ts\"><span data-icon=\"clock\"><\/span>Time Sensitive<\/div><div class=\"hd\"><b>Momentum Sectors is frozen<\/b><span>22:04<\/span><\/div><div class=\"tx c2\">The evening check found 12 more SMH shares in Alpaca than in the ledger. Nothing trades until the open.<\/div><\/div><\/div>\n        <\/div>\n        <div class=\"io-lockfoot\"><span data-icon=\"bolt\"><\/span><span data-icon=\"eye\"><\/span><\/div>\n      <\/div>\n    ","cap":"22:10: only the freeze comes through","ds":{"statusbar":"lock","time":"22:10"}}],"key":"D","sid":"alerts/settings","page":"area-alerts.html","anchor":"al-settings","title":"Notification settings and quiet hours","areaName":"Alerts"},{"id":"E","name":"Leave quiet hours to iOS Focus","note":"The app has no quiet hours of its own. Instead it marks the freeze and the rejection as Time Sensitive and offers a Focus filter, so in Sleep or Work focus you can choose 'Only problems' in the Settings app. It reuses a schedule people already keep and costs no server work for timing. Most people never open Focus filters, it only works on the device where it's set (not on the web or email) and the filter needs an App Intents extension written in Swift, which Expo supports only through a native module.","rec":false,"frames":[{"kind":"phone","html":"\n      <div class=\"m-nav\"><span class=\"back\"><span data-icon=\"chevron-left\"><\/span>Account<\/span><span>Notifications<\/span><span style=\"width:28px\"><\/span><\/div>\n      <div class=\"m-body\">\n        <div class=\"io-sec\">Push<\/div>\n        <div class=\"io-list\">\n          <div><div class=\"grow\"><div>Problems<\/div><div class=\"d\">Freezes and rejected orders, Time Sensitive<\/div><\/div><span class=\"io-tg on\"><\/span><\/div>\n          <div><span class=\"grow\">Orders filled<\/span><span class=\"io-tg on\"><\/span><\/div>\n          <div><span class=\"grow\">Daily summary<\/span><span class=\"io-tg on\"><\/span><\/div>\n        <\/div>\n        <div class=\"callout\"><span data-icon=\"moon\"><\/span><div><b>Quiet hours follow your Focus.<\/b> In Settings › Focus, add the LlamaTrade filter to Sleep or Work to get only problems while that Focus is on.<\/div><\/div>\n        <div class=\"m-btn sec\">Open Focus settings<\/div>\n      <\/div>\n      <nav data-tabs=\"account\" data-dot=\"activity\"><\/nav>\n    ","cap":"Account › Notifications","ds":{}},{"kind":"phone","html":"\n      <div class=\"m-nav al-sys\" style=\"font-family:var(--ios)\"><span class=\"back\" style=\"color:var(--io-blue)\"><span data-icon=\"chevron-left\"><\/span>Sleep<\/span><span>App Filter<\/span><span style=\"width:28px;color:var(--io-blue)\">Add<\/span><\/div>\n      <div class=\"m-body al-sys al-sysbg\" style=\"padding-top:12px\">\n        <div class=\"io-list\" style=\"background:var(--panel)\">\n          <div><span data-appicon class=\"xs\" style=\"width:30px;height:30px;border-radius:8px\"><\/span><span class=\"grow\">LlamaTrade<\/span><\/div>\n        <\/div>\n        <div class=\"io-sec\">Show whi ection: column; justify-content: space-between; padding: 4px 0 4px 12px; border-left: 1.5px solid var(--fg); background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--fg-3) 10%, transparent) 6px 7px); }\n  .ed-curve .fut .ax { display: flex; justify-content: space-between; font: 400 10.5px var(--mono); color: var(--fg-3); }\n  .ed-curve .nm { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; height: 32px; line-height: 32px; border-top: 1px solid var(--line); }\n  .ed-curve .tr { position: relative; height: 32px; border-top: 1px solid var(--line); }\n  .ed-curve .tr.f { border-left: 1.5px solid var(--fg); }\n  .ed-curve .bar { position: absolute; left: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--acc-line); }\n  .ed-curve .bar.lv { background: var(--fg-3); }\n  .ed-curve .bar.dash { background: none; border-top: 1.5px dashed var(--line-2); height: 0; }\n  .ed-curve .tr i { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 2.5px var(--panel); }\n  .ed-curve .tr i.plan { background: var(--panel); border: 1.5px dashed var(--fg-3); box-shadow: none; }\n  .ed-curve .tr .stp { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; background: var(--fg-3); }\n  .ed-topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 24px 6px; }\n  .ed-ftabs { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); }\n  .ed-ftabs a { padding: 7px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--fg-2); }\n  .ed-ftabs a.on { background: var(--sunk); color: var(--fg); }\n  .ed-two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 26px; }\n  .ed-center { position: absolute; inset: 32px 0 0; display: flex; justify-content: center; background: var(--sunk); }\n  .ed-center > .col { width: 430px; height: 100%; gap: 0; background: var(--bg); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }\n  .ed-list { width: 330px; flex: none; padding: 16px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }\n  .ed-li { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; }\n  .ed-li.on { background: var(--acc-soft); }\n  .ed-li .nm { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .ed-li .d { font-size: 12.5px; color: var(--fg-3); }\n  .ed-li .end { text-align: right; }\n  .ed-stage { position: absolute; inset: 32px 0 0; background: var(--io-wall); padding: 30px 40px; display: flex; gap: 26px; align-items: stretch; }\n  .ed-win { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow-xl); border: 1px solid var(--line-2); }\n  .ed-win.other { flex: 1; }\n  .ed-win.narrow { width: 400px; flex: none; }\n  .ed-wbar { flex: none; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--fg-3); }\n  .ed-wbar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); }\n  .ed-wbar span { margin-left: 8px; }\n  .ed-notes { padding: 22px 26px; font-size: 15px; color: var(--fg-2); }\n  .ed-notes p { margin: 10px 0; }\n  .ed-ph { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }\n","links":[],"pre":[],"post":[],"tpl":""}}}</script>
<script src="kit.js"></script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("app-data").textContent);
  const AX = window.AX;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
  };
  const picks = () => store.get(AX.PK, {});
  const metas = () => store.get(AX.PKM, {});

  const FLOW = [];
  DATA.areas.forEach((a) => a.screens.forEach((sid) => FLOW.push(sid)));
  const AREA = Object.fromEntries(DATA.areas.map((a) => [a.key, a]));
  const browsing = {};
  let idx = 0;

  /* Runs inside each screen document: fits the devices to the window and forwards keys. */
  const FRAME_CSS = `
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--x-bg); }
    .ax-top, .ax-foot, .ax-dock, .ax-keys, .ax-zoom, .ax-toast { display: none !important; }
    .m-tabs > a { cursor: pointer; }
    .vw-stage { position: fixed; inset: 0; overflow: hidden; background: var(--x-bg); }
    .vw-stage > .art { height: 78%; }
    .vw-stage > .glow { height: 100%; }
    .vw-devs { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 56px; padding-bottom: 44px; }
    .vw-ph { position: relative; flex: none; }
    .vw-ph > .ax-dev { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .vw-ph > .cap { position: absolute; left: -20px; right: -20px; bottom: -28px; text-align: center; font: 400 12px var(--mono); color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  `;
  const BRIDGE = (id) => `(function () {
    var ID = ${id};
    function post(m) { m.id = ID; try { parent.postMessage(m, "*"); } catch (e) {} }
    function fit() {
      var ph = document.querySelectorAll(".vw-ph");
      if (!ph.length) return;
      var k = ph.length, gap = 56 * (k - 1), sumW = 0, maxH = 0;
      ph.forEach(function (p) { sumW += +p.dataset.w; maxH = Math.max(maxH, +p.dataset.h); });
      var cap = document.querySelector(".vw-ph > .cap") ? 40 : 0;
      var s = Math.min(1, (innerHeight - 96 - cap) / maxH, (innerWidth - 64 - gap) / sumW);
      document.querySelector(".vw-devs").style.gap = Math.max(20, Math.min(56, 56 * s * 1.2)) + "px";
      ph.forEach(function (p) {
        p.style.width = p.dataset.w * s + "px";
        p.style.height = p.dataset.h * s + "px";
        p.firstElementChild.style.transform = "scale(" + s + ")";
      });
    }
    fit();
    addEventListener("resize", fit);
    var MAP = { home: "checkin", sessions: "checkin", markets: "markets-mobile", activity: "alerts" };
    document.addEventListener("click", function (e) {
      var a = e.target && e.target.closest ? e.target.closest(".m-tabs > a") : null;
      if (!a) return;
      var k = a.textContent.trim().toLowerCase();
      if (MAP[k]) post({ vw: "nav", area: MAP[k] });
    }, true);
    var KEYS = /^(ArrowLeft|ArrowRight|[1-9]|[pPtTiIoOhH]|Escape)$/;
    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (!KEYS.test(e.key)) return;
      e.preventDefault();
      post({ vw: "key", key: e.key });
    });
    var last = 0;
    document.addEventListener("mousemove", function (e) {
      var now = Date.now();
      if (now - last < 150) return;
      last = now;
      post({ vw: "move", y: e.clientY / innerHeight });
    }, { passive: true });
    addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.vw === "mode" && window.AX) window.AX.setMode(d.mode, false);
    });
    addEventListener("load", function () {
      requestAnimationFrame(function () {
        if (window.AX) window.AX.render(document);
        requestAnimationFrame(function () { post({ vw: "ready" }); });
      });
    });
  })();`;

  /* ------------------------------------------------------------ model */
  function screenAt(i) { return DATA.screens[FLOW[i]]; }
  function optByKey(sc, key) { return sc.opts.find((o) => o.key === key); }
  function defaultKey(sc) {
    const p = picks();
    if (p[sc.sid] && optByKey(sc, p[sc.sid])) return p[sc.sid];
    const rec = sc.opts.find((o) => o.rec);
    return (rec || sc.opts[0]).key;
  }
  function activeKey(sc) {
    if (!browsing[sc.sid] || !optByKey(sc, browsing[sc.sid])) browsing[sc.sid] = defaultKey(sc);
    return browsing[sc.sid];
  }
  function isPicked(o) { return picks()[o.sid] === o.id; }

  /* ------------------------------------------------------------ screen documents */
  let seq = 0;
  function frameMarkup(o) {
    const seed = 2611 + FLOW.indexOf(screenAt(idx).sid) * 37;
    const devs = o.frames.map((f) => {
      const [w, h] = AX.NAT[f.kind] || AX.NAT.phone;
      const cap = f.cap ? `<div class="cap">${esc(f.cap)}</div>` : "";
      return `<div class="vw-ph" data-w="${w}" data-h="${h}">${AX.deviceHTML(f.kind, f.ds || {}, f.html)}${cap}</div>`;
    }).join("");
    return `<div class="vw-stage"><div class="art" data-art="candles" data-seed="${seed}"></div><div class="glow"></div><div class="vw-devs">${devs}</div></div>`;
  }
  function docFor(o, id) {
    const pg = DATA.pages[o.page];
    const mode = document.documentElement.dataset.mode || "dark";
    const scripts = (list) => list.map((s) => `<script>${s}<\/script>`).join("\n");
    return (
      `<!doctype html><html lang="en" data-mode="${mode}"><head><meta charset="utf-8">` +
      `<link rel="stylesheet" href="kit.css">` +
      pg.links.map((h) => `<link rel="stylesheet" href="${esc(h)}">`).join("") +
      `<style>${pg.css}</style><style>${FRAME_CSS}</style></head><body>` +
      frameMarkup(o) + pg.tpl +
      `<script>${BRIDGE(id)}<\/script>` +
      scripts(pg.pre) +
      `<script src="kit.js"><\/script>` +
      scripts(pg.post) +
      `</body></html>`
    );
  }

  const stage = $("#stage");
  let pendingId = 0;
  function mount() {
    const sc = screenAt(idx);
    const o = optByKey(sc, activeKey(sc));
    const id = ++seq;
    const f = document.createElement("iframe");
    f.dataset.id = String(id);
    f.title = `${sc.title}, option ${o.key}`;
    f.srcdoc = docFor(o, id);
    stage.appendChild(f);
    pendingId = id;
    setTimeout(() => reveal(id), 2500);
    renderBar();
  }
  function reveal(id) {
    const f = stage.querySelector(`iframe[data-id="${id}"]`);
    if (!f || f.classList.contains("on") || id !== pendingId) return;
    f.classList.add("on");
    setTimeout(() => {
      const ae = document.activeElement;
      const hadFocus = ae && ae.tagName === "IFRAME" && ae !== f;
      stage.querySelectorAll("iframe").forEach((x) => { if (x !== f) x.remove(); });
      if (hadFocus) { try { f.contentWindow.focus(); } catch (e) { window.focus(); } }
    }, 160);
  }
  function currentFrame() { return stage.querySelector(`iframe[data-id="${pendingId}"]`); }

  /* ------------------------------------------------------------ navigation */
  function writeHash() {
    const sc = screenAt(idx);
    try { history.replaceState(null, "", "#" + sc.sid + ":" + activeKey(sc)); } catch (e) { /* file url */ }
  }
  function go(i, key) {
    if (i < 0 || i >= FLOW.length) {
      AX.toast(i < 0 ? "This is the first flow" : "This is the last flow");
      return;
    }
    idx = i;
    const sc = screenAt(idx);
    if (key && optByKey(sc, key)) browsing[sc.sid] = key;
    closePops();
    writeHash();
    mount();
  }
  function goSid(sid, key) { const i = FLOW.indexOf(sid); if (i >= 0) go(i, key); }
  function goArea(k) { const a = AREA[k]; if (a && a.screens.length && screenAt(idx).area !== k) goSid(a.screens[0]); }
  function setOpt(key) {
    const sc = screenAt(idx);
    if (!optByKey(sc, key) || activeKey(sc) === key) return;
    browsing[sc.sid] = key;
    writeHash();
    mount();
  }
  function applyHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return false;
    const [sid, key] = h.split(":");
    const i = FLOW.indexOf(sid);
    if (i < 0) return false;
    go(i, key);
    return true;
  }

  /* ------------------------------------------------------------ picks (same scheme as kit.js, under axm-*) */
  function pick() {
    const sc = screenAt(idx);
    const o = optByKey(sc, activeKey(sc));
    const p = picks(), m = metas();
    if (p[o.sid] === o.id) {
      delete p[o.sid];
      delete m[o.sid];
      AX.toast(`Pick cleared for ${o.title}`);
    } else {
      p[o.sid] = o.id;
      m[o.sid] = { title: o.title, area: o.areaName || "", option: o.name || o.id, optionId: o.id, note: o.note || "", page: o.page, anchor: o.anchor, at: new Date().toISOString() };
      AX.toast(`Picked ${o.id}, ${o.name || ""}`);
    }
    store.set(AX.PK, p);
    store.set(AX.PKM, m);
    renderBar();
    if ($("#ov").classList.contains("on")) renderOverview();
  }

  /* ------------------------------------------------------------ control bar */
  const vb = $("#vb");
  vb.querySelector('[data-a="prev"]').innerHTML = AX.icon("chevron-left", 1.8);
  vb.querySelector('[data-a="next"]').innerHTML = AX.icon("chevron-right", 1.8);
  vb.querySelector('[data-a="info"]').innerHTML = AX.icon("info", 1.7);

  function renderBar() {
    const sc = screenAt(idx);
    const a = AREA[sc.area];
    const key = activeKey(sc);
    const o = optByKey(sc, key);
    const pos = a.screens.indexOf(sc.sid) + 1;
    $(".where .ar", vb).textContent = a.label;
    $(".where .sc", vb).textContent = sc.title;
    $(".where .ct", vb).textContent = `${pos}/${a.screens.length}`;
    vb.querySelector('[data-a="prev"]').disabled = idx === 0;
    vb.querySelector('[data-a="next"]').disabled = idx === FLOW.length - 1;
    const p = picks();
    $(".opts", vb).innerHTML = sc.opts.map((x, i) => {
      const cls = [x.key === key ? "on" : "", p[x.sid] === x.id ? "pk" : "", x.rec ? "rec" : ""].join(" ");
      const tip = `${x.id}. ${x.name}${x.rec ? " (recommended)" : ""}${p[x.sid] === x.id ? ", picked" : ""}${i < 9 ? ` (${i + 1})` : ""}`;
      return `<button type="button" class="${cls}" data-k="${esc(x.key)}" title="${esc(tip)}" aria-pressed="${x.key === key}">${esc(x.key)}</button>`;
    }).join("");
    const pb = vb.querySelector('[data-a="pick"]');
    const picked = isPicked(o);
    pb.classList.toggle("picked", picked);
    pb.innerHTML = picked ? `${AX.icon("check", 2)}Picked <kbd>P</kbd>` : `Pick ${esc(o.key)} <kbd>P</kbd>`;
    const mode = document.documentElement.dataset.mode;
    vb.querySelector('[data-a="theme"]').innerHTML = AX.icon(mode === "light" ? "sun" : "moon", 1.7);
    vb.querySelector('[data-a="theme"]').title = mode === "light" ? "Light. Switch to dark (T)" : "Dark. Switch to light (T)";
    $(".oname", vb).innerHTML = `${esc(o.name)}${o.rec ? " <i>Recommended</i>" : ""}`;
    document.title = `${sc.title} · ${a.label} · LlamaTrade mobile`;
    if ($("#info").classList.contains("on")) renderInfo();
    wake();
  }

  vb.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.k) { setOpt(b.dataset.k); return; }
    const a = b.dataset.a;
    if (a === "prev") go(idx - 1);
    else if (a === "next") go(idx + 1);
    else if (a === "pick") pick();
    else if (a === "theme") toggleTheme();
    else if (a === "info") toggleInfo();
    else if (a === "ov") toggleOverview();
  });

  function toggleTheme() {
    const m = document.documentElement.dataset.mode === "light" ? "dark" : "light";
    AX.setMode(m, true);
    const f = currentFrame();
    if (f && f.contentWindow) f.contentWindow.postMessage({ vw: "mode", mode: m }, "*");
    renderBar();
  }

  function renderInfo() {
    const sc = screenAt(idx);
    const o = optByKey(sc, activeKey(sc));
    const tags = [];
    if (o.rec) tags.push('<span class="tag acc">Recommended</span>');
    if (isPicked(o)) tags.push('<span class="tag acc">Picked</span>');
    const href = `${o.page}#${o.anchor}:${o.id}`;
    $("#info").innerHTML =
      `<h3>${esc(o.id)}. ${esc(o.name || "Option " + o.id)}</h3>` +
      (o.note ? `<p>${esc(o.note)}</p>` : "") +
      (sc.why ? `<p class="why">${esc(sc.why)}</p>` : "") +
      `<div class="meta">${tags.join("")}<a href="${esc(href)}">Open on the area page</a></div>`;
  }
  function toggleInfo(force) {
    const el = $("#info");
    const on = force != null ? force : !el.classList.contains("on");
    if (on) { $("#ov").classList.remove("on"); renderInfo(); }
    el.classList.toggle("on", on);
  }

  function renderOverview() {
    const p = picks();
    const total = FLOW.length, done = FLOW.filter((s) => p[s]).length;
    const cur = screenAt(idx).sid;
    const areas = DATA.areas.map((a) => {
      const d = a.screens.filter((s) => p[s]).length;
      const rows = a.screens.map((sid) => {
        const sc = DATA.screens[sid];
        const v = p[sid] || "";
        return `<button type="button" data-sid="${esc(sid)}" class="${sid === cur ? "cur" : ""} ${v ? "done" : ""}"><span class="t">${esc(sc.title)}</span><b>${v ? esc(v) : "·"}</b></button>`;
      }).join("");
      return `<div class="ar"><h4>${esc(a.label)}<i>${d} of ${a.screens.length}</i></h4>${rows}</div>`;
    }).join("");
    $("#ov .box").innerHTML =
      `<div class="hd"><b>All flows</b><span>${done} of ${total} decided</span><a href="index.html">Back to the overview page</a></div>` +
      `<div class="grid">${areas}</div>` +
      `<div class="keys"><span><kbd>←</kbd><kbd>→</kbd>flows</span><span><kbd>1</kbd>to<kbd>9</kbd> options</span><span><kbd>P</kbd>pick</span><span><kbd>T</kbd>light or dark</span><span><kbd>I</kbd>about the option</span><span><kbd>O</kbd>this list</span><span><kbd>H</kbd>hide the controls</span></div>`;
  }
  function toggleOverview(force) {
    const el = $("#ov");
    const on = force != null ? force : !el.classList.contains("on");
    if (on) { $("#info").classList.remove("on"); renderOverview(); }
    el.classList.toggle("on", on);
  }
  $("#ov").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-sid]");
    if (b) { toggleOverview(false); goSid(b.dataset.sid); return; }
    if (e.target === e.currentTarget) toggleOverview(false);
  });
  function closePops() {
    const any = $("#info").classList.contains("on") || $("#ov").classList.contains("on");
    toggleInfo(false);
    toggleOverview(false);
    return any;
  }

  let hidden = false, dimTimer = 0;
  function wake() {
    vb.classList.remove("dim");
    clearTimeout(dimTimer);
    dimTimer = setTimeout(() => { if (!$("#info").classList.contains("on")) vb.classList.add("dim"); }, 2600);
  }
  function toggleHide() {
    hidden = !hidden;
    vb.classList.toggle("gone", hidden);
    $("#info").classList.toggle("gone", hidden);
    if (!hidden) wake();
  }
  addEventListener("mousemove", (e) => { if (e.clientY > innerHeight - 140) wake(); }, { passive: true });

  function onKey(key) {
    if (key === "Escape") { closePops(); return; }
    if (key === "o" || key === "O") { toggleOverview(); return; }
    if (key === "h" || key === "H") { toggleHide(); return; }
    if ($("#ov").classList.contains("on")) return;
    const sc = screenAt(idx);
    if (/^[1-9]$/.test(key)) { const o = sc.opts[+key - 1]; if (o) setOpt(o.key); return; }
    switch (key) {
      case "ArrowRight": go(idx + 1); break;
      case "ArrowLeft": go(idx - 1); break;
      case "p": case "P": pick(); break;
      case "t": case "T": toggleTheme(); break;
      case "i": case "I": toggleInfo(); break;
      default: return;
    }
    if (!hidden) wake();
  }
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!/^(ArrowLeft|ArrowRight|[1-9]|[pPtTiIoOhH]|Escape)$/.test(e.key)) return;
    e.preventDefault();
    onKey(e.key);
  });

  addEventListener("message", (e) => {
    const d = e.data || {};
    if (!d.vw) return;
    const f = currentFrame();
    if (d.vw === "ready") { reveal(d.id); return; }
    if (!f || e.source !== f.contentWindow) return;
    if (d.vw === "key") onKey(d.key);
    else if (d.vw === "move") { if (d.y > 0.82) wake(); }
    else if (d.vw === "nav" && d.area) goArea(d.area);
  });

  addEventListener("hashchange", () => {
    const sc = screenAt(idx);
    if (decodeURIComponent(location.hash.slice(1)) !== sc.sid + ":" + activeKey(sc)) applyHash();
  });
  addEventListener("storage", (e) => {
    if (e.key === AX.PK) renderBar();
    if (e.key === "ax-mode") { AX.setMode(AX.mode(), false); renderBar(); }
  });

  if (!FLOW.length) {
    $(".where .sc", vb).textContent = "No area pages found. Run build-viewer.py next to the area pages.";
    return;
  }
  if (!applyHash()) go(0);
})();
</script>
</body>
</html>
