name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (git SHA or tag)'
        required: true

# One deploy per environment at a time; queued runs wait instead of interleaving
# migrations and rollouts.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: llamatrade-production
  GKE_ZONE: us-central1
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Resolve Kafka bootstrap address
        # The base ConfigMap ships a placeholder; fill it from the Managed Kafka
        # cluster before applying. Fails loudly if the terraform output is empty.
        run: |
          terraform -chdir=infrastructure/terraform init -input=false
          KAFKA_BOOTSTRAP="$(terraform -chdir=infrastructure/terraform output -raw kafka_bootstrap_address)"
          if [ -z "$KAFKA_BOOTSTRAP" ]; then
            echo "::error::terraform output kafka_bootstrap_address is empty"
            exit 1
          fi
          sed -i "s|KAFKA_BOOTSTRAP_ADDRESS_PLACEHOLDER|${KAFKA_BOOTSTRAP}|" infrastructure/k8s/base/configmap.yaml

      - name: Deploy to GKE
        run: |
          REGISTRY_PATH="${REGISTRY}/${PROJECT_ID}/llamatrade"
          VERSION="${{ github.event.inputs.version }}"
          NS=llamatrade

          # OPERATOR NOTE, one-time transition. The manifests no longer ship any
          # Secret object, so this apply neither creates nor overwrites secret
          # values; it only references them by name. Until now the committed
          # placeholders were part of the build and every deploy reset each
          # Secret to its CHANGE_ME value, so re-check that the live Secrets in
          # namespace llamatrade actually hold real values before deploying.
          # Production uses no namePrefix, so the names are unchanged.
          #
          # Either enable ../../base/external-secrets in the overlay or keep
          # creating these by hand: db-credentials/url, jwt-secret/secret,
          # encryption-key/key, alpaca-credentials/{api_key,api_secret},
          # stripe-credentials/{secret_key,webhook_secret},
          # smtp-credentials/{host,user,password},
          # timescale-credentials/{password,url},
          # agent-credentials/{google_api_key,anthropic_api_key}.
          #
          # auth-jwt-keys/{private_key,public_key} is new: auth signs user tokens
          # with RS256 and refuses to start without the pair in production, and
          # every other service needs the public half to verify them. Create it
          # first, otherwise the rollout below stalls in CreateContainerConfigError.
          #   openssl genrsa -out jwt.pem 2048
          #   openssl rsa -in jwt.pem -pubout -out jwt.pub
          #   kubectl create secret generic auth-jwt-keys -n llamatrade \
          #     --from-file=private_key=jwt.pem --from-file=public_key=jwt.pub
          # Existing user sessions do not survive the switch from HS256 to RS256;
          # clients re-login.
          kubectl apply -k infrastructure/k8s/overlays/production

          # Migrate the schema before rolling (a completed Job's spec is immutable).
          kubectl delete job db-migrate -n $NS --ignore-not-found
          sed "s|gcr.io/llamatrade/migrate:latest|${REGISTRY_PATH}/migrate:${VERSION}|" \
            infrastructure/k8s/base/migrate/job.yaml | kubectl apply -n $NS -f -
          kubectl wait --for=condition=complete job/db-migrate -n $NS --timeout=300s \
            || { kubectl logs job/db-migrate -n $NS; exit 1; }

          # Update all deployments
          for service in auth strategy backtest market-data trading portfolio notification billing agent; do
            kubectl set image deployment/${service} ${service}=${REGISTRY_PATH}/${service}:${VERSION} -n $NS
          done
          kubectl set image deployment/backtest-worker worker=${REGISTRY_PATH}/backtest:${VERSION} -n $NS
          kubectl set image deployment/backtest-beat beat=${REGISTRY_PATH}/backtest:${VERSION} -n $NS
          kubectl set image deployment/frontend frontend=${REGISTRY_PATH}/web:${VERSION} -n $NS

          # Wait for rollouts
          kubectl rollout status deployment/auth -n $NS --timeout=300s
          kubectl rollout status deployment/agent -n $NS --timeout=300s
          kubectl rollout status deployment/frontend -n $NS --timeout=300s

      - name: Notify deployment
        if: success()
        run: |
          echo "Deployed version ${{ github.event.inputs.version }} to production"
