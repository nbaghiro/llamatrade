name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: llamatrade-staging
  GKE_ZONE: us-central1
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Build and push images
        run: |
          REGISTRY_PATH="${REGISTRY}/${PROJECT_ID}/llamatrade"

          # Build from the repo root — the Dockerfiles COPY shared libs from
          # there, so a service-dir build context fails.
          for service in auth strategy backtest market-data trading portfolio notification billing agent; do
            docker build -f services/${service}/Dockerfile -t ${REGISTRY_PATH}/${service}:${{ github.sha }} .
            docker push ${REGISTRY_PATH}/${service}:${{ github.sha }}
          done

          # Migration runner image (Alembic upgrade head).
          docker build -f infrastructure/docker/Dockerfile.migrate -t ${REGISTRY_PATH}/migrate:${{ github.sha }} .
          docker push ${REGISTRY_PATH}/migrate:${{ github.sha }}

          # Build and push frontend
          docker build -f apps/web/Dockerfile -t ${REGISTRY_PATH}/web:${{ github.sha }} .
          docker push ${REGISTRY_PATH}/web:${{ github.sha }}

      - name: Apply manifests
        run: |
          # Namespace, config, secrets, deployments, services, HPAs, ingress.
          kubectl apply -k infrastructure/k8s/overlays/staging

      - name: Run database migrations
        run: |
          REGISTRY_PATH="${REGISTRY}/${PROJECT_ID}/llamatrade"
          NS=llamatrade-staging
          # A completed Job's spec is immutable — delete, then apply this build's
          # image, and block rollout until the schema is migrated. The staging
          # name prefix maps db-migrate/db-credentials -> staging-*.
          kubectl delete job staging-db-migrate -n $NS --ignore-not-found
          sed -e "s|gcr.io/llamatrade/migrate:latest|${REGISTRY_PATH}/migrate:${{ github.sha }}|" \
              -e "s|name: db-migrate|name: staging-db-migrate|" \
              -e "s|name: db-credentials|name: staging-db-credentials|" \
              infrastructure/k8s/base/migrate/job.yaml | kubectl apply -n $NS -f -
          kubectl wait --for=condition=complete job/staging-db-migrate -n $NS --timeout=300s \
            || { kubectl logs job/staging-db-migrate -n $NS; exit 1; }

      - name: Deploy to GKE
        run: |
          REGISTRY_PATH="${REGISTRY}/${PROJECT_ID}/llamatrade"
          NS=llamatrade-staging
          for service in auth strategy backtest market-data trading portfolio notification billing agent; do
            kubectl set image deployment/staging-${service} ${service}=${REGISTRY_PATH}/${service}:${{ github.sha }} -n $NS
          done
          # Backtest Celery worker + beat run the same image as the backtest API.
          kubectl set image deployment/staging-backtest-worker worker=${REGISTRY_PATH}/backtest:${{ github.sha }} -n $NS
          kubectl set image deployment/staging-backtest-beat beat=${REGISTRY_PATH}/backtest:${{ github.sha }} -n $NS
          kubectl set image deployment/staging-frontend frontend=${REGISTRY_PATH}/web:${{ github.sha }} -n $NS
          kubectl rollout status deployment/staging-auth -n $NS
          kubectl rollout status deployment/staging-agent -n $NS
          kubectl rollout status deployment/staging-frontend -n $NS
