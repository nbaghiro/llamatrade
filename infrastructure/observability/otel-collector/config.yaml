# OpenTelemetry Collector config for the LlamaTrade dev stack.
#
# Services export traces and logs via OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT
# is set (see docker-compose.dev.yml). The collector receives OTLP (http + grpc),
# batches, and exports traces to Tempo and logs to Loki, both queried through
# Grafana. Service stdout stays independent: it renders for a human reader while
# this pipeline carries the structured record.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Batch spans before export to reduce egress overhead.
  batch:
    timeout: 5s
    send_batch_size: 512
  # Guard against memory blowups under load.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # Secondary dev sink: log a one-line summary of every batch.
  debug:
    verbosity: normal

  # Persistent trace backend (grafana/tempo, see docker-compose.dev.yml).
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Log backend (grafana/loki). Loki 3.x ingests OTLP natively at /otlp/v1/logs;
  # record fields become structured metadata rather than stream labels.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # --- Google Cloud Trace (GCP) -------------------------------------------
  # Requires the contrib image (already used here) + GCP credentials mounted
  # via GOOGLE_APPLICATION_CREDENTIALS.
  # googlecloud:
  #   project: ${GCP_PROJECT_ID}
  #
  # GKE needs no logs exporter: the node agent already ships container stdout to
  # Cloud Logging, and LOG_FORMAT=json emits the fields it parses natively.

extensions:
  # Liveness endpoint for the container healthcheck / k8s probes.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  # The collector exposes its own metrics here; Prometheus scrapes otel-collector:8888.
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/tempo]
      # exporters: [debug, googlecloud]     # or Cloud Trace
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
