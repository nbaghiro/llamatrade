# Loki config for the LlamaTrade dev stack: single binary, filesystem storage.
#
# The collector forwards OTLP logs to /otlp/v1/logs. Record fields (tenant_id,
# client_order_id, event_id, ...) arrive as OTLP attributes and are stored as
# structured metadata, so they are queryable without becoming stream labels
# (which would explode cardinality).
auth_enabled: false

server:
  http_listen_port: 3100
  # Loki's own logs are noisy at info and would drown the stack's output.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion: resource/record attributes land here.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
  # A dev stack replaying a busy session bursts well past the defaults.
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
