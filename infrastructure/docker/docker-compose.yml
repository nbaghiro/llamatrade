name: llamatrade

services:
  # ===================
  # Database Migrations
  # ===================
  db-migrate:
    build:
      context: ../..
      dockerfile: libs/db/Dockerfile
    container_name: llamatrade-db-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ===================
  # Infrastructure
  # ===================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: llamatrade-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llamatrade
    volumes:
      - llamatrade_postgres_data:/var/lib/postgresql/data
    ports:
      # Host port remapped 5432->5442 to avoid clashing with a local (non-Docker)
      # Postgres on the default 5432. Container-internal port stays 5432.
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llamatrade-redis
    command: redis-server --appendonly yes
    volumes:
      - llamatrade_redis_data:/data
    ports:
      # Host port remapped 6379->6389 to avoid clashing with a local (non-Docker)
      # Redis on the default 6379. Container-internal port stays 6379.
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka-API broker for local dev (GCP uses Managed Service for Apache Kafka).
  # Single-binary Redpanda in KRaft mode, PLAINTEXT. Two listeners: the external
  # one advertises localhost:9092 for host processes (make dev-local, rpk,
  # KAFKA_BOOTSTRAP_SERVERS in .env.example); the internal one advertises
  # redpanda:29092 for in-network containers (KAFKA_BOOTSTRAP_SERVERS).
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: llamatrade-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    volumes:
      - llamatrade_redpanda_data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Backend Services
  # ===================
  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    container_name: llamatrade-auth
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8800}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # RS256 user-token pair (auth signs; the Connect services verify with the
      # public half). Empty falls back to HS256 over JWT_SECRET, so the stack
      # runs with no keys. Generate and export with `make gen-jwt-keys`; see
      # .docs/runbooks/jwt-key-provisioning.md.
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me}
      GRPC_PORT: "8810"
      # Per-service pool sizing. Each service holds its own pool, so the sum of
      # (DB_POOL_SIZE + DB_MAX_OVERFLOW) across services must stay under Postgres
      # max_connections (default 100). Current budget totals ~74. Watch the
      # llamatrade_db_connections_* metrics; if they climb, move to PgBouncer.
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8810:8810"

  strategy:
    build:
      context: ../..
      dockerfile: services/strategy/Dockerfile
    container_name: llamatrade-strategy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8820"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8820:8820"

  backtest:
    build:
      context: ../..
      dockerfile: services/backtest/Dockerfile
    container_name: llamatrade-backtest
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8830"
      MARKET_DATA_GRPC_TARGET: market-data:8840
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8830:8830"

  backtest-worker:
    build:
      context: ../..
      dockerfile: services/backtest/Dockerfile
    container_name: llamatrade-backtest-worker
    command: celery -A src.celery_app:celery_app worker --queues backtest --loglevel info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      MARKET_DATA_GRPC_TARGET: market-data:8840
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Embedded beat scheduler + maintenance-queue worker: runs the periodic
  # reaper (1A) that recovers orphaned RUNNING/PENDING runs. Single instance.
  backtest-beat:
    build:
      context: ../..
      dockerfile: services/backtest/Dockerfile
    container_name: llamatrade-backtest-beat
    command: celery -A src.celery_app:celery_app worker -B --queues backtest_maintenance --concurrency 1 --loglevel info
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      MARKET_DATA_GRPC_TARGET: market-data:8840
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Dedicated Timescale instance for the market-data store (separate from the
  # shared pgvector Postgres — different workload, retention, failure domain).
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: llamatrade-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_data
    volumes:
      - llamatrade_timescale_data:/var/lib/postgresql/data
    ports:
      # Remapped to avoid clashing with the shared Postgres (5442) and any local PG.
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create hypertables, continuous aggregates, retention/compression.
  market-data-migrate:
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile
    container_name: llamatrade-market-data-migrate
    command: python -m src.store.migrate
    environment:
      MARKET_DATA_DB_URL: postgresql+asyncpg://postgres:postgres@timescaledb:5432/market_data
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  # Serving (api) role — reads the store, falls back to Alpaca, fans out live bars.
  market-data:
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile
    container_name: llamatrade-market-data
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8840"
      # This stack runs the ingestor, so serve live bars off the internal bus.
      MARKET_DATA_BARS_FROM_BUS: "true"
      MARKET_DATA_DB_URL: postgresql+asyncpg://postgres:postgres@timescaledb:5432/market_data
      MARKET_DATA_DB_POOL_SIZE: "5"
      MARKET_DATA_DB_MAX_OVERFLOW: "5"
    depends_on:
      redis:
        condition: service_healthy
      market-data-migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    ports:
      - "8840:8840"

  # Ingest (writer) role — single Alpaca consumer; backfills + streams into the
  # store and republishes live bars on the internal bus. Same image, different
  # command; runs as a singleton (do not scale this replica).
  market-data-ingestor:
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile
    container_name: llamatrade-market-data-ingestor
    command: python -m src.ingest.main
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      MARKET_DATA_DB_URL: postgresql+asyncpg://postgres:postgres@timescaledb:5432/market_data
      MARKET_DATA_DB_POOL_SIZE: "5"
      MARKET_DATA_DB_MAX_OVERFLOW: "5"
      # IEX feed + a small universe by default; widen via .env for QA.
      MARKET_DATA_FEED: ${MARKET_DATA_FEED:-iex}
      MARKET_DATA_UNIVERSE: ${MARKET_DATA_UNIVERSE:-AAPL,MSFT,SPY}
      MARKET_DATA_MINUTE_LOOKBACK_DAYS: ${MARKET_DATA_MINUTE_LOOKBACK_DAYS:-5}
      MARKET_DATA_DAILY_LOOKBACK_DAYS: ${MARKET_DATA_DAILY_LOOKBACK_DAYS:-365}
    depends_on:
      market-data-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  trading:
    build:
      context: ../..
      dockerfile: services/trading/Dockerfile
    container_name: llamatrade-trading
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      # Must match auth's: auth encrypts broker credentials, live sessions decrypt them.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me}
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8850"
      # Busiest DB user (orders/positions/risk) — gets the largest slice.
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "8"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8850:8850"

  portfolio:
    build:
      context: ../..
      dockerfile: services/portfolio/Dockerfile
    container_name: llamatrade-portfolio
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      # Must match auth's: auth encrypts broker credentials, reconciliation decrypts them.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me}
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8860"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    ports:
      - "8860:8860"

  notification:
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    container_name: llamatrade-notification
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@llamatrade.com}
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8870"
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8870:8870"

  # Local mail catcher: SMTP on 1025, browse captured mail on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: llamatrade-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  billing:
    build:
      context: ../..
      dockerfile: services/billing/Dockerfile
    container_name: llamatrade-billing
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8880"
      # HTTP port for Stripe webhooks only (different from gRPC port)
      HTTP_PORT: "8881"
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "3"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8880:8880"
      - "8881:8881"  # Stripe webhooks require HTTP

  agent:
    build:
      # Repo-root context: the agent Dockerfile copies libs/* (common, db, proto, dsl)
      context: ../..
      dockerfile: services/agent/Dockerfile
    container_name: llamatrade-agent
    # LLM credentials (GOOGLE_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY) come
    # from the repo-root .env, which Compose does not auto-interpolate when run
    # from this directory. env_file injects them directly (do NOT restate the keys
    # in the environment block below — it wins over env_file and would blank them).
    # The environment block still wins for DATABASE_URL/REDIS_URL/targets.
    env_file:
      - ../../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llamatrade
      REDIS_URL: redis://redis:6379
      # Verifies RS256 user tokens; empty -> HS256 fallback (see auth).
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      GRPC_PORT: "8890"
      # Provider selection is config-driven and defaults to Google Gemini.
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-google}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-gemini-2.5-flash}
      AGENT_LLM_FAST_MODEL: ${AGENT_LLM_FAST_MODEL:-gemini-2.5-flash-lite}
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "4"
      # Downstream service targets (Connect/HTTP over the Docker network)
      STRATEGY_SERVICE_URL: http://strategy:8820
      STRATEGY_GRPC_TARGET: http://strategy:8820
      MARKET_DATA_GRPC_TARGET: http://market-data:8840
      BACKTEST_GRPC_TARGET: http://backtest:8830
      PORTFOLIO_GRPC_TARGET: http://portfolio:8860
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      # Host port remapped 8890->8990 to avoid a local (non-Docker) service on
      # 8890 (e.g. PocketSuite). Container-internal port stays 8890. The browser
      # reaches the agent via VITE_AGENT_URL (set to localhost:8990 in dev).
      - "8990:8890"

  # ===================
  # Single-origin reverse proxy (Caddy)
  # ===================
  # Publishes the ONE host origin (:8800) and proxies to the web app, which
  # serves both the marketing page ("/" for visitors) and the app — no
  # subdomains, no separate marketing upstream. The same Caddyfile serves prod on
  # one domain: override SITE_ADDRESS with the domain and point WEB_UPSTREAM at
  # the prod container. Here the default targets the prod web image (nginx on
  # :80); the dev override (docker-compose.dev.yml) repoints it at Vite :8802.
  proxy:
    image: caddy:2-alpine
    container_name: llamatrade-proxy
    depends_on:
      - web
    ports:
      - "8800:8800"
    environment:
      WEB_UPSTREAM: web:80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  # ===================
  # Frontend
  # ===================
  # Not published to the host — the proxy (:8800) is the single origin and
  # routes to it internally (nginx on :80 here; Vite :8802 in the dev override).
  web:
    build:
      # Repo-root context: the web Dockerfile copies the workspace lockfile,
      # apps/core and libs/proto for the @llamatrade/core proto build.
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: llamatrade-web
    depends_on:
      - auth

volumes:
  llamatrade_postgres_data:
  llamatrade_redis_data:
  llamatrade_timescale_data:
  llamatrade_redpanda_data:

networks:
  default:
    name: llamatrade-network
