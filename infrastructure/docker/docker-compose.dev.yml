# Development overrides with hot-reload
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ===================
  # Database Migrations (dev override to mount source)
  # ===================
  db-migrate:
    volumes:
      - ../../libs/db/llamatrade_db:/app/llamatrade_db:cached

  # ===================
  # Backend Services with hot-reload
  # Services run FastAPI for health checks + gRPC server started in lifespan
  # ===================
  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile.dev
    volumes:
      - ../../services/auth/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: uvicorn src.main:app --host 0.0.0.0 --port 8810 --reload --reload-dir /app/src

  strategy:
    build:
      context: ../..
      dockerfile: services/strategy/Dockerfile.dev
    volumes:
      - ../../services/strategy/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: uvicorn src.main:app --host 0.0.0.0 --port 8820 --reload --reload-dir /app/src

  backtest:
    build:
      context: ../..
      dockerfile: services/backtest/Dockerfile.dev
    volumes:
      - ../../services/backtest/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: uvicorn src.main:app --host 0.0.0.0 --port 8830 --reload --reload-dir /app/src

  backtest-worker:
    build:
      context: ../..
      dockerfile: services/backtest/Dockerfile.dev
    volumes:
      - ../../services/backtest/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: celery -A src.celery_app:celery_app worker --queues backtest --loglevel info

  # Embedded beat scheduler + maintenance-queue worker: runs the periodic
  # reaper (1A) that recovers orphaned RUNNING/PENDING runs.
  backtest-beat:
    build:
      context: ../..
      dockerfile: services/backtest/Dockerfile.dev
    volumes:
      - ../../services/backtest/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: celery -A src.celery_app:celery_app worker -B --queues backtest_maintenance --concurrency 1 --loglevel info

  market-data:
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile.dev
    volumes:
      - ../../services/market-data/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
      - ../../libs/alpaca/llamatrade_alpaca:/app/libs/alpaca/llamatrade_alpaca:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: uvicorn src.main:app --host 0.0.0.0 --port 8840 --reload --reload-dir /app/src

  market-data-migrate:
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile.dev
    volumes:
      - ../../services/market-data/src:/app/src:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
    command: python -m src.store.migrate

  market-data-ingestor:
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile.dev
    volumes:
      - ../../services/market-data/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
      - ../../libs/alpaca/llamatrade_alpaca:/app/libs/alpaca/llamatrade_alpaca:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8841:8841"
    command: python -m src.ingest.main

  trading:
    build:
      context: ../..
      dockerfile: services/trading/Dockerfile.dev
    volumes:
      - ../../services/trading/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: uvicorn src.main:app --host 0.0.0.0 --port 8850 --reload --reload-dir /app/src

  portfolio:
    build:
      context: ../..
      dockerfile: services/portfolio/Dockerfile.dev
    volumes:
      - ../../services/portfolio/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: uvicorn src.main:app --host 0.0.0.0 --port 8860 --reload --reload-dir /app/src

  notification:
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile.dev
    volumes:
      - ../../services/notification/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
      - ../../libs/dsl/llamatrade_dsl:/app/libs/dsl/llamatrade_dsl:cached
      - ../../libs/runtime/llamatrade_runtime:/app/libs/runtime/llamatrade_runtime:cached
      - ../../libs/events/llamatrade_events:/app/libs/events/llamatrade_events:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Email header-logo assets resolve to the local origin so they render in mailpit QA.
      EMAIL_ASSET_BASE_URL: http://localhost:8800
    command: uvicorn src.main:app --host 0.0.0.0 --port 8870 --reload --reload-dir /app/src

  # stripe-mock: a real-shaped Stripe API for local/e2e. Billing points its SDK
  # here (STRIPE_API_BASE) so checkout/subscribe run without real Stripe keys.
  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: llamatrade-stripe-mock
    ports:
      - "12111:12111"

  billing:
    build:
      context: ../..
      dockerfile: services/billing/Dockerfile.dev
    volumes:
      - ../../services/billing/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_API_BASE: http://stripe-mock:12111
    depends_on:
      stripe-mock:
        condition: service_started
    command: uvicorn src.main:app --host 0.0.0.0 --port 8880 --reload --reload-dir /app/src

  agent:
    build:
      context: ../..
      dockerfile: services/agent/Dockerfile.dev
    volumes:
      - ../../services/agent/src:/app/src:cached
      - ../../libs/common/llamatrade_common:/app/libs/common/llamatrade_common:cached
      - ../../libs/telemetry/llamatrade_telemetry:/app/libs/telemetry/llamatrade_telemetry:cached
      - ../../libs/db/llamatrade_db:/app/libs/db/llamatrade_db:cached
      - ../../libs/proto/llamatrade_proto:/app/libs/proto/llamatrade_proto:cached
      - ../../libs/dsl/llamatrade_dsl:/app/libs/dsl/llamatrade_dsl:cached
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: uvicorn src.main:app --host 0.0.0.0 --port 8890 --reload --reload-dir /app/src

  # ===================
  # Single-origin reverse proxy (Caddy) — dev upstreams
  # ===================
  # In dev the web app is the Vite dev server on :8802, so repoint WEB_UPSTREAM.
  proxy:
    environment:
      WEB_UPSTREAM: web:8802

  # ===================
  # Frontend with Vite HMR
  # ===================
  web:
    build:
      # Repo-root context (not apps/web) so the workspace-aware Dockerfile can
      # copy the root lockfile + the web manifest and install once.
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      # Mount app + @llamatrade/core source for hot-reload; anonymous node_modules volumes keep the image's workspace install.
      - ../../apps/web:/app/apps/web:cached
      - ../../apps/core:/app/apps/core:cached
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/core/node_modules
    # !override empties the base port list (Compose would otherwise concatenate); the web dev server is reached only via the proxy on :8802.
    ports: !override []
    environment:
      # Browser talks to the agent directly; its host port is remapped to 8990 (see docker-compose.yml).
      VITE_AGENT_URL: http://localhost:8990
    command: npm run dev -- --host 0.0.0.0 --port 8802

  # Observability stack (dev): scrapes /metrics and receives OTLP traces. See infrastructure/observability/README.md.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: llamatrade-prometheus
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - llamatrade_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: llamatrade-alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: llamatrade-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - tempo
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
      - "4317:4317" # OTLP gRPC
      - "13133:13133" # health

  # Trace backend: the collector exports OTLP to Tempo; Grafana queries :3200.
  tempo:
    image: grafana/tempo:2.7.1
    container_name: llamatrade-tempo
    # The image's default user (10001) cannot create /var/tempo on a fresh named
    # volume; root is acceptable for the dev stack.
    user: root
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - llamatrade_tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API (Grafana datasource / TraceQL)

  grafana:
    image: grafana/grafana:11.4.0
    container_name: llamatrade-grafana
    depends_on:
      - prometheus
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - llamatrade_grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"

volumes:
  llamatrade_prometheus_data:
  llamatrade_grafana_data:
  llamatrade_tempo_data:
