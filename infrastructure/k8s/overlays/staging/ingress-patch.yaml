# Staging overrides for the base frontend Ingress: host, static IP, and TLS cert.
# The base rule (frontend SPA; services are fronted directly) carries through unchanged.
- op: replace
  path: /spec/rules/0/host
  value: staging.llamatrade.com
- op: replace
  path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
  value: llamatrade-staging-ip
- op: replace
  path: /metadata/annotations/networking.gke.io~1managed-certificates
  value: staging-web-cert
