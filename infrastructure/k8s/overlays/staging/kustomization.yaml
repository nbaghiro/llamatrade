apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llamatrade-staging

resources:
  - ../../base
  - managed-cert.yaml

namePrefix: staging-

commonLabels:
  environment: staging
  app.kubernetes.io/part-of: llamatrade

patches:
  # Reduce replicas for staging
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "tier=backend"

  # Reduce resource limits for staging
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
    target:
      kind: Deployment
      labelSelector: "tier=backend"

  # Update image tags for staging
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/auth:staging
    target:
      kind: Deployment
      name: auth

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/strategy:staging
    target:
      kind: Deployment
      name: strategy

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/backtest:staging
    target:
      kind: Deployment
      name: backtest

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/market-data:staging
    target:
      kind: Deployment
      name: market-data

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/trading:staging
    target:
      kind: Deployment
      name: trading

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/portfolio:staging
    target:
      kind: Deployment
      name: portfolio

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/notification:staging
    target:
      kind: Deployment
      name: notification

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/billing:staging
    target:
      kind: Deployment
      name: billing

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/web:staging
    target:
      kind: Deployment
      name: frontend

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: gcr.io/llamatrade/agent:staging
    target:
      kind: Deployment
      name: agent

  # Staging config values on the shared ConfigMap.
  - patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: staging
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
    target:
      kind: ConfigMap
      name: llamatrade-config

  # Staging host + TLS cert on the frontend Ingress (base rules carry through).
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: frontend
