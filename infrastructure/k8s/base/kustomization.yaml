apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llamatrade

# Secret objects are deliberately absent: nothing in this build creates a
# Secret. The workloads reference them by name only, and the values come from
# base/external-secrets (Secret Manager sync) or, until that is enabled, from
# Secrets the operator creates by hand in the target namespace.
resources:
  # Namespace and shared config
  - namespace.yaml
  - configmap.yaml
  - network-policy.yaml

  # Infrastructure
  - redis/deployment.yaml
  - timescale/statefulset.yaml
  - observability/otel-collector.yaml

  # Backend services
  - auth/deployment.yaml
  - strategy/deployment.yaml
  - backtest/deployment.yaml
  - backtest/worker.yaml
  - market-data/deployment.yaml
  - market-data/ingestor.yaml
  - trading/deployment.yaml
  - portfolio/deployment.yaml
  - notification/deployment.yaml
  - billing/deployment.yaml
  - agent/deployment.yaml

  # Frontend
  - frontend/deployment.yaml

commonLabels:
  app.kubernetes.io/part-of: llamatrade
  app.kubernetes.io/managed-by: kustomize
