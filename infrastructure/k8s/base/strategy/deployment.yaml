apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy
  namespace: llamatrade
  labels:
    app: strategy
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: strategy
  template:
    metadata:
      labels:
        app: strategy
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8820"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: strategy
      containers:
        - name: strategy
          image: gcr.io/llamatrade/strategy:latest
          ports:
            - containerPort: 8820
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            # AuthMiddleware requires JWT_SECRET (it also signs the service
            # tokens this service sends to the ledger); AUTH_JWT_PUBLIC_KEY
            # verifies the RS256 user tokens auth issues.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: AUTH_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-keys
                  key: public_key
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: llamatrade-config
                  key: LOG_LEVEL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_SECURITY_PROTOCOL
          envFrom:
            - configMapRef:
                name: llamatrade-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8820
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8820
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: strategy
  namespace: llamatrade
spec:
  selector:
    app: strategy
  ports:
    - port: 8820
      targetPort: 8820
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: strategy-hpa
  namespace: llamatrade
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: strategy
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strategy
  namespace: llamatrade
  annotations:
    iam.gke.io/gcp-service-account: llamatrade-strategy@llamatrade.iam.gserviceaccount.com
