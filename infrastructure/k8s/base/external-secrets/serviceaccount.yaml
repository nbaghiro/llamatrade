# The identity External Secrets Operator impersonates when it reads Secret
# Manager. terraform (infrastructure/terraform/secrets.tf) grants this
# namespace/name pair roles/iam.workloadIdentityUser on the
# llamatrade-external-secrets GCP service account, and that account holds
# roles/secretmanager.secretAccessor.
#
# GCP_PROJECT_ID_PLACEHOLDER is per-cluster: staging and production deploy with
# their own GCP_PROJECT_ID, so substitute the project this cluster runs in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: llamatrade
  annotations:
    iam.gke.io/gcp-service-account: llamatrade-external-secrets@GCP_PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
