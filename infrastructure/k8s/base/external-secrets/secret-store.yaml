# GCP Secret Manager store for the platform namespace, authenticated by
# Workload Identity through the external-secrets ServiceAccount.
#
# Two values are per-cluster and ship as placeholders:
#   GCP_PROJECT_ID_PLACEHOLDER   the project holding the secrets; staging and
#                                production deploy with their own GCP_PROJECT_ID
#   GKE_CLUSTER_PLACEHOLDER      the cluster this store authenticates from,
#                                llamatrade-staging or llamatrade-production
#                                (google_container_cluster.main is named
#                                llamatrade-${var.environment})
#
# clusterLocation follows var.region, which both deploy workflows set to
# us-central1. Every remoteRef resolves the latest enabled secret version.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: llamatrade-gcpsm
  namespace: llamatrade
spec:
  provider:
    gcpsm:
      projectID: GCP_PROJECT_ID_PLACEHOLDER
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: GKE_CLUSTER_PLACEHOLDER
          clusterProjectID: GCP_PROJECT_ID_PLACEHOLDER
          serviceAccountRef:
            name: external-secrets
