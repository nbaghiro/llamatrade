# One ExternalSecret per Kubernetes Secret the workloads reference, generating
# exactly the names and keys their secretKeyRefs expect.
#
# Secret Manager naming follows the entries terraform already declares
# (infrastructure/terraform/secrets.tf): one Secret Manager secret per key,
# kebab-case, named <subsystem>-<key> — jwt-secret, encryption-key,
# alpaca-api-key, stripe-webhook-secret, database-url. Kubernetes Secret keys
# stay snake_case because the containers read them as-is.
#
# creationPolicy: Owner means the operator owns the generated Secret and removes
# it when the ExternalSecret is deleted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-credentials
  namespace: llamatrade
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: llamatrade-gcpsm
    kind: SecretStore
  target:
    name: agent-credentials
    creationPolicy: Owner
  data:
    - secretKey: google_api_key
      remoteRef:
        key: agent-google-api-key
    - secretKey: anthropic_api_key
      remoteRef:
        key: agent-anthropic-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alpaca-credentials
  namespace: llamatrade
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: llamatrade-gcpsm
    kind: SecretStore
  target:
    name: alpaca-credentials
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: alpaca-api-key
    - secretKey: api_secret
      remoteRef:
        key: alpaca-api-secret
---
# The RS256 user-token pair. Kept out of jwt-secret so a missing or unversioned
# PEM fails only the services that verify user tokens, instead of also taking
# down the shared HS256 secret every service needs to mint service tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-jwt-keys
  namespace: llamatrade
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: llamatrade-gcpsm
    kind: SecretStore
  target:
    name: auth-jwt-keys
    creationPolicy: Owner
  data:
    - secretKey: private_key
      remoteRef:
        key: auth-jwt-private-key
    - secretKey: public_key
      remoteRef:
        key: auth-jwt-public-key
---
