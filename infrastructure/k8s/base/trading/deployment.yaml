apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading
  namespace: llamatrade
  labels:
    app: trading
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading
  template:
    metadata:
      labels:
        app: trading
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8850"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: trading
      containers:
        - name: trading
          image: gcr.io/llamatrade/trading:latest
          ports:
            - containerPort: 8850
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alpaca-credentials
                  key: api_key
            - name: ALPACA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: alpaca-credentials
                  key: api_secret
            # AuthMiddleware requires JWT_SECRET (it also signs the service
            # tokens this service sends to the ledger and market-data);
            # AUTH_JWT_PUBLIC_KEY verifies the RS256 user tokens auth issues.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: AUTH_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-keys
                  key: public_key
            # Decrypts the stored per-tenant broker credentials.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-key
                  key: key
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: llamatrade-config
                  key: LOG_LEVEL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_SECURITY_PROTOCOL
            # No service calls the TradingService RPCs: the browser reaches them
            # with user tokens (which this allowlist does not gate), and no mesh
            # service holds a Connect client to trading. The list therefore names
            # a principal nothing mints, so every inbound service token is
            # rejected, closing the arbitrary-tenant vector on the order path.
            # Add a real svc name here only when an internal caller is introduced.
            - name: AUTH_ACCEPTED_SERVICES
              value: "__none__"
            # Pool override: order path is DB-active. Budget in configmap.yaml.
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
          envFrom:
            - configMapRef:
                name: llamatrade-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8850
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8850
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading
  namespace: llamatrade
  annotations:
    iam.gke.io/gcp-service-account: llamatrade-trading@llamatrade.iam.gserviceaccount.com
---
apiVersion: v1
kind: Service
metadata:
  name: trading
  namespace: llamatrade
spec:
  selector:
    app: trading
  ports:
    - port: 8850
      targetPort: 8850
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trading-hpa
  namespace: llamatrade
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trading
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
