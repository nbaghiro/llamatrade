apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
  namespace: llamatrade
  labels:
    app: backtest-worker
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backtest-worker
  template:
    metadata:
      labels:
        app: backtest-worker
        tier: backend
    spec:
      serviceAccountName: backtest
      # Celery warm-shutdown budget: SIGTERM stops fetching and the pod exits as
      # soon as the in-flight run finishes, bounded by the hard task time limit.
      terminationGracePeriodSeconds: 3660
      containers:
        - name: worker
          image: gcr.io/llamatrade/backtest:latest
          command:
            - celery
            - -A
            - src.celery_app:celery_app
            - worker
            - --queues
            - backtest
            # Pinned to the 2-CPU limit below: a backtest is CPU-bound, so
            # oversubscribing the pod only thrashes and inflates run time.
            - --concurrency
            - "2"
            - --loglevel
            - info
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            # Runs backtests through the market-data client, which signs an
            # internal service token per call. No verify key: the worker serves
            # no inbound requests, so it never validates a user token.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_SECURITY_PROTOCOL
          envFrom:
            - configMapRef:
                name: llamatrade-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
# Single replica: the -B flag embeds beat, and beat must never run twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-beat
  namespace: llamatrade
  labels:
    app: backtest-beat
    tier: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backtest-beat
  template:
    metadata:
      labels:
        app: backtest-beat
        tier: backend
    spec:
      serviceAccountName: backtest
      containers:
        - name: beat
          image: gcr.io/llamatrade/backtest:latest
          command:
            - celery
            - -A
            - src.celery_app:celery_app
            - worker
            - -B
            - --queues
            - backtest_maintenance
            - --concurrency
            - "1"
            - --loglevel
            - info
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_SECURITY_PROTOCOL
          envFrom:
            - configMapRef:
                name: llamatrade-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
