apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest
  namespace: llamatrade
  labels:
    app: backtest
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backtest
  template:
    metadata:
      labels:
        app: backtest
        tier: backend
    spec:
      serviceAccountName: backtest
      containers:
        - name: backtest
          image: gcr.io/llamatrade/backtest:latest
          ports:
            - containerPort: 8830
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            # AuthMiddleware requires JWT_SECRET (it also signs the service
            # tokens this service sends to market-data); AUTH_JWT_PUBLIC_KEY
            # verifies the RS256 user tokens auth issues.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: AUTH_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-keys
                  key: public_key
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: llamatrade-config
                  key: LOG_LEVEL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_SECURITY_PROTOCOL
            # API enqueues Celery jobs and reads status only (the worker does the
            # DB-heavy run), but scales to 20 replicas, so its pool is small.
            # Budget in configmap.yaml.
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_MAX_OVERFLOW
              value: "2"
          envFrom:
            - configMapRef:
                name: llamatrade-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8830
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8830
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backtest
  namespace: llamatrade
  annotations:
    iam.gke.io/gcp-service-account: llamatrade-backtest@llamatrade.iam.gserviceaccount.com
---
apiVersion: v1
kind: Service
metadata:
  name: backtest
  namespace: llamatrade
spec:
  selector:
    app: backtest
  ports:
    - port: 8830
      targetPort: 8830
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backtest-hpa
  namespace: llamatrade
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backtest
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
