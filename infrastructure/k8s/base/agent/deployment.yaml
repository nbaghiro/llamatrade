apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: llamatrade
  labels:
    app: agent
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8890"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent
      containers:
        - name: agent
          image: gcr.io/llamatrade/agent:latest
          ports:
            - containerPort: 8890
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            # AuthMiddleware requires JWT_SECRET (it also signs the service
            # tokens the copilot tools send to strategy and the other services);
            # AUTH_JWT_PUBLIC_KEY verifies the RS256 user tokens auth issues.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: AUTH_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-keys
                  key: public_key
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: llamatrade-config
                  key: LOG_LEVEL
            - name: AGENT_LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: llamatrade-config
                  key: AGENT_LLM_PROVIDER
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: google_api_key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: anthropic_api_key
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_SECURITY_PROTOCOL
          envFrom:
            - configMapRef:
                name: llamatrade-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8890
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8890
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: llamatrade
spec:
  selector:
    app: agent
  ports:
    - port: 8890
      targetPort: 8890
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-hpa
  namespace: llamatrade
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: llamatrade
  annotations:
    iam.gke.io/gcp-service-account: llamatrade-agent@llamatrade.iam.gserviceaccount.com
