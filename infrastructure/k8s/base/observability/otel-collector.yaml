# In-cluster OpenTelemetry Collector — the OTLP export target the services point
# at via OTEL_EXPORTER_OTLP_ENDPOINT. Receives OTLP, batches, logs (debug), and
# forwards traces via otlphttp to the gateway named by OTEL_GATEWAY_OTLP_ENDPOINT.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: llamatrade
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: normal
      # Forwards to the trace backend gateway; endpoint comes from the
      # OTEL_GATEWAY_OTLP_ENDPOINT env on the Deployment below.
      otlphttp:
        endpoint: ${env:OTEL_GATEWAY_OTLP_ENDPOINT}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlphttp]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: llamatrade
  labels:
    app: otel-collector
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        tier: observability
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args:
            - --config=/etc/otel/config.yaml
          env:
            # Where the otlphttp exporter forwards traces. Point this at the
            # environment's collector gateway / trace backend (Tempo, Cloud
            # Trace gateway, ...); the default targets an in-cluster gateway
            # Service named otel-gateway in the observability namespace.
            - name: OTEL_GATEWAY_OTLP_ENDPOINT
              value: "http://otel-gateway.observability.svc.cluster.local:4318"
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: llamatrade
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  type: ClusterIP
