# Kubernetes PrometheusRule mirroring infrastructure/observability/prometheus/alerts.yml.
# Requires the Prometheus Operator (monitoring.coreos.com CRDs). NOT included in
# the default kustomization — apply explicitly where the operator is installed:
#   kubectl apply -f infrastructure/k8s/base/observability/prometheusrule.yaml
# Keep the rule expressions in sync with the dev alerts.yml (same SLOs,
# .docs/telemetry.md §2, plus the two integrity rules that are not SLOs).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llamatrade-slo
  labels:
    app.kubernetes.io/part-of: llamatrade
    role: alert-rules
spec:
  groups:
    - name: slo_availability
      rules:
        - alert: ServiceAvailabilityFastBurn
          expr: |
            (
              sum by (job) (rate(llamatrade_http_requests_total{status_class="5xx"}[5m]))
                /
              sum by (job) (rate(llamatrade_http_requests_total[5m]))
            ) > (14.4 * 0.001)
            and
            (
              sum by (job) (rate(llamatrade_http_requests_total{status_class="5xx"}[1h]))
                /
              sum by (job) (rate(llamatrade_http_requests_total[1h]))
            ) > (14.4 * 0.001)
          for: 2m
          labels:
            severity: page
            slo: availability
          annotations:
            summary: "High 5xx burn rate on {{ $labels.job }} (fast)"
            description: "{{ $labels.job }} burning the 99.9% availability budget 14.4x too fast."
        - alert: ServiceAvailabilitySlowBurn
          expr: |
            (
              sum by (job) (rate(llamatrade_http_requests_total{status_class="5xx"}[30m]))
                /
              sum by (job) (rate(llamatrade_http_requests_total[30m]))
            ) > (6 * 0.001)
            and
            (
              sum by (job) (rate(llamatrade_http_requests_total{status_class="5xx"}[6h]))
                /
              sum by (job) (rate(llamatrade_http_requests_total[6h]))
            ) > (6 * 0.001)
          for: 15m
          labels:
            severity: ticket
            slo: availability
          annotations:
            summary: "Elevated 5xx burn rate on {{ $labels.job }} (slow)"
            description: "{{ $labels.job }} burning the 99.9% availability budget 6x too fast."
    - name: slo_trading_latency
      rules:
        - alert: OrderSubmissionLatencyHigh
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (rate(llamatrade_trading_order_submission_latency_seconds_bucket[5m]))
            ) > 1
          for: 5m
          labels:
            severity: page
            slo: order_submission_latency
          annotations:
            summary: "Order submission p99 latency above 1s"
            description: "p99 order-submission latency (signal → Alpaca) breaches the < 1s SLO."
    - name: slo_marketdata_freshness
      rules:
        - alert: MarketDataBarFanoutLagHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(llamatrade_marketdata_bar_fanout_lag_seconds_bucket[10m]))
            ) > 120
          for: 10m
          labels:
            severity: page
            slo: marketdata_freshness
          annotations:
            summary: "Bar fan-out lag p95 above 120s (bus mode)"
            description: "p95 end-to-end bar lag breaches 120s (~60s aggregation window + ~60s pipeline budget) — live signals act on stale bars."
        - alert: MarketDataStreamLagHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(llamatrade_marketdata_stream_message_lag_seconds_bucket[5m]))
            ) > 2
          for: 5m
          labels:
            severity: page
            slo: marketdata_freshness
          annotations:
            summary: "Market-data stream lag p95 above 2s (legacy direct stream)"
            description: "p95 direct Alpaca stream lag breaches the < 2s freshness target on the legacy (non-bus) path."
    - name: slo_ledger_integrity
      rules:
        - alert: LedgerReconciliationDrift
          expr: sum by (kind) (increase(llamatrade_ledger_reconciliation_drift_total[10m])) > 0
          for: 1m
          labels:
            severity: page
            slo: ledger_reconciliation
          annotations:
            summary: "Ledger reconciliation drift detected ({{ $labels.kind }})"
            description: "Ledger drift of kind {{ $labels.kind }} — the ledger is the book of record."
        - alert: LedgerVsBrokerMismatch
          expr: abs(llamatrade_ledger_vs_broker_mismatch_dollars) > 1
          for: 5m
          labels:
            severity: page
            slo: ledger_reconciliation
          annotations:
            summary: "Ledger vs broker dollar mismatch"
            description: "Ledger-vs-broker mismatch is ${{ $value }} (should be ~0)."
    - name: slo_eventbus_lag
      rules:
        - alert: EventBusConsumerLagEntriesHigh
          expr: llamatrade_events_consumer_lag > 1000
          for: 10m
          labels:
            severity: ticket
            slo: eventbus_lag
          annotations:
            summary: "EventBus backlog on {{ $labels.stream }}/{{ $labels.group }}"
            description: "{{ $value }} unacked entries pending for 10m — consumer not keeping up (fill → ledger projection may be stalled)."
    - name: slo_db_pool
      rules:
        - alert: DBPoolExhausted
          expr: sum by (job) (increase(llamatrade_db_pool_exhausted_total[5m])) > 0
          for: 2m
          labels:
            severity: page
            slo: db_pool
          annotations:
            summary: "DB pool exhausted on {{ $labels.job }}"
            description: "{{ $labels.job }} hit DB pool exhaustion — check for leaks or scale the pool."
        - alert: DBPoolNearExhaustion
          expr: |
            (
              max by (job) (llamatrade_db_connections{state="active"})
                /
              max by (job) (llamatrade_db_connections{state="max"})
            ) > 0.9
          for: 5m
          labels:
            severity: ticket
            slo: db_pool
          annotations:
            summary: "DB pool > 90% utilized on {{ $labels.job }}"
            description: "{{ $labels.job }} DB pool > 90% utilized for 5m — approaching exhaustion."
    - name: rls_bypass
      rules:
        - alert: RLSBypassRateSpike
          expr: |
            (
              sum by (job, operation) (rate(llamatrade_db_rls_bypass_total[5m]))
                >
              3 * sum by (job, operation) (rate(llamatrade_db_rls_bypass_total[1h] offset 1h))
            )
            and
            sum by (job, operation) (rate(llamatrade_db_rls_bypass_total[5m])) > 0.2
          for: 15m
          labels:
            severity: ticket
            area: tenant_isolation
          annotations:
            summary: "RLS bypass rate spike on {{ $labels.job }} ({{ $labels.operation }})"
            description: "RLS system bypass running >3x its preceding-hour baseline — check the rls_bypass audit lines for the caller."
    - name: eventbus_credentials
      rules:
        - alert: EventBusBrokenCredentials
          expr: |
            sum by (job, stream, mode) (
              increase(llamatrade_events_broken_credentials_total[10m])
            ) > 0
          for: 1m
          labels:
            severity: page
            area: event_backbone
          annotations:
            summary: "Event-backbone credentials broken on {{ $labels.stream }} ({{ $labels.mode }})"
            description: "A reader has failed to start enough consecutive times to rule out a transient fault — check Workload Identity and the Managed Kafka IAM grant."
    - name: eventbus_durability
      rules:
        - alert: EventBusPublishFailures
          expr: sum by (stream) (rate(llamatrade_events_publish_failures_total[5m])) > 0
          for: 10m
          labels:
            severity: ticket
            area: event_backbone
          annotations:
            summary: "Event publish failures on {{ $labels.stream }}"
            description: "Publishes failing at {{ $value }}/s for 10m — fire-and-forget producers drop these events; check the publish-failure log lines and broker health."
        - alert: EventBusDLQBacklog
          expr: llamatrade_events_dlq_depth > 0
          for: 15m
          labels:
            severity: ticket
            area: event_backbone
          annotations:
            summary: "Dead-lettered events parked on {{ $labels.stream }}"
            description: "{{ $value }} event(s) parked for 15m (poison or retries exhausted) — fix the root cause then replay rather than purge."
    - name: ledger_cash_integrity
      rules:
        - alert: LedgerCashVsBrokerMismatch
          expr: abs(llamatrade_ledger_vs_broker_cash_mismatch_dollars) > 1
          for: 5m
          labels:
            severity: page
            slo: ledger_reconciliation
          annotations:
            summary: "Ledger vs broker cash mismatch"
            description: "Ledger sleeve cash vs broker cash differs by ${{ $value }} (should be ~0); strategies size against it."
        - alert: LedgerSleeveFrozen
          expr: sum(increase(llamatrade_ledger_sleeves_frozen_total[10m])) > 0
          for: 1m
          labels:
            severity: page
            slo: ledger_reconciliation
          annotations:
            summary: "Ledger froze a sleeve on irreconcilable drift"
            description: "{{ $value }} sleeve freeze(s) in 10m — sizing is halted on the affected account; see the ledger freeze log lines."
    - name: ledger_durability
      rules:
        - alert: LedgerPublishFailures
          expr: sum(increase(llamatrade_trading_ledger_events_published_total{status="failure"}[10m])) > 0
          for: 5m
          labels:
            severity: page
            area: ledger_durability
          annotations:
            summary: "Trading is failing to publish ledger events"
            description: "{{ $value }} publish failure(s) in 10m for 5m — terminal fills/releases may not be booked; the book diverges until the drain catches up."
        - alert: LedgerFillDLQBacklog
          expr: llamatrade_ledger_fill_dlq_depth > 0
          for: 15m
          labels:
            severity: ticket
            area: ledger_durability
          annotations:
            summary: "Un-booked fills parked on the ledger DLQ"
            description: "{{ $value }} fill(s) on ledger:fills:dlq for 15m — fix the root cause then replay by cursor (dlq_replay) rather than purge."
    - name: auth_guards
      rules:
        - alert: AuthRateLimitBackendErrors
          expr: sum by (job) (increase(llamatrade_auth_ratelimit_backend_errors_total[10m])) > 0
          for: 10m
          labels:
            severity: ticket
            area: auth_guards
          annotations:
            summary: "Auth rate-limit backend errors on {{ $labels.job }}"
            description: "Redis-backed rate limiter erroring for 10m — brute-force protection degraded and fail-closed login rejects; check Redis."
        - alert: AuthRevocationBackendErrors
          expr: sum by (job) (increase(llamatrade_auth_revocation_backend_errors_total[10m])) > 0
          for: 10m
          labels:
            severity: ticket
            area: auth_guards
          annotations:
            summary: "Auth revocation backend errors on {{ $labels.job }}"
            description: "Redis-backed revocation check erroring for 10m — a revoked token may keep working until it expires; check Redis."
