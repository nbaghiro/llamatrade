apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: llamatrade
  labels:
    app: portfolio
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
        tier: backend
    spec:
      serviceAccountName: portfolio
      containers:
        - name: portfolio
          image: gcr.io/llamatrade/portfolio:latest
          ports:
            - containerPort: 8860
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            # AuthMiddleware requires JWT_SECRET (it also signs the service
            # tokens this service sends to market-data); AUTH_JWT_PUBLIC_KEY
            # verifies the RS256 user tokens auth issues.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: AUTH_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-keys
                  key: public_key
            # Decrypts the stored per-tenant broker credentials.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-key
                  key: key
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: llamatrade-config
                  key: LOG_LEVEL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_SECURITY_PROTOCOL
            # Only these service principals may present a service token to the
            # ledger/portfolio RPCs (resolve_identity allowlist): strategy, trading
            # and agent call LedgerService/PortfolioService; a token from any other
            # svc is rejected. User tokens are unaffected.
            - name: AUTH_ACCEPTED_SERVICES
              value: "strategy,trading,agent"
            # Pool override: ledger folds are DB-heavy. Budget in configmap.yaml.
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
          envFrom:
            - configMapRef:
                name: llamatrade-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8860
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8860
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio
  namespace: llamatrade
  annotations:
    iam.gke.io/gcp-service-account: llamatrade-portfolio@llamatrade.iam.gserviceaccount.com
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: llamatrade
spec:
  selector:
    app: portfolio
  ports:
    - port: 8860
      targetPort: 8860
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-hpa
  namespace: llamatrade
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
