# Docker Compose for Integration Tests
# Usage: docker compose -f docker-compose.test.yml up -d

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llamatrade_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru

  # Kafka-API broker for integration tests. Single-binary Redpanda (KRaft),
  # PLAINTEXT. One external listener advertising localhost:9093 (host-remapped
  # from 9092 to avoid clashing with the dev-compose Redpanda on 9092).
  redpanda-test:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr=external://0.0.0.0:9092
      - --advertise-kafka-addr=external://localhost:9093
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
    ports:
      - "9093:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"  # HTTP
      - "12112:12112"  # HTTPS
