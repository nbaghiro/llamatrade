[project]
name = "llamatrade-agent"
version = "0.1.0"
description = "LlamaTrade AI Strategy Agent (Copilot) Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "anthropic>=0.31.0",
    "google-genai>=1.0.0",
    "llamatrade-common",
    "llamatrade-events",
    "llamatrade-db",
    "llamatrade-dsl",
    "llamatrade-proto",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "connect-python>=0.8.1",
    "starlette>=0.37.0",
    "llamatrade-telemetry",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]
integration = ["testcontainers[postgres]>=4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires Docker (real Postgres via testcontainers)",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.14"
