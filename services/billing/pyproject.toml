[project]
name = "llamatrade-billing"
version = "0.1.0"
description = "LlamaTrade Billing Service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "stripe>=15.0.0,<16",
    "llamatrade-common",
    "llamatrade-events",
    "llamatrade-db",
    "llamatrade-proto",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "pyjwt>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
# Ratchet floor (D3): measured 92.56% on 2026-08-03; raise as suites grow.
fail_under = 92
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.14"
