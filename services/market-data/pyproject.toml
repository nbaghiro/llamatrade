[project]
name = "llamatrade-market-data"
version = "0.1.0"
description = "LlamaTrade Market Data Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "grpcio>=1.60.0",
    "llamatrade-common",
    "llamatrade-db",
    "llamatrade-events",
    "llamatrade-proto",
    "llamatrade-telemetry",
    "llamatrade-alpaca",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
integration = [
    "testcontainers[postgres,redis,kafka]>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires Docker (real TimescaleDB/Kafka/Redis via testcontainers)",
]

# Coverage is NOT in addopts on purpose (same policy as portfolio): full coverage
# needs the Docker-backed integration tier, so a unit-only run sits below the
# gate. CI enforces the floor by running the FULL suite with coverage.
[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
# Ratchet floor (D3): measured 88.15% on 2026-08-02 (full suite incl. integration).
fail_under = 88
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.14"
