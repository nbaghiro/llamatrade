[project]
name = "llamatrade-common"
version = "0.1.0"
description = "Shared utilities and models for LlamaTrade services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic[email]>=2.5.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "fastapi>=0.109.0",
    "redis>=5.0.0",
    "connect-python>=0.8.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "llamatrade-telemetry",
]

[project.optional-dependencies]
# Needed only by services running CREDENTIAL_CIPHER=gcp-kms; imported lazily.
gcp-kms = [
    "google-cloud-kms>=2.21.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]
integration = [
    "testcontainers[postgres,redis]>=4.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llamatrade_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=llamatrade_common --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: requires Docker (testcontainers) or other external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*:",
]

[tool.coverage.run]
source = ["llamatrade_common"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.14"
