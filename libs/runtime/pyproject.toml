[project]
name = "llamatrade-runtime"
version = "0.1.0"
description = "LlamaTrade Strategy Runtime — the shared execution core for backtest and live trading"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llamatrade-dsl",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
# ta-lib wheel needs the native TA-Lib C library; the golden tests importorskip it.
golden = [
    "ta-lib>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llamatrade_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=llamatrade_runtime --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["llamatrade_runtime"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.14"
