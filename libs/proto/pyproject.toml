[project]
name = "llamatrade-proto"
version = "0.1.0"
description = "Protocol Buffers definitions and generated code for LlamaTrade"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "connect-python>=0.8.1",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "llamatrade-telemetry",
]

[project.optional-dependencies]
# llamatrade-common is a soft runtime dependency: the S2S clients lazy-import
# mint_service_token, so it is only required where those calls actually run.
dev = [
    "grpcio-testing>=1.60.0",
    "llamatrade-common",
    "mypy-protobuf>=3.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llamatrade_proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=llamatrade_proto --cov-report=term-missing --cov-fail-under=86"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.14"

[tool.coverage.run]
omit = ["llamatrade_proto/generated/*", "tests/*"]

[tool.coverage.report]
# Ratchet floor (D3): measured 86.47% on 2026-08-02; ratchet up as suites grow.
fail_under = 86
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
