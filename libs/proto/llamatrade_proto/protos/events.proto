syntax = "proto3";

package llamatrade;

option java_multiple_files = true;
option java_package = "com.llamatrade.api";

// The canonical envelope for every event on the bus. The transport carries the
// serialized EventEnvelope as opaque bytes (Redis Streams field / Kafka value),
// so this is the single source of truth for event data — shared by the bus and
// the gRPC streaming edge.
//
// `payload` is the serialized domain message; `type` is the discriminator the
// codec uses to parse it (no google.protobuf.Any — a plain bytes+discriminator
// pair is simpler and the most transport-portable shape).
message EventEnvelope {
  // UUID — correlation id and idempotency seed.
  string id = 1;
  // Semantic discriminator: tells the consumer which message `payload` is.
  EventType type = 2;
  // Tenant scope (empty for platform-wide events like market bars).
  string tenant_id = 3;
  // Originating user, if any.
  string user_id = 4;
  // Event time, unix epoch milliseconds.
  int64 created_at_unix_ms = 5;
  // The serialized domain proto message (parsed according to `type`).
  bytes payload = 6;
  // Free-form context: correlation_id, trace_id, source_service, …
  map<string, string> metadata = 7;
}

// Every event the system emits. Grouped by domain; the trailing gaps leave room
// for the dormant taxonomy (notification, billing, auth, strategy) to light up.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;

  // Trading — order lifecycle (UI streams)
  EVENT_TYPE_ORDER_SUBMITTED = 1;
  EVENT_TYPE_ORDER_FILLED = 2;
  EVENT_TYPE_ORDER_CANCELLED = 3;
  EVENT_TYPE_ORDER_REJECTED = 4;
  EVENT_TYPE_ORDER_UPDATED = 5;

  // Trading — position lifecycle (UI streams)
  EVENT_TYPE_POSITION_OPENED = 10;
  EVENT_TYPE_POSITION_CLOSED = 11;
  EVENT_TYPE_POSITION_UPDATED = 12;

  // Ledger — fill + cash reservation (durable, consumed by portfolio)
  EVENT_TYPE_LEDGER_FILL = 20;
  EVENT_TYPE_LEDGER_RESERVATION = 21;

  // Backtest progress (UI stream)
  EVENT_TYPE_BACKTEST_PROGRESS = 30;

  // Market data — live bars (high-volume; carried raw, no envelope)
  EVENT_TYPE_BAR = 40;

  // Notification — user-directed messaging (durable, consumed by notification)
  EVENT_TYPE_NOTIFICATION = 50;

  // Reserved for the dormant taxonomy (billing 60+, auth/user 70+,
  // strategy 80+).
}

// Every user-facing notification flow. Grouped by producing domain; this is
// the single vocabulary for routing, preferences, and webhook event filters.
enum NotificationCategory {
  NOTIFICATION_CATEGORY_UNSPECIFIED = 0;

  // Money (portfolio)
  NOTIFICATION_CATEGORY_SLEEVE_FROZEN = 1;
  NOTIFICATION_CATEGORY_FILL_QUARANTINED = 2;
  NOTIFICATION_CATEGORY_EXTERNAL_TRADE_ADOPTED = 3;
  NOTIFICATION_CATEGORY_CORPORATE_ACTION_PROPOSED = 4;
  NOTIFICATION_CATEGORY_CORPORATE_ACTION_APPLIED = 5;

  // Trading
  NOTIFICATION_CATEGORY_ORDER_FILLED = 10;
  NOTIFICATION_CATEGORY_ORDER_REJECTED = 11;
  NOTIFICATION_CATEGORY_POSITION_OPENED = 12;
  NOTIFICATION_CATEGORY_POSITION_CLOSED = 13;
  NOTIFICATION_CATEGORY_POSITION_DRIFT = 14;
  NOTIFICATION_CATEGORY_RISK_BREACH = 15;
  NOTIFICATION_CATEGORY_EVALUATION_STALLED = 16;
  NOTIFICATION_CATEGORY_SYMBOL_NOT_TRADABLE = 17;
  NOTIFICATION_CATEGORY_CONNECTION_LOST = 18;
  NOTIFICATION_CATEGORY_STRATEGY_ERROR = 19;
  NOTIFICATION_CATEGORY_SESSION_STARTED = 20;
  NOTIFICATION_CATEGORY_SESSION_STOPPED = 21;
  NOTIFICATION_CATEGORY_SESSION_ERROR = 22;
  NOTIFICATION_CATEGORY_CIRCUIT_BREAKER_TRIGGERED = 23;
  NOTIFICATION_CATEGORY_CIRCUIT_BREAKER_RESET = 24;
  NOTIFICATION_CATEGORY_STOP_LOSS_HIT = 25;
  NOTIFICATION_CATEGORY_TAKE_PROFIT_HIT = 26;
  NOTIFICATION_CATEGORY_RECONCILIATION_DRIFT = 27;

  // Strategy lifecycle
  NOTIFICATION_CATEGORY_EXECUTION_STARTED = 40;
  NOTIFICATION_CATEGORY_EXECUTION_STOPPED = 41;
  NOTIFICATION_CATEGORY_FUNDING_FAILED = 42;
  NOTIFICATION_CATEGORY_SLEEVE_RELEASE_DEFERRED = 43;
  NOTIFICATION_CATEGORY_EXECUTION_CANCELLED = 44;
  NOTIFICATION_CATEGORY_PLAN_LIMIT_REACHED = 45;

  // Backtest
  NOTIFICATION_CATEGORY_BACKTEST_COMPLETED = 50;
  NOTIFICATION_CATEGORY_BACKTEST_FAILED = 51;

  // Billing
  NOTIFICATION_CATEGORY_PAYMENT_SUCCEEDED = 60;
  NOTIFICATION_CATEGORY_PAYMENT_FAILED = 61;
  NOTIFICATION_CATEGORY_TRIAL_ENDING = 62;
  NOTIFICATION_CATEGORY_SUBSCRIPTION_UPDATED = 63;
  NOTIFICATION_CATEGORY_SUBSCRIPTION_CANCELED = 64;

  // Auth and security
  NOTIFICATION_CATEGORY_WELCOME = 70;
  NOTIFICATION_CATEGORY_PASSWORD_CHANGED = 71;
  NOTIFICATION_CATEGORY_ACCOUNT_LOCKED = 72;
  NOTIFICATION_CATEGORY_EMAIL_VERIFICATION = 73;
  NOTIFICATION_CATEGORY_PASSWORD_RESET = 74;

  // Agent
  NOTIFICATION_CATEGORY_CONFIRMATION_PENDING = 80;

  // Generated by the notification service itself
  NOTIFICATION_CATEGORY_PRICE_ALERT_TRIGGERED = 90;
  NOTIFICATION_CATEGORY_WEBHOOK_DISABLED = 91;
}

enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;
  NOTIFICATION_SEVERITY_ACTIONABLE = 2;
  NOTIFICATION_SEVERITY_CRITICAL = 3;
  NOTIFICATION_SEVERITY_SECURITY = 4;
}

// Notification event — any service → notification (durable). Producers send
// the category plus machine-readable fields; rendering (title, body, email
// subject) happens in the notification service per (category, channel).
// Tenant/user scope and the deterministic dedup id ride the envelope.
message NotificationEvent {
  NotificationCategory category = 1;
  NotificationSeverity severity = 2;
  string execution_id = 3;
  string strategy_id = 4;
  string session_id = 5;
  string account_id = 6;
  string sleeve_id = 7;
  string backtest_id = 8;
  string symbol = 9;
  string amount = 10;  // decimal string, optional
  string reason = 11;  // optional
  map<string, string> extra = 12;
}

// Ledger fill — trading → portfolio (durable). Proto form of portfolio-ledger.md.
// Decimal amounts are strings (broker-faithful, no precision loss), matching the
// locked flat contract this replaces.
message LedgerFill {
  string tenant_id = 1;
  string account_id = 2;
  string sleeve_id = 3;
  string client_order_id = 4;
  string order_id = 5;
  string symbol = 6;
  string side = 7;  // buy | sell
  string qty = 8;
  string price = 9;
  string fees = 10;  // optional
  string cost_basis = 11;  // optional, sells only
  string realized_pnl = 12;  // optional, sells only
  string filled_at = 13;  // ISO-8601
}

// Cash reservation lifecycle — trading → portfolio. portfolio-ledger.md.
message LedgerReservation {
  string tenant_id = 1;
  string account_id = 2;
  string sleeve_id = 3;
  string client_order_id = 4;
  string event_type = 5;  // order_submitted | order_cancelled | order_rejected
  string reserved = 6;  // notional estimate (on submit), optional
  string symbol = 7;  // optional
  string side = 8;  // buy | sell, optional
  string order_id = 9;  // optional
}
